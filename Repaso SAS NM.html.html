   <li>Ejemplos: rellenos sanitarios en barrios pobres, Bhopal, exportación de residuos plásticos a países con menos ingresos, comunidades de la Amazonía afectadas por derrames petroleros.</li>
   <li>Cuando el daño recae en grupos por su raza o etnia se habla de <b>racismo ambiental</b>.</li></ul>`,
   tip:"Ten listo un ejemplo local y uno global, y explica qué papel tienen gobiernos, comunidades e individuos."},
  {c:"1.3.10",t:"Desigualdad y acceso a recursos",
   s:"Las desigualdades de ingresos, raza, género e identidad cultural dentro de las sociedades y entre ellas producen diferencias en el acceso al agua, los alimentos y la energía.",
   html:`<ul><li>Los hogares de bajos ingresos pagan proporcionalmente más por agua, electricidad o una dieta sana, o no tienen acceso.</li>
   <li><b>Interseccionalidad:</b> varias desigualdades se suman (por ejemplo, ser mujer, indígena y pobre).</li>
   <li><b>Caso:</b> la «Guerra del agua» de Cochabamba, Bolivia (2000). La privatización subió las tarifas, hubo protestas masivas, se revirtió la privatización y el caso impulsó el reconocimiento del agua como derecho humano.</li></ul>`,
   tip:"Relaciona la desigualdad con un recurso concreto y con una consecuencia concreta para la salud o el bienestar."},
  {c:"1.3.11",t:"De lo individual a lo global",
   s:"La sostenibilidad y la justicia ambiental se pueden aplicar desde la escala individual hasta la global.",
   html:`<div class="defgrid">
   <div class="def"><h4>Individual</h4><p>Reducir consumo, reciclar, elegir transporte público.</p></div>
   <div class="def"><h4>Empresa</h4><p>Políticas de cero residuos, cadenas de suministro justas.</p></div>
   <div class="def"><h4>Comunidad</h4><p>Huertos comunitarios, mingas, cooperativas.</p></div>
   <div class="def"><h4>Ciudad</h4><p>Transporte público, áreas verdes, gestión de residuos.</p></div>
   <div class="def"><h4>País</h4><p>Leyes ambientales, áreas protegidas, metas de emisiones.</p></div>
   <div class="def"><h4>Global</h4><p>Acuerdo de París, ODS, convenios internacionales.</p></div></div>
   <p style="margin-top:12px">Caso: el condado de Warren (Carolina del Norte, 1982), donde se instaló un vertedero de residuos tóxicos en una comunidad mayoritariamente afroamericana. Las protestas dieron origen al movimiento de justicia ambiental en EE. UU.</p>`,
   tip:"Una pregunta de escalas se responde bien con una tabla o párrafos ordenados de lo más pequeño a lo más grande."},
  {c:"1.3.12",t:"Indicadores de sostenibilidad",
   s:"Los indicadores de sostenibilidad incluyen medidas cuantitativas de biodiversidad, contaminación, población humana, cambio climático y capital material y económico.",
   html:`<ul><li><b>Biodiversidad:</b> especies indicadoras (índice biótico de Trent), índice de diversidad de Simpson.</li>
   <li><b>Contaminación:</b> concentración de partículas en el aire, nitratos en el agua.</li>
   <li><b>Clima:</b> concentración de CO₂, temperatura media.</li>
   <li><b>Socioeconómicos:</b> el <b>Índice de Desarrollo Humano (IDH)</b> combina salud (esperanza de vida), educación (años de escolaridad) e ingreso (INB per cápita).</li>
   <li>Limitaciones: ningún indicador capta todo; dependen de la calidad de los datos.</li></ul>`,
   tip:"Al analizar un indicador, di sus unidades y si un valor alto es bueno o malo. Ej.: IDH de 0 a 1, más alto es mejor."},
  {c:"1.3.13",t:"Huella ecológica",
   s:"El concepto de huella ecológica se puede usar para medir la sostenibilidad.",
   html:`<ul><li>La <b>huella ecológica</b> es el área de tierra y agua productiva que se necesita para producir los recursos que consume una persona o población y absorber sus residuos. Se mide en <b>hectáreas globales (hag)</b>.</li>
   <li>Aumenta con una dieta alta en carne, el uso de combustibles fósiles y el consumo de bienes.</li>
   <li>El <b>Día del Sobregiro de la Tierra</b> marca la fecha en que la humanidad ya usó todo lo que el planeta puede regenerar en un año. En los últimos años ha caído entre finales de julio y comienzos de agosto.</li></ul>
   <p>Calcula una huella aproximada en la pestaña <b>Practica</b>.</p>`,
   tip:"Si la huella es mayor que la biocapacidad, la población es insostenible: está consumiendo más de lo que su territorio puede regenerar."},
  {c:"1.3.14",t:"Huella de carbono y huella hídrica",
   s:"La huella de carbono mide la cantidad de gases de efecto invernadero producidos, en equivalentes de dióxido de carbono. La huella hídrica mide el volumen de agua dulce usado.",
   html:`<div class="defgrid">
   <div class="def"><h4>Huella de carbono</h4><p>Toneladas de CO₂ equivalente (CO₂e) por año. Incluye todos los gases de efecto invernadero convertidos a su efecto equivalente en CO₂.</p></div>
   <div class="def"><h4>Huella hídrica</h4><p>Metros cúbicos de agua por año. Incluye el agua que usamos directamente y la que se usó para producir lo que consumimos.</p></div></div>
   <p style="margin-top:12px">Ej.: un auto eléctrico contamina más al fabricarse (batería), pero a lo largo de su vida útil suele tener menor huella de carbono que uno a gasolina, sobre todo si la electricidad es renovable, como gran parte de la hidroeléctrica ecuatoriana.</p>`,
   tip:"Fíjate siempre en las unidades: CO₂e para carbono, m³ para agua, hag para huella ecológica."},
  {c:"1.3.15",t:"Biocapacidad",
   s:"La biocapacidad es la capacidad de un área biológicamente productiva para generar un suministro continuo de recursos renovables y absorber sus residuos.",
   html:`<ul><li>También se mide en hectáreas globales, así que se puede comparar directamente con la huella.</li>
   <li><b>Huella &gt; biocapacidad</b> = déficit ecológico (sobregiro). <b>Huella &lt; biocapacidad</b> = reserva ecológica.</li>
   <li>A escala mundial, la huella por persona supera a la biocapacidad por persona: usamos más de un planeta al año.</li>
   <li>La deforestación de la Amazonía y la sobrepesca reducen la biocapacidad.</li></ul>`,
   tip:"Para comparar huella y biocapacidad, usa la misma unidad (hag por persona) y concluye si hay déficit o reserva."},
  {c:"1.3.16",t:"Ciencia ciudadana",
   s:"La ciencia ciudadana tiene un papel en el monitoreo de los sistemas terrestres y en saber si los recursos se usan de forma sostenible.",
   html:`<ul><li>Personas sin formación científica profesional recogen datos que usan los científicos.</li>
   <li>Ejemplos: <b>eBird</b> (registro de aves), <b>Globe at Night</b> (contaminación lumínica), <b>iNaturalist</b> (fotos de especies).</li>
   <li>Caso: el Conteo Navideño de Aves, que se hace desde 1900 y es una de las series de datos de biodiversidad más largas del mundo.</li>
   <li>Ventaja: gran cantidad de datos a bajo costo. Limitación: la calidad de los datos puede variar.</li></ul>`,
   tip:"Si te piden evaluar la ciencia ciudadana, contrasta la cantidad de datos con su fiabilidad, y menciona cómo se controla la calidad."},
  {c:"1.3.17",t:"Marcos y modelos de sostenibilidad",
   s:"Existe una variedad de marcos y modelos que apoyan nuestra comprensión de la sostenibilidad, cada uno con sus usos y limitaciones.",
   html:`<ul><li><b>Triple resultado</b> (personas, planeta, ganancias): las empresas miden su impacto social y ambiental, no solo el económico.</li>
   <li><b>The Natural Step:</b> principios científicos para que una organización deje de dañar los sistemas naturales.</li>
   <li><b>Economía circular, límites planetarios, economía rosquilla</b> (ver 1.3.19 a 1.3.21).</li>
   <li>Usos: guiar políticas, educación y empresas. Limitaciones: simplifican la realidad y dependen de los datos.</li></ul>`,
   tip:"Todo modelo simplifica (subtema 1.2). Para evaluar uno, di qué ayuda a ver y qué deja fuera."},
  {c:"1.3.18",t:"Objetivos de Desarrollo Sostenible",
   s:"Los Objetivos de Desarrollo Sostenible (ODS) de la ONU son un conjunto de metas sociales y ambientales para guiar la acción hacia la sostenibilidad.",
   html:`<ul><li>17 objetivos adoptados en 2015 con meta en 2030. Ej.: fin de la pobreza (1), hambre cero (2), agua limpia (6), acción por el clima (13), vida submarina (14), vida de ecosistemas terrestres (15).</li>
   <li>Están interconectados: proteger los bosques (ODS 15) ayuda al clima (ODS 13).</li>
   <li>Críticas: son demasiados, algunos se contradicen (crecimiento económico vs. ambiente), no son obligatorios y el avance es lento.</li></ul>`,
   tip:"Ten dos ODS que puedas relacionar entre sí con un ejemplo concreto. Es una forma fácil de mostrar pensamiento de sistemas."},
  {c:"1.3.19",t:"Límites planetarios",
   s:"El modelo de los límites planetarios describe los nueve procesos y sistemas que han regulado la estabilidad de la Tierra en el Holoceno, y define un espacio operativo seguro para la humanidad.",
   html:`<ul><li>Propuesto en 2009 por Johan Rockström, Will Steffen y su equipo.</li>
   <li>Los nueve límites: cambio climático, acidificación oceánica, agotamiento del ozono estratosférico, ciclos de nitrógeno y fósforo, uso de agua dulce, cambio de uso del suelo, pérdida de biodiversidad, aerosoles atmosféricos y nuevas entidades (químicos, plásticos).</li>
   <li>Varios ya se han cruzado, entre ellos el cambio climático, la pérdida de biodiversidad y los ciclos de nitrógeno y fósforo.</li>
   <li>Limitaciones: no considera la justicia social, se sigue actualizando y los límites globales no siempre guían la acción local.</li></ul>
   <p class="tip" style="margin-top:8px"><b>Nota de nivel</b>El análisis cuantitativo de los límites (umbral de 350 ppm de CO₂, tasas de extinción, toneladas de nitrógeno y fósforo) es solo de Nivel Superior y no se incluye aquí.</p>`,
   tip:"Caso útil: la Gran Barrera de Coral, afectada a la vez por cambio climático, acidificación y pérdida de biodiversidad. Muestra cómo los límites están conectados."},
  {c:"1.3.20",t:"Economía rosquilla",
   s:"El modelo de la economía rosquilla es un marco para crear una economía regenerativa y distributiva que satisfaga las necesidades humanas dentro de los límites del planeta.",
   html:`<ul><li>Propuesto por la economista Kate Raworth.</li>
   <li><b>Base social</b> (anillo interior): necesidades básicas como salud, educación, agua y alimentos. Por debajo hay privación.</li>
   <li><b>Techo ecológico</b> (anillo exterior): los límites planetarios. Por encima hay sobregiro.</li>
   <li>Entre ambos está el <b>espacio seguro y justo</b>. Ningún país ha llegado a él: Reino Unido cubre las necesidades sociales pero supera el techo; Sri Lanka respeta el techo pero no cubre la base social.</li>
   <li><b>Regenerativa:</b> trabaja con los ciclos de la naturaleza. <b>Distributiva:</b> reparte la riqueza de forma más equitativa.</li></ul>`,
   tip:"Dibuja la rosquilla con sus dos anillos rotulados. A diferencia de los límites planetarios solos, incluye la justicia social."},
  {c:"1.3.21",t:"Economía circular",
   s:"La economía circular es un modelo que desvincula la actividad económica del consumo de recursos finitos.",
   html:`<ul><li><b>Economía lineal:</b> extraer → fabricar → desechar.</li>
   <li><b>Tres principios de la circular:</b> eliminar residuos y contaminación desde el diseño; mantener productos y materiales en uso (reutilizar, reparar, remanufacturar, reciclar); regenerar la naturaleza.</li>
   <li><b>Diagrama de mariposa</b> (Fundación Ellen MacArthur): el <b>ciclo técnico</b> mantiene en uso los materiales no biodegradables; el <b>ciclo biológico</b> devuelve a la naturaleza los biodegradables mediante compostaje o digestión.</li>
   <li>Limitaciones: falta de conocimiento y dinero en las empresas, pocas leyes que la exijan y productos que no se pueden rediseñar.</li></ul>`,
   tip:"Aprende a ubicar un ejemplo en el ciclo correcto: reparar un celular es técnico; compostar restos de comida es biológico."}
 ],
 casesIntro:"Estos casos cubren colapso de recursos, justicia ambiental y modelos de desarrollo. Para cada uno, identifica qué pilar falló o se fortaleció y a qué escala ocurre.",
 cases:[
  {t:"Colapso del bacalao del Atlántico",u:"1.3.7",vid:"3fCX6XKzbUY",
   bg:"Durante siglos, el bacalao frente a Terranova (Canadá) parecía inagotable. Desde mediados del siglo XX, grandes barcos industriales aumentaron enormemente las capturas. Las cuotas eran demasiado altas y se ignoraron advertencias científicas. En 1992 Canadá declaró una moratoria total de pesca y decenas de miles de personas perdieron su empleo.",
   st:[["Ecológico","","La población cayó a una fracción mínima de su tamaño histórico y el ecosistema cambió."],["Económico","","Colapso de una industria entera y de las economías de los pueblos costeros."],["Social","","Pérdida de empleos, migración y de una forma de vida tradicional."],["Respuesta","","Moratoria, cuotas basadas en ciencia y áreas marinas protegidas."]],
   q:["Explica por qué la pesca del bacalao fue insostenible.","Relaciona este caso con el concepto de punto de inflexión (1.2).","¿Qué lecciones aplicarías a la pesca de atún o dorado en Ecuador?"]},
  {t:"La Guerra del agua de Cochabamba (Bolivia)",u:"1.3.10",vid:"WIO0wCKnsc8",
   bg:"En 1999 el servicio de agua de Cochabamba se entregó a un consorcio privado. Las tarifas subieron mucho, y para muchas familias el agua llegó a costar una parte importante de sus ingresos. En 2000 hubo protestas masivas. El gobierno revirtió la privatización. El caso se convirtió en símbolo mundial del agua como derecho humano.",
   st:[["Familias de bajos ingresos","","Las más afectadas por las nuevas tarifas."],["Consorcio privado","","Buscaba recuperar su inversión con tarifas más altas."],["Gobierno","","Primero privatizó y luego revirtió la decisión ante las protestas."]],
   q:["¿Cómo afecta la desigualdad de ingresos al acceso al agua?","¿Es el agua un bien económico o un derecho humano? Discute.","¿Qué pilar de la sostenibilidad se descuidó?"]},
  {t:"Turismo sostenible en Costa Rica",u:"1.3.6",vid:"5X0H_2HjWgI",
   bg:"Costa Rica protege más de una cuarta parte de su territorio, paga a propietarios de tierras por conservar bosques (pago por servicios ambientales) y certifica a las empresas turísticas según su desempeño ambiental y social. El ecoturismo es una de sus principales fuentes de ingresos.",
   st:[["Ambiental","","Recuperación de la cobertura forestal y protección de la biodiversidad."],["Económico","","Ingresos del turismo que dependen de mantener la naturaleza."],["Social","","Turismo comunitario que reparte beneficios a la población local."]],
   q:["¿Cómo se combinan los tres pilares en este caso?","¿Qué riesgos tiene depender del turismo?","¿Qué podría aprender Ecuador de este modelo?"]},
  {t:"Bután y la Felicidad Nacional Bruta",u:"1.3.8",vid:"7Lc_dlVrg5M",
   bg:"Bután mide su progreso con la Felicidad Nacional Bruta en lugar de solo el PIB. El índice incluye bienestar psicológico, salud, educación, cultura, buen gobierno, vitalidad comunitaria, conservación ambiental y nivel de vida. Su constitución exige mantener al menos el 60 % del país con bosques, y el país absorbe más carbono del que emite.",
   st:[["Fortaleza","","Toma en cuenta el capital natural y el bienestar, no solo la producción."],["Limitación","","Es difícil de medir y comparar con otros países; el bienestar es en parte subjetivo."]],
   q:["Compara el PIB con la Felicidad Nacional Bruta.","¿Por qué el PIB puede llevar a decisiones insostenibles?"]},
  {t:"Condado de Warren: el origen de la justicia ambiental",u:"1.3.9 · 1.3.11",vid:"HFfoStNVZ8k",
   bg:"En 1982, el estado de Carolina del Norte decidió enterrar suelo contaminado con PCB (químicos tóxicos) en un vertedero del condado de Warren, una comunidad pobre y mayoritariamente afroamericana. Los vecinos protestaron y cientos fueron arrestados. Aunque el vertedero se construyó, el caso dio origen al movimiento de justicia ambiental en Estados Unidos.",
   st:[["Comunidad local","","Recibió un riesgo que otras zonas más ricas no aceptaron."],["Gobierno estatal","","Eligió el sitio; fue acusado de racismo ambiental."],["Movimiento social","","Llevó el tema a escala nacional y cambió las leyes y estudios posteriores."]],
   q:["¿Por qué este caso es un ejemplo de racismo ambiental?","Describe cómo el caso pasó de la escala local a la nacional."]},
  {t:"Galápagos: turismo y capacidad de carga",u:"1.3.3 · 1.3.13",vid:null,local:true,
   bg:"Galápagos es Patrimonio Natural de la Humanidad y uno de los lugares más estudiados en ecología. El turismo es la principal fuente de ingresos de las islas, pero el número de visitantes y residentes ha crecido mucho. Más personas implica más agua, energía, residuos, transporte y riesgo de introducir especies invasoras. Para controlar la presión, Ecuador regula el número de cupos en sitios y embarcaciones y cobra una tasa de ingreso al parque a los visitantes.",
   st:[["Ambiental","","Especies endémicas vulnerables a invasoras y a la contaminación."],["Económico","","El turismo financia a la población local y la conservación."],["Social","","Los residentes necesitan servicios, empleo y agua dulce, que es escasa."]],
   q:["Explica cómo el turismo aumenta la huella ecológica de las islas.","Evalúa si limitar los visitantes es una buena estrategia de sostenibilidad.","¿Qué ODS se relacionan con este caso?"]}
 ],

function practice13(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Sostenibilidad fuerte y débil</h3><span class="eyebrow">1.3.2</span></div>
   <p class="prose" style="margin:6px 0 10px">Cambia de modelo y observa cómo se relacionan los tres pilares.</p>
   <div class="seg" id="smode"><button class="opt" data-m="weak" aria-pressed="true">Modelo débil</button><button class="opt" data-m="strong" aria-pressed="false">Modelo fuerte</button></div>
   <div class="graph" id="sdiag" style="margin-top:10px"></div><div class="detail" id="sdet" style="margin-top:10px"></div></div>
  <div class="card" id="pilbox"></div>
  <div class="card"><div class="rowhead"><h3>Calcula una huella ecológica aproximada</h3><span class="eyebrow">1.3.13 · 1.3.15</span></div>
   <p class="prose" style="margin:6px 0 10px">Elige la opción que más se parece a tu vida. El resultado es una <b>estimación ilustrativa</b> para entender el concepto, no un cálculo oficial. Para tu huella real usa la calculadora de la <a href="https://www.footprintcalculator.org/" target="_blank" rel="noopener">Global Footprint Network</a>.</p>
   <div id="fpq" style="display:grid;gap:12px"></div>
   <div class="scorebox" style="margin-top:14px"><div><span class="eyebrow">Tu huella estimada</span><div><b id="fpv">–</b> <span style="color:var(--muted)">hag por persona</span></div></div><div><span class="eyebrow">Planetas necesarios</span><div><b id="fpp">–</b></div></div></div>
   <div class="detail" id="fpd" style="margin-top:10px"></div></div>
  <div class="card"><div class="rowhead"><h3>Los nueve límites planetarios</h3><span class="eyebrow">1.3.19 · 1.3.20</span></div>
   <p class="prose" style="margin:6px 0 10px">Toca cada límite para ver qué mide y su estado según la actualización científica de 2023. En la economía rosquilla, estos límites forman el techo ecológico.</p>
   <div class="opts" id="pbl"></div><div class="detail" id="pbd" style="margin-top:10px">Elige un límite.</div></div>
  <div class="card" id="circbox"></div>`;
  // strong/weak
  let m="weak";
  const sd=()=>{
    const W=520,H=300;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama del modelo de sostenibilidad ${m==="weak"?"débil":"fuerte"}">`;
    const lab=(x,y,t)=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">${t}</text>`;
    if(m==="weak"){
      g+=`<circle cx="200" cy="120" r="90" fill="var(--eco)" fill-opacity=".28" stroke="var(--eco)" stroke-width="2"/><circle cx="320" cy="120" r="90" fill="var(--antropo)" fill-opacity=".28" stroke="var(--antropo)" stroke-width="2"/><circle cx="260" cy="210" r="90" fill="var(--tecno)" fill-opacity=".28" stroke="var(--tecno)" stroke-width="2"/>`;
      g+=lab(165,100,"Ambiental")+lab(355,100,"Social")+lab(260,262,"Económico")+`<text x="260" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">Sostenible</text>`;
    }else{
      g+=`<circle cx="260" cy="150" r="140" fill="var(--eco)" fill-opacity=".25" stroke="var(--eco)" stroke-width="2"/><circle cx="260" cy="175" r="95" fill="var(--antropo)" fill-opacity=".3" stroke="var(--antropo)" stroke-width="2"/><circle cx="260" cy="200" r="50" fill="var(--tecno)" fill-opacity=".35" stroke="var(--tecno)" stroke-width="2"/>`;
      g+=lab(260,40,"Ambiente")+lab(260,105,"Sociedad")+lab(260,205,"Economía");
    }
    g+=`</svg>`;$("#sdiag").innerHTML=g;
    $("#sdet").innerHTML=m==="weak"
     ?"<b>Modelo débil.</b> Los tres pilares pesan lo mismo y solo la zona central es sostenible. Supone que se puede compensar: perder un bosque es aceptable si deja suficiente dinero o infraestructura."
     :"<b>Modelo fuerte.</b> La economía existe dentro de la sociedad, y la sociedad dentro del ambiente. Si se destruye el ambiente, colapsan los otros dos. El capital natural no se puede reemplazar.";
  };
  p.querySelectorAll("#smode .opt").forEach(b=>b.onclick=()=>{m=b.dataset.m;p.querySelectorAll("#smode .opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));sd()});sd();
  classifier($("#pilbox"),"¿Qué pilar de la sostenibilidad?","1.3.3 · 1.3.4 · 1.3.5 · Elige el pilar que mejor representa cada acción.",PIL_ITEMS,PIL_CATS);
  classifier($("#circbox"),"¿Ciclo técnico, biológico o modelo lineal?","1.3.21 · Ubica cada práctica en el diagrama de mariposa.",CIRC_ITEMS,CIRC_CATS);
  // footprint
  const sel=FP_Q.map(()=>1);
  $("#fpq").innerHTML=FP_Q.map((q,i)=>`<div><div style="font-weight:600;margin-bottom:4px">${q[0]}</div><div class="seg" data-q="${i}">${q[1].map((o,j)=>`<button class="opt" data-j="${j}" aria-pressed="${j===1}">${o[0]}</button>`).join("")}</div></div>`).join("");
  const fp=()=>{
    const v=0.3+FP_Q.reduce((s,q,i)=>s+q[1][sel[i]][1],0);
    const planets=v/1.5;
    $("#fpv").textContent=v.toFixed(1);$("#fpp").textContent=planets.toFixed(1);
    $("#fpd").innerHTML=`La biocapacidad mundial ronda <b>1,5 hag por persona</b>. Si todos vivieran como tú, la humanidad necesitaría unos <b>${planets.toFixed(1)} planetas</b>. ${planets>1?"Tu estilo de vida está en déficit ecológico. Mira qué categoría suma más y piensa qué podrías cambiar.":"Tu estilo de vida cabe dentro de la biocapacidad del planeta."}`;
  };
  p.querySelectorAll("#fpq .seg").forEach(s=>s.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sel[+s.dataset.q]=+b.dataset.j;s.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));fp()}));fp();
  // boundaries
  const PB=[["Cambio climático","cruzado","Mide la concentración de CO₂ y el balance de energía de la Tierra. Causado sobre todo por quemar combustibles fósiles y deforestar."],["Pérdida de biodiversidad","cruzado","Mide la tasa de extinción y la integridad de los ecosistemas. Las extinciones actuales superan muchas veces la tasa natural."],["Ciclos de nitrógeno y fósforo","cruzado","Exceso de fertilizantes que llegan a ríos y mares y causan eutrofización y zonas muertas."],["Cambio de uso del suelo","cruzado","Pérdida de bosques para agricultura y ciudades."],["Uso de agua dulce","cruzado","Alteración del agua de ríos y del agua del suelo por extracción y cambios de uso."],["Nuevas entidades","cruzado","Químicos sintéticos, plásticos y otros materiales nuevos que liberamos sin saber bien sus efectos."],["Acidificación oceánica","en riesgo","El océano absorbe CO₂ y se vuelve más ácido, lo que daña corales y moluscos. En 2023 estaba cerca del límite; un informe de 2025 lo consideró cruzado."],["Aerosoles atmosféricos","dentro del límite a nivel global","Partículas en el aire que afectan el clima y la salud. A escala global está dentro del límite, pero hay regiones muy afectadas."],["Ozono estratosférico","dentro del límite","Se recupera gracias al Protocolo de Montreal (1987). Es el ejemplo de que la acción internacional funciona."]];
  $("#pbl").innerHTML=PB.map((x,i)=>`<button class="opt" data-i="${i}" style="border-color:${x[1]==="cruzado"?"var(--bad)":x[1]==="en riesgo"?"var(--ochre)":"var(--ok)"}">${x[0]}</button>`).join("");
  p.querySelectorAll("#pbl .opt").forEach(b=>b.onclick=()=>{const x=PB[+b.dataset.i];const c=x[1]==="cruzado"?"var(--bad)":x[1]==="en riesgo"?"var(--ochre)":"var(--ok)";$("#pbd").innerHTML=`<b>${x[0]}</b> · <span style="color:${c};font-family:var(--f-mono);font-size:.8rem;text-transform:uppercase">${x[1]}</span><br>${x[2]}`});
}

const S21={
 code:"2.1",title:"Individuos, poblaciones, comunidades y ecosistemas",hours:"6 horas de clase",src:"https://www.mrgscience.com/ess-subtopic-218203-individuals-populations-communities-and-ecosystems.html",
 intro:"La ecología estudia los seres vivos en niveles que van del individuo a la biosfera. Este subtema explica cómo se organizan e identifican las especies, qué controla el tamaño de una población, cómo se miden las poblaciones en el campo y por qué algunas especies sostienen a todo su ecosistema. Incluye las técnicas de muestreo que aparecen en las preguntas de datos del examen.",
 guiding:["¿Cómo se estudian los niveles de organización de los seres vivos?","¿Qué factores determinan el tamaño y la distribución de las poblaciones?"],
 und:[
  {c:"2.1.1",t:"La biosfera",
   s:"La biosfera es un sistema ecológico compuesto por los individuos, poblaciones, comunidades y ecosistemas de la Tierra.",
   html:`<p>La biosfera es la suma de todos los ecosistemas: todos los seres vivos y sus interacciones con la litosfera, la hidrosfera y la atmósfera.</p>

  {c:"2.1.2",t:"La especie",

  {c:"2.1.3",t:"Clasificación y nomenclatura binomial",

   html:`<div class="defgrid">
   <div class="def"><h4>Bióticos</h4><p>Seres vivos y sus interacciones: competencia, depredación, simbiosis, enfermedades. Se agrupan en productores, consumidores y descomponedores.</p></div>

   <li>Si dos especies comparten el mismo nicho, compiten.</li>

   tip:"Hábitat = la «dirección» de la especie. Nicho = su «profesión»: qué hace y qué necesita. No los confundas."},
  {c:"2.1.9",t:"Interacciones entre poblaciones",

   html:`<div class="defgrid">
   <div class="def"><h4>Herbivoría</h4><p>Un animal come plantas. Ej.: tortuga gigante comiendo cactus.</p></div>
   <div class="def"><h4>Depredación</h4><p>Un animal caza y mata a otro para comérselo. Ej.: gavilán de Galápagos y lagartija.</p></div>
   <div class="def"><h4>Parasitismo</h4><p>Uno se beneficia y el huésped es perjudicado, normalmente sin morir pronto. Ej.: garrapata en una vaca.</p></div>
   <div class="def"><h4>Mutualismo</h4><p>Ambos se benefician. Ej.: acacias y hormigas; colibríes y flores.</p></div>
   <div class="def"><h4>Competencia</h4><p>Por recursos limitados. <b>Intraespecífica</b>: dentro de la misma especie. <b>Interespecífica</b>: entre especies distintas.</p></div>

   tip:"Diferencia depredador y parásito: el depredador mata rápido y come muchas presas; el parásito vive a costa de un huésped durante mucho tiempo."},
  {c:"2.1.10",t:"Capacidad de carga",
   s:"La capacidad de carga es el tamaño máximo de una población que un ambiente puede sostener indefinidamente.",
   html:`<ul><li>Depende de los recursos: alimento, agua, espacio, refugio.</li>
   <li>Si los recursos cambian, la capacidad de carga cambia. Ej.: el deshielo reduce el hábitat de caza del oso polar.</li>
   <li>Se simboliza con <b>K</b> en las gráficas de crecimiento.</li></ul>`,
   tip:"Usa la palabra «indefinidamente» o «a largo plazo» en tu definición. Una población puede superar K por poco tiempo, pero no mantenerse ahí."},
  {c:"2.1.11",t:"Regulación de poblaciones",
   s:"Las poblaciones se regulan por factores que dependen o no de la densidad.",
   html:`<div class="defgrid">
   <div class="def"><h4>Dependientes de la densidad</h4><p>Su efecto aumenta cuanto más densa es la población: competencia, depredación, enfermedades. Actúan como retroalimentación negativa.</p></div>
   <div class="def"><h4>Independientes de la densidad</h4><p>Afectan igual sin importar la densidad: incendios, inundaciones, sequías, un fenómeno de El Niño, erupciones volcánicas.</p></div></div>`,
   tip:"Ejemplo fácil: una enfermedad se contagia más en una población densa (dependiente); una tormenta mata igual a 10 o a 1000 aves (independiente)."},
  {c:"2.1.12",t:"Curvas de crecimiento",
   s:"Las poblaciones pueden mostrar crecimiento exponencial (curva J) o logístico (curva S).",
   html:`<div class="defgrid">
   <div class="def"><h4>Curva J (exponencial)</h4><p>Sin límites, la población se duplica una y otra vez. Suele terminar en un colapso.</p></div>
   <div class="def"><h4>Curva S (logística)</h4><p>Fase lenta, fase exponencial, desaceleración por resistencia ambiental y estabilización en la capacidad de carga.</p></div>
   <div class="def"><h4>Auge y colapso</h4><p>La población supera la capacidad de carga, agota recursos y cae bruscamente.</p></div></div>
   <p style="margin-top:12px">Caso: los renos de la isla St. Matthew (Alaska). Ver pestaña <b>Casos</b> y la gráfica en <b>Practica</b>.</p>`,
   tip:"Al dibujar la curva S, rotula sus fases y marca K con una línea horizontal punteada. Las etiquetas valen puntos."},
  {c:"2.1.13",t:"La población humana",
   s:"La población humana ha crecido rápidamente porque se han eliminado muchos factores limitantes.",
   html:`<ul><li>La medicina, el saneamiento, las vacunas y la Revolución Verde en la agricultura redujeron la mortalidad y aumentaron el alimento disponible.</li>
   <li>Consecuencias: agotamiento de recursos, destrucción de hábitats, contaminación y desequilibrio de ecosistemas.</li>
   <li>Se relaciona con la huella ecológica (1.3.13).</li></ul>`,
   tip:"Nombra factores limitantes concretos que se superaron (enfermedades, escasez de alimentos) y la tecnología que lo hizo posible."},
  {c:"2.1.14",t:"La capacidad de carga humana",
   s:"Es difícil determinar la capacidad de carga de la población humana.",
   html:`<ul><li>Los humanos amplían su nicho con tecnología (desalinizar agua, fertilizantes).</li>
   <li>Importan recursos de otras regiones, así que una ciudad puede superar la capacidad de su propio territorio.</li>
   <li>El consumo varía mucho entre personas y países.</li>
   <li>Se puede estimar a partir de la huella ecológica.</li></ul>`,
   tip:"Da al menos dos razones distintas. Las más usadas: tecnología e importación de recursos."},
  {c:"2.1.15",t:"Métodos de muestreo",
   s:"El muestreo aleatorio, sistemático y por transectos se usa para estimar la abundancia de las poblaciones.",
   html:`<div class="defgrid">
   <div class="def"><h4>Aleatorio</h4><p>Cada punto tiene la misma probabilidad de ser elegido (coordenadas con números aleatorios). Evita el sesgo. Útil en zonas homogéneas.</p></div>
   <div class="def"><h4>Sistemático</h4><p>Muestras a intervalos regulares, por ejemplo cada 5 m. Fácil de aplicar.</p></div>
   <div class="def"><h4>Transecto</h4><p>Muestras a lo largo de una línea que cruza un gradiente ambiental, por ejemplo del mar hacia tierra en un manglar. <b>De línea</b>: se anota lo que toca la cuerda. <b>De banda</b>: se usan cuadrantes a lo largo de la línea.</p></div></div>`,
   tip:"Elige el método según el lugar: aleatorio si es homogéneo, transecto si hay un gradiente (altitud, humedad, distancia a la costa)."},
  {c:"2.1.16",t:"Cuadrantes",
   s:"El muestreo aleatorio con cuadrantes se usa para estimar la abundancia de organismos que no se mueven.",
   html:`<p>Un cuadrante es un marco cuadrado (por ejemplo, 1 m × 1 m) que se coloca en el suelo para contar lo que hay dentro.</p>
   <div class="defgrid">
   <div class="def"><h4>Densidad</h4><p>D = n / A. Número de individuos dividido por el área muestreada (individuos/m²).</p></div>
   <div class="def"><h4>Porcentaje de cobertura</h4><p>Proporción del cuadrante cubierta por una especie. Útil para pastos o algas, que no se pueden contar uno a uno.</p></div>
   <div class="def"><h4>Frecuencia</h4><p>Porcentaje de cuadrantes en los que aparece la especie.</p></div></div>
   <p style="margin-top:12px">Prueba el simulador de cuadrantes en la pestaña <b>Practica</b>.</p>`,
   tip:"Más cuadrantes = estimación más fiable. Si te piden mejorar un muestreo, propón aumentar el número de cuadrantes y colocarlos al azar."},
  {c:"2.1.17",t:"Organismos móviles: índice de Lincoln",
   s:"El método de captura, marcado, liberación y recaptura (índice de Lincoln) se usa para estimar la población de organismos móviles.",
   html:`<ol><li>Captura una primera muestra (<b>n₁</b>), márcala sin dañar a los animales y libérala.</li>
   <li>Espera a que se mezclen con el resto de la población.</li>
   <li>Captura una segunda muestra (<b>n₂</b>) y cuenta cuántos están marcados (<b>n<sub>m</sub></b>).</li></ol>
   <p style="font-family:var(--f-mono);font-size:1.05rem;background:var(--sunk);padding:10px 14px;border-radius:8px;display:inline-block">N = (n₁ × n₂) / n<sub>m</sub></p>
   <p><b>Supuestos:</b> población cerrada (sin nacimientos, muertes ni migración entre muestreos), mezcla completa, la marca no afecta la supervivencia ni se pierde, y todos tienen la misma probabilidad de ser capturados.</p>
   <p><b>Problemas:</b> marcas que se borran, animales que aprenden a evitar la trampa (o a buscarla), daño al animal.</p>`,
   tip:"Revisa siempre los supuestos: en el examen suelen preguntar por qué una estimación puede ser incorrecta. Practica con el simulador de la pestaña Practica."},
  {c:"2.1.18",t:"Comunidad",
   s:"Una comunidad es un grupo de poblaciones que viven e interactúan en la misma área.",
   html:`<ul><li>Las comunidades con mayor diversidad suelen ser más resilientes que las de baja diversidad (ver 1.2.17).</li>
   <li>Ej.: la comunidad de un manglar incluye mangle rojo, cangrejos rojos, ostiones, garzas, peces juveniles y bacterias del sedimento.</li></ul>`,
   tip:"Comunidad = solo seres vivos (varias especies). Ecosistema = comunidad + ambiente físico."},
  {c:"2.1.19",t:"Hábitat",
   s:"El hábitat es el lugar donde vive una comunidad, especie, población u organismo.",
   html:`<ul><li>Incluye la ubicación geográfica, las condiciones físicas y el tipo de ecosistema.</li>
   <li>Ej.: el hábitat del oso de anteojos son los bosques nublados y páramos de los Andes.</li>
   <li>Proteger el hábitat es la forma más eficaz de proteger a las especies.</li></ul>`,
   tip:"Relaciona hábitat con conservación: la pérdida de hábitat es la principal causa de pérdida de biodiversidad."},
  {c:"2.1.20",t:"El ecosistema como sistema abierto",
   s:"Un ecosistema es una comunidad y el ambiente físico con el que interactúa. Es un sistema abierto que intercambia energía y materia con su entorno.",
   html:`<ul><li>Entra luz solar; sale calor por la respiración.</li>
   <li>La materia (nutrientes) se recicla gracias a los descomponedores, pero también entra y sale (sedimentos de un río, animales que migran).</li></ul>`,
   tip:"Vincula este punto con 1.2.5: los ecosistemas son abiertos porque intercambian materia y energía."},
  {c:"2.1.21",t:"Ecosistemas sostenibles",
   s:"Los ecosistemas pueden ser sostenibles durante largos periodos de tiempo.",
   html:`<ul><li><b>Entradas:</b> luz solar, nutrientes, agua.</li>
   <li><b>Procesos:</b> fotosíntesis, ciclo de nutrientes, descomposición.</li>
   <li><b>Salidas:</b> calor de la respiración, transpiración.</li>
   <li>Las selvas tropicales llevan millones de años funcionando. Su resiliencia depende de la biodiversidad y de los grandes almacenes de biomasa.</li></ul>`,
   tip:"Un ecosistema natural es sostenible porque recicla la materia y depende de una fuente de energía renovable: el sol."},
  {c:"2.1.22",t:"Puntos de inflexión en ecosistemas",
   s:"Las actividades humanas pueden afectar la sostenibilidad de los ecosistemas y llevarlos a puntos de inflexión.",
   html:`<ul><li><b>Impactos directos:</b> sobreexplotación, caza furtiva, tala.</li>
   <li><b>Impactos indirectos:</b> pérdida de hábitat, cambio climático, contaminación, especies invasoras.</li>
   <li>Ej.: la deforestación de la Amazonía reduce la transpiración y la lluvia; si se supera un umbral, el bosque podría convertirse en una sabana.</li></ul>`,
   tip:"Clasifica cada impacto como directo o indirecto antes de explicarlo; ordena mejor tu respuesta."},
  {c:"2.1.23",t:"Especies clave",
   s:"Las especies clave tienen un efecto desproporcionado sobre la estructura de su ecosistema.",
   html:`<ul><li>La estrella de mar púrpura controla a los mejillones; sin ella, los mejillones desplazan a muchas otras especies.</li>
   <li>Los elefantes africanos mantienen abiertas las sabanas al derribar árboles.</li>
   <li>Los lobos de Yellowstone y los castores también son especies clave.</li>
   <li>Si se elimina una especie clave se produce una <b>cascada trófica</b> y se pierde biodiversidad.</li></ul>`,
   tip:"Para explicar una especie clave, describe qué pasa si desaparece. Ese «efecto en cadena» es lo que demuestra que es clave."},
  {c:"2.1.24",t:"La integridad de la biosfera",
   s:"Las presiones humanas sobre los ecosistemas han llevado a cruzar el límite planetario de la integridad de la biosfera.",
   html:`<ul><li>Las poblaciones de vertebrados silvestres monitoreadas se redujeron en promedio alrededor de un 70 % en los últimos 50 años, según el Informe Planeta Vivo.</li>
   <li>Muchas poblaciones de insectos están disminuyendo, lo que afecta a la polinización y a las redes tróficas.</li>
   <li>Se conecta con los límites planetarios del subtema 1.3.19.</li></ul>`,
   tip:"Cuando cites una cifra, di de dónde viene (por ejemplo, el Informe Planeta Vivo de WWF). Demuestra que usas evidencia."},
  {c:"2.1.25",t:"Recuperar la integridad de los ecosistemas",
   s:"Mantener la integridad de los ecosistemas es esencial para evitar puntos de inflexión y para el bienestar humano a largo plazo.",
   html:`<ul><li>Estrategias: áreas protegidas, restauración, uso sostenible del suelo, control de la contaminación y regeneración activa (resilvestrar, reforestar, recuperar humedales).</li>
   <li>Ej.: reservas marinas que permiten la recuperación de peces y corales.</li>
   <li>Caso: la restauración de los Everglades en Florida, uno de los proyectos de restauración ecológica más grandes del mundo.</li></ul>`,
   tip:"Propón estrategias concretas y explica qué factor del ecosistema mejoran (más hábitat, más diversidad, menos contaminación)."}
 ],
 casesIntro:"Estos casos ilustran crecimiento poblacional, especies clave y restauración. Para cada uno identifica los factores limitantes y si la regulación fue dependiente o independiente de la densidad.",
 cases:[
  {t:"Los renos de la isla St. Matthew",u:"2.1.10 · 2.1.12",vid:null,
   bg:"En 1944 se llevaron 29 renos a la isla St. Matthew (Alaska), donde no había depredadores y abundaba el liquen. La población creció hasta unos 6000 en 1963. Habían agotado el liquen, que tarda décadas en recuperarse. Tras un invierno muy duro, en 1966 solo quedaban 42 renos. Unos años después la población desapareció.",
   st:[["Factor limitante","","El alimento (liquen), que se regenera muy lentamente."],["Sin depredadores","","Faltó la retroalimentación negativa que regula la población."],["Tipo de curva","","Curva J seguida de colapso: auge y colapso."]],
   q:["Dibuja la curva de población y marca dónde se superó la capacidad de carga.","¿Fue el colapso causado por factores dependientes o independientes de la densidad? Justifica.","¿Qué lección deja este caso sobre la población humana?"]},
  {t:"Las cabras de Galápagos y el Proyecto Isabela",u:"2.1.10 · 2.1.22",vid:null,local:true,
   bg:"Las cabras introducidas por balleneros y colonos se multiplicaron sin depredadores en varias islas de Galápagos. Comían la vegetación de la que dependían las tortugas gigantes y otras especies, y provocaban erosión. El Proyecto Isabela, a cargo del Parque Nacional Galápagos y la Fundación Charles Darwin, eliminó más de cien mil cabras de Santiago, Pinta y el norte de Isabela a mediados de la década de 2000. La vegetación se recuperó y se pudieron reintroducir tortugas.",
   st:[["Especie invasora","","Sin depredadores, la cabra superó la capacidad de carga y degradó el hábitat."],["Tortugas gigantes","","Competían por el alimento con las cabras y perdían."],["Gestión","","Erradicación y luego restauración: regeneración activa del ecosistema."]],
   q:["¿Por qué las cabras crecieron sin control en las islas?","Clasifica la competencia entre cabras y tortugas: ¿intra o interespecífica?","¿Es la erradicación una buena estrategia? Considera distintas perspectivas (1.1)."]},
  {t:"La estrella de mar púrpura: el origen del concepto de especie clave",u:"2.1.23",vid:null,
   bg:"En la década de 1960, el ecólogo Robert Paine retiró estrellas de mar púrpura de una zona rocosa en la costa del Pacífico de EE. UU. Sin su depredador, los mejillones se apoderaron de las rocas y desplazaron a la mayoría de las demás especies. La diversidad de la zona se desplomó. Paine acuñó el término «especie clave».",
   st:[["Estrella de mar","","Depredador que mantiene a raya a los mejillones."],["Mejillones","","Competidor dominante que, sin control, ocupa todo el espacio."],["Otras especies","","Algas, percebes y caracoles que desaparecen sin la estrella."]],
   q:["Explica qué es una cascada trófica usando este ejemplo.","¿Qué especie podría ser clave en un manglar ecuatoriano? Justifica."]},
  {t:"El castor: ingeniero del ecosistema",u:"2.1.8 · 2.1.23",vid:"roLn0EK05aM",
   bg:"El castor norteamericano construye represas que transforman arroyos en estanques y humedales. Así almacena agua, filtra sedimentos, crea hábitat para peces, anfibios y aves, y reduce la propagación de incendios. Pero sus represas también pueden inundar caminos y cultivos.",
   st:[["Nicho","","Usa árboles como alimento y material; modifica el agua de su entorno."],["Beneficio para otras especies","","Crea humedales con alta biodiversidad."],["Conflicto humano","","Inundaciones en zonas agrícolas o urbanas."]],
   q:["Describe el nicho del castor.","¿Por qué se considera una especie clave?"]},
  {t:"Restauración de los Everglades (Florida)",u:"2.1.25",vid:"98d8p49XJGM",
   bg:"Los Everglades son un gran humedal subtropical que fue drenado para la agricultura y las ciudades. En 2000, el Congreso de EE. UU. aprobó un plan de restauración para captar agua que se perdía en el mar, mejorar su calidad, eliminar especies invasoras y restaurar el flujo natural. Hay señales de recuperación de cocodrilos y manatíes, pero el proyecto enfrenta falta de fondos, conflictos políticos y la subida del nivel del mar.",
   st:[["Problema","","Drenaje y contaminación por fertilizantes alteraron el flujo de agua."],["Estrategia","","Restaurar el agua, eliminar invasoras y replantar especies nativas."],["Desafíos","","Financiamiento, política y cambio climático."]],
   q:["¿Qué estrategias de 2.1.25 se aplican en este proyecto?","¿Por qué es más difícil restaurar un ecosistema que protegerlo antes de dañarlo?"]}
 ],

 quiz:[
  {s:"Un caballo y un burro producen una mula estéril. Esto demuestra que:",o:["Son la misma especie","Son especies distintas porque la descendencia no es fértil","Son la misma población","Comparten el mismo nicho"],a:1,e:"La definición de especie exige descendencia fértil."},

function practice21(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Simulador del índice de Lincoln</h3><span class="eyebrow">2.1.17</span></div>
   <p class="prose" style="margin:6px 0 10px">En un estero hay una población de cangrejos de tamaño desconocido. Captura y marca una primera muestra, libérala y luego haz una segunda captura. Compara tu estimación con el valor real.</p>
   <div class="ctl"><label for="li1">Tamaño de la primera captura (n₁): <b id="li1v">40</b></label><input type="range" id="li1" min="10" max="100" step="5" value="40"></div>
   <div class="ctl" style="margin-top:8px"><label for="li2">Tamaño de la segunda captura (n₂): <b id="li2v">50</b></label><input type="range" id="li2" min="10" max="100" step="5" value="50"></div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button class="btn" id="lirun">Capturar, marcar y recapturar</button><button class="btn ghost" id="linew">Nuevo estero</button></div>
   <div class="graph" id="ligrid" style="margin-top:12px"></div>
   <div class="detail" id="lid" style="margin-top:10px">Pulsa «Capturar, marcar y recapturar».</div></div>
  <div class="card"><div class="rowhead"><h3>Simulador de cuadrantes</h3><span class="eyebrow">2.1.15 · 2.1.16</span></div>
   <p class="prose" style="margin:6px 0 10px">Un terreno de 10 m × 10 m tiene plantas de una especie. Lanza cuadrantes de 1 m² al azar y observa cómo la estimación de densidad se acerca al valor real al tomar más muestras.</p>
   <div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn" id="q1">Lanzar 1 cuadrante</button><button class="btn ghost" id="q5">Lanzar 5</button><button class="btn ghost" id="qr">Reiniciar</button></div>
   <div class="graph" id="qfield" style="margin-top:12px"></div>
   <div class="detail" id="qd" style="margin-top:10px">Aún no has lanzado cuadrantes.</div></div>
  <div class="card"><div class="rowhead"><h3>Curvas J y S</h3><span class="eyebrow">2.1.10 · 2.1.12</span></div>
   <p class="prose" style="margin:6px 0 10px">Modelo de crecimiento con tasa r y capacidad de carga K. Gráfica <b>esquemática</b>. Cambia los valores y compara las dos curvas.</p>
   <div class="ctl"><label for="gr">Tasa de crecimiento r: <b id="grv">0,4</b></label><input type="range" id="gr" min="0.1" max="0.8" step="0.05" value="0.4"></div>
   <div class="ctl" style="margin-top:8px"><label for="gk">Capacidad de carga K: <b id="gkv">500</b></label><input type="range" id="gk" min="200" max="800" step="50" value="500"></div>
   <div class="graph" id="gcurve" style="margin-top:8px"></div>
   <p class="prose" style="margin:6px 0 0;font-size:.9rem;color:var(--muted)"><span style="color:var(--bad);font-weight:700">Curva J:</span> sin límites. <span style="color:var(--accent);font-weight:700">Curva S:</span> se frena al acercarse a K (línea punteada).</p></div>
  <div class="card"><div class="rowhead"><h3>Datos reales: renos de St. Matthew</h3><span class="eyebrow">2.1.12</span></div>
   <p class="prose" style="margin:6px 0 10px">Conteos de la población de renos en la isla St. Matthew (Alaska). Observa el patrón de auge y colapso.</p>
   <div class="graph" id="reindeer"></div></div>
  <div class="card" id="intbox"></div>
  <div class="card" id="ddbox"></div>`;
  // Lincoln
  let N=0;const newPond=()=>{N=150+Math.floor(Math.random()*350);$("#lid").textContent="Estero nuevo listo. Pulsa «Capturar, marcar y recapturar».";$("#ligrid").innerHTML=""};newPond();
  const upd=()=>{$("#li1v").textContent=$("#li1").value;$("#li2v").textContent=$("#li2").value};
  $("#li1").oninput=upd;$("#li2").oninput=upd;
  $("#linew").onclick=newPond;
  $("#lirun").onclick=()=>{
    const n1=+$("#li1").value,n2=Math.min(+$("#li2").value,N);
    const pop=Array.from({length:N},(_,i)=>i<n1);
    const idx=[...pop.keys()];for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
    const s=idx.slice(0,n2);const nm=s.filter(i=>pop[i]).length;
    // draw second sample
    const cols=Math.min(25,n2),rows=Math.ceil(n2/cols),cw=22;
    let g=`<svg viewBox="0 0 ${cols*cw+4} ${rows*cw+4}" style="min-width:0;max-width:${cols*cw+4}px" role="img" aria-label="Segunda captura: ${nm} marcados de ${n2}">`;
    s.forEach((id,k)=>{const x=2+(k%cols)*cw+cw/2,y=2+Math.floor(k/cols)*cw+cw/2;g+=`<circle cx="${x}" cy="${y}" r="8" fill="${pop[id]?"var(--ochre)":"var(--accent-soft)"}" stroke="var(--accent)" stroke-width="1.2"/>`});
    g+=`</svg>`;$("#ligrid").innerHTML=g;
    if(nm===0){$("#lid").innerHTML=`<b>Segunda captura: ${n2} cangrejos, ninguno marcado.</b> No se puede calcular (división entre cero). Aumenta el tamaño de las muestras y repite.`;return}
    const est=Math.round(n1*n2/nm),err=Math.round(Math.abs(est-N)/N*100);
    $("#lid").innerHTML=`<b>Segunda captura:</b> ${n2} cangrejos, de los cuales <b>${nm}</b> estaban marcados (en dorado).<br>N = (${n1} × ${n2}) / ${nm} = <b>${est}</b>. Población real: <b>${N}</b>. Error: ${err} %.<br>${err>20?"Error grande: prueba con muestras más grandes.":"Buena estimación. Las muestras grandes reducen el error."}`;
  };
  // Quadrats
  let plants=[],thrown=[];
  const seed=()=>{plants=[];// clumped distribution: some patches
    const centers=Array.from({length:5},()=>[Math.random()*10,Math.random()*10]);
    for(let i=0;i<130;i++){if(Math.random()<.6){const c=centers[i%5];plants.push([Math.min(9.95,Math.max(0.05,c[0]+(Math.random()-.5)*3)),Math.min(9.95,Math.max(0.05,c[1]+(Math.random()-.5)*3))])}else plants.push([Math.random()*10,Math.random()*10])}
    thrown=[];};
  const drawQ=()=>{
    const S=34,W=10*S;let g=`<svg viewBox="0 0 ${W+2} ${W+2}" style="min-width:0;max-width:${W+2}px" role="img" aria-label="Terreno de 10 por 10 metros con plantas y cuadrantes">`;
    g+=`<rect x="1" y="1" width="${W}" height="${W}" fill="var(--sunk)" stroke="var(--line)"/>`;
    for(let i=1;i<10;i++)g+=`<line x1="${1+i*S}" x2="${1+i*S}" y1="1" y2="${W+1}" stroke="var(--line)" stroke-width=".5"/><line y1="${1+i*S}" y2="${1+i*S}" x1="1" x2="${W+1}" stroke="var(--line)" stroke-width=".5"/>`;
    plants.forEach(p=>g+=`<circle cx="${1+p[0]*S}" cy="${1+p[1]*S}" r="3" fill="var(--eco)"/>`);
    thrown.forEach(t=>g+=`<rect x="${1+t.x*S}" y="${1+t.y*S}" width="${S}" height="${S}" fill="var(--ochre)" fill-opacity=".18" stroke="var(--ochre)" stroke-width="2"/>`);
    g+=`</svg>`;$("#qfield").innerHTML=g;
    if(!thrown.length){$("#qd").textContent="Aún no has lanzado cuadrantes.";return}
    const tot=thrown.reduce((s,t)=>s+t.n,0),d=tot/thrown.length,freq=Math.round(thrown.filter(t=>t.n>0).length/thrown.length*100);
    $("#qd").innerHTML=`<b>${thrown.length} cuadrante${thrown.length>1?"s":""}</b> · último: ${thrown[thrown.length-1].n} plantas.<br>Densidad estimada: D = ${tot} / ${thrown.length} m² = <b>${d.toFixed(2)} plantas/m²</b>. Densidad real: <b>${(plants.length/100).toFixed(2)} plantas/m²</b>. Frecuencia: ${freq} %.<br>${thrown.length<8?"Con pocos cuadrantes la estimación varía mucho, sobre todo porque las plantas están agrupadas en parches.":"Con más cuadrantes la estimación se acerca al valor real."}`;
  };
  const throwOne=()=>{const x=Math.floor(Math.random()*10),y=Math.floor(Math.random()*10);thrown.push({x,y,n:plants.filter(p=>p[0]>=x&&p[0]<x+1&&p[1]>=y&&p[1]<y+1).length})};
  $("#q1").onclick=()=>{throwOne();drawQ()};$("#q5").onclick=()=>{for(let i=0;i<5;i++)throwOne();drawQ()};$("#qr").onclick=()=>{seed();drawQ()};seed();drawQ();
  // growth curves
  const gc=()=>{
    const r=+$("#gr").value,K=+$("#gk").value;$("#grv").textContent=r.toFixed(2).replace(".",",");$("#gkv").textContent=K;
    const W=600,H=280,L=50,R=16,T=16,B=40,T_=30,max=1000;
    const xs=t=>L+t/T_*(W-L-R),ys=v=>T+(1-Math.min(v,max)/max)*(H-T-B);
    let j=[10],s=[10];for(let t=1;t<=T_;t++){j.push(j[t-1]*(1+r));s.push(s[t-1]+r*s[t-1]*(1-s[t-1]/K))}
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curvas de crecimiento exponencial y logístico">`;
    [0,250,500,750,1000].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`);
    [0,10,20,30].forEach(t=>g+=`<text x="${xs(t)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${t}</text>`);
    g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">Tiempo (generaciones)</text><text x="12" y="${(T+H-B)/2}" transform="rotate(-90 12 ${(T+H-B)/2})" text-anchor="middle" font-size="11" fill="var(--muted)">Tamaño de la población</text>`;
    g+=`<line x1="${L}" x2="${W-R}" y1="${ys(K)}" y2="${ys(K)}" stroke="var(--ochre)" stroke-dasharray="6 5" stroke-width="2"/><text x="${W-R-4}" y="${ys(K)-6}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ochre)">K = ${K}</text>`;
    const pth=a=>{let d="",stop=false;a.forEach((v,t)=>{if(stop)return;d+=(t?"L":"M")+xs(t).toFixed(1)+","+ys(v).toFixed(1);if(v>=max)stop=true});return d};
    g+=`<path d="${pth(j)}" fill="none" stroke="var(--bad)" stroke-width="3"/><path d="${pth(s)}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
    g+=`</svg>`;$("#gcurve").innerHTML=g;
  };
  $("#gr").oninput=gc;$("#gk").oninput=gc;gc();
  // reindeer
  (()=>{const data=[[1944,29],[1957,1350],[1963,6000],[1966,42]];
    const W=600,H=260,L=56,R=20,T=20,B=40;const xs=y=>L+(y-1940)/30*(W-L-R),ys=v=>T+(1-v/6500)*(H-T-B);
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Población de renos de St. Matthew: 29 en 1944, 1350 en 1957, 6000 en 1963 y 42 en 1966">`;
    [0,2000,4000,6000].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`);
    [1940,1950,1960,1970].forEach(y=>g+=`<text x="${xs(y)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${y}</text>`);
    g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">Año</text><text x="14" y="${(T+H-B)/2}" transform="rotate(-90 14 ${(T+H-B)/2})" text-anchor="middle" font-size="11" fill="var(--muted)">Número de renos</text>`;
    g+=`<path d="${data.map((d,i)=>(i?"L":"M")+xs(d[0])+","+ys(d[1])).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3"/>`;
    data.forEach(d=>{g+=`<circle cx="${xs(d[0])}" cy="${ys(d[1])}" r="5" fill="var(--accent)"/><text x="${xs(d[0])+(d[0]===1966?10:0)}" y="${ys(d[1])-10}" text-anchor="${d[0]===1966?"start":"middle"}" font-size="12" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${d[1]}</text>`});
    g+=`</svg>`;$("#reindeer").innerHTML=g;})();
  classifier($("#intbox"),"¿Qué tipo de interacción es?","2.1.9 · Clasifica cada interacción entre poblaciones.",INT_ITEMS,INT_CATS);
  classifier($("#ddbox"),"¿Dependiente o independiente de la densidad?","2.1.11 · ¿El efecto aumenta cuando la población es más densa?",DD_ITEMS,DD_CATS);
}

   s:"Parte de la energía liberada en la respiración se pierde como calor.",
   html:`<ul><li>La respiración no es 100 % eficiente.</li>
   <li>Los animales de sangre caliente (aves y mamíferos) usan ese calor para mantener su temperatura, pero por eso gastan más energía y tienen menor eficiencia que los de sangre fría.</li></ul>`,
   tip:"Esto explica por qué un pez o un reptil convierte más alimento en biomasa que un mamífero del mismo tamaño."},
  {c:"2.2.8",t:"Segunda ley de la termodinámica",
   s:"La segunda ley de la termodinámica dice que las transformaciones de energía son ineficientes: en cada una se pierde parte de la energía como calor.",
   html:`<ul><li>Como generalización, solo alrededor del <b>10 %</b> de la energía pasa al siguiente nivel trófico; cerca del 90 % se pierde.</li>
   <li>Por eso hay pocos niveles tróficos y las pirámides de energía tienen forma de pirámide.</li>
   <li>Consecuencia para la alimentación humana: alimentarse de plantas sostiene a más personas que alimentarse de animales que comieron esas plantas.</li></ul>`,
   tip:"Cita la segunda ley cuando expliques por qué las cadenas tróficas son cortas o por qué la pirámide de energía nunca se invierte."},
  {c:"2.2.9",t:"Estrategias de los consumidores",
   s:"Los consumidores (heterótrofos) obtienen energía y materia alimentándose de otros organismos con distintas estrategias.",
   html:`<div class="defgrid">
   <div class="def"><h4>Herbívoros</h4><p>Comen plantas. Ej.: tortuga gigante, venado.</p></div>
   <div class="def"><h4>Depredadores</h4><p>Cazan animales. Ej.: jaguar, gavilán.</p></div>
   <div class="def"><h4>Parásitos</h4><p>Viven a costa de un huésped. Ej.: tenia, pulga, muérdago.</p></div>
   <div class="def"><h4>Carroñeros</h4><p>Comen animales muertos. Ej.: gallinazo, cóndor.</p></div>
   <div class="def"><h4>Detritívoros</h4><p>Ingieren materia orgánica muerta. Ej.: lombriz, cangrejo rojo del manglar.</p></div>
   <div class="def"><h4>Saprótrofos (descomponedores)</h4><p>Liberan enzimas sobre la materia muerta y absorben los nutrientes. Ej.: hongos, bacterias.</p></div></div>`,
   tip:"Diferencia clave: el detritívoro <b>ingiere</b> la materia muerta; el saprótrofo la <b>digiere por fuera</b> y luego absorbe los nutrientes."},
  {c:"2.2.10",t:"Cadenas tróficas",
   s:"Una cadena trófica muestra la transferencia de energía desde un productor hacia una serie de consumidores.",
   html:`<ul><li>Empieza siempre con un productor.</li>
   <li>Las flechas apuntan en la dirección del flujo de energía: <b>del que es comido hacia el que come</b>.</li>
   <li>Ej.: fitoplancton → zooplancton → camarón → pargo → garza.</li></ul>`,
   tip:"Error que cuesta puntos: dibujar las flechas al revés. La flecha significa «es comido por»."},
  {c:"2.2.11",t:"Niveles tróficos",
   s:"Los niveles tróficos indican la posición de un organismo en una cadena trófica.",
   html:`<ul><li>Nivel 1: productores. Nivel 2: consumidores primarios. Nivel 3: secundarios. Nivel 4: terciarios. A veces hay un nivel 5 con depredadores tope.</li>
   <li>Un omnívoro puede ocupar varios niveles.</li>
   <li>Los descomponedores no están en una cadena lineal, pero procesan materia de todos los niveles y reciclan los nutrientes.</li></ul>`,
   tip:"Si un organismo come de dos niveles, puede estar en dos niveles tróficos a la vez. Explícalo así en el examen."},
  {c:"2.2.12",t:"Pérdidas entre niveles",
   s:"La energía y la materia se pierden entre niveles tróficos.",
   html:`<ul><li>No todo se come: raíces, huesos, partes no comestibles.</li>
   <li>No todo lo que se come se absorbe: parte sale en las heces.</li>
   <li>Lo absorbido se usa en la respiración y se pierde como calor.</li>
   <li>Solo una pequeña parte queda como nueva biomasa disponible para el siguiente nivel.</li></ul>`,
   tip:"Pregunta típica: «Indica dos formas en que se pierde energía entre niveles». Respuestas seguras: calor de la respiración y heces o partes no consumidas."},
  {c:"2.2.13",t:"Productividad bruta y neta",
   s:"La productividad bruta es la ganancia total de energía o biomasa. La productividad neta es lo que queda después de restar la respiración.",
   html:`<p style="font-family:var(--f-mono);font-size:1.05rem;background:var(--sunk);padding:10px 14px;border-radius:8px;display:inline-block">PN = PB − R</p>
   <ul><li>Ej.: un bosque fija 100 unidades (PB) y gasta 40 en respiración (R). PN = 100 − 40 = 60 unidades.</li>
   <li>La productividad neta es la energía disponible para crecer y para el siguiente nivel trófico.</li>
   <li>Se relaciona con el <b>rendimiento máximo sostenible</b>: se puede cosechar hasta la productividad neta sin agotar el recurso.</li></ul>`,
   tip:"Revisa siempre las unidades (kJ m⁻² año⁻¹ o g m⁻² año⁻¹) y escríbelas en tu respuesta."},
  {c:"2.2.14",t:"Eficiencia ecológica",
   s:"El número de niveles tróficos está limitado por las pérdidas de energía.",
   html:`<p style="font-family:var(--f-mono);font-size:1.05rem;background:var(--sunk);padding:10px 14px;border-radius:8px;display:inline-block">Eficiencia (%) = (energía que pasa al siguiente nivel ÷ energía recibida) × 100</p>
   <ul><li>Ej.: un nivel recibe 20 000 kJ y pasa 2500 kJ al siguiente. Eficiencia = 2500 ÷ 20 000 × 100 = 12,5 %.</li>
   <li>La regla del 10 % es solo una generalización: la eficiencia real varía entre ecosistemas y organismos.</li>
   <li>Las cadenas rara vez tienen más de 4 o 5 niveles porque no queda energía suficiente.</li></ul>`,
   tip:"Practica cálculos de eficiencia en la pestaña Practica: aparecen en casi todas las pruebas de datos."},
  {c:"2.2.15",t:"Redes tróficas",
   s:"Una red trófica muestra las múltiples relaciones de alimentación de una comunidad.",
   html:`<ul><li>Es más realista que una cadena: la mayoría de los animales comen varias especies y son comidos por varias.</li>
   <li>Más conexiones y omnívoros dan más estabilidad: si una especie disminuye, los consumidores pueden cambiar de alimento.</li>
   <li>Explora la red del manglar en la pestaña <b>Practica</b>.</li></ul>`,
   tip:"Si te preguntan qué pasa al eliminar una especie, sigue todas las flechas que entran y salen de ella y describe efectos directos e indirectos."},
  {c:"2.2.16",t:"Medir biomasa y energía",
   s:"La biomasa y el contenido energético de los organismos se pueden medir.",
   html:`<ul><li><b>Biomasa:</b> recolectar una muestra, secarla en un horno (a unos 60-80 °C) hasta que su masa ya no cambie, pesarla y extrapolar al área total.</li>
   <li><b>Energía:</b> quemar la muestra seca en un calorímetro y medir cuánto se calienta el agua.</li>
   <li>Limitación ética: el método es destructivo, porque hay que matar a los organismos.</li></ul>`,
   tip:"Recuerda «secar hasta masa constante»: asegura que se eliminó toda el agua y que se mide solo materia orgánica."},
  {c:"2.2.17",t:"Pirámides ecológicas",
   s:"Las pirámides ecológicas representan la cantidad de individuos, biomasa o energía en cada nivel trófico.",
   html:`<div class="defgrid">
   <div class="def"><h4>De números</h4><p>Individuos por nivel. Puede invertirse: un solo árbol sostiene a miles de insectos.</p></div>
   <div class="def"><h4>De biomasa</h4><p>Masa seca por nivel (g m⁻²). Suele ser recta en tierra; puede invertirse en el agua porque el fitoplancton se reproduce muy rápido y se come enseguida.</p></div>
   <div class="def"><h4>De energía</h4><p>Energía por nivel en un periodo (kJ m⁻² año⁻¹). <b>Nunca se invierte</b>, por la segunda ley de la termodinámica.</p></div></div>
   <p style="margin-top:12px">La biomasa presente en un momento dado se llama <b>cosecha en pie</b> (standing crop).</p>`,
   tip:"Pregunta clásica: «¿Por qué la pirámide de energía nunca se invierte?». Respuesta: en cada transferencia se pierde energía como calor, así que cada nivel siempre tiene menos que el anterior."},
  {c:"2.2.18",t:"Bioacumulación y biomagnificación",
   s:"Los contaminantes no biodegradables pueden bioacumularse en los organismos y biomagnificarse en las cadenas tróficas.",
   html:`<div class="defgrid">
   <div class="def"><h4>Bioacumulación</h4><p>Un contaminante se acumula dentro de <b>un organismo</b> a lo largo de su vida, porque entra más rápido de lo que se elimina. Suele guardarse en la grasa.</p></div>
   <div class="def"><h4>Biomagnificación</h4><p>La concentración del contaminante <b>aumenta en cada nivel trófico</b>, porque cada depredador come muchas presas contaminadas.</p></div></div>
   <ul style="margin-top:12px"><li>Ejemplos: DDT (adelgazó la cáscara de los huevos de águilas y halcones), mercurio (Minamata, minería de oro), PCB (altos niveles en osos polares).</li>
   <li>Soluciones: prohibiciones, limpieza de sitios contaminados y monitoreo.</li></ul>`,
   tip:"No confundas los términos: bioacumulación ocurre en un individuo; biomagnificación, a lo largo de la cadena."},
  {c:"2.2.19",t:"Microplásticos",
   s:"Los microplásticos son partículas de plástico de menos de 5 mm que entran en las cadenas tróficas.",
   html:`<ul><li>Fuentes: fragmentación de plásticos grandes, microperlas de cosméticos, fibras de ropa sintética al lavarla, residuos industriales.</li>
   <li>Absorben otros contaminantes (metales pesados, PCB, DDT) y los transportan.</li>
   <li>Los come el plancton y los peces pequeños; así suben por la cadena y llegan a los mariscos que consumimos.</li></ul>`,
   tip:"Relaciona los microplásticos con 2.2.18: además de ser un contaminante, transportan otros que pueden biomagnificarse."},
  {c:"2.2.20",t:"Actividades humanas y flujos de energía",
   s:"Las actividades humanas alteran los flujos de energía y materia en los ecosistemas.",
   html:`<ul><li><b>Combustibles fósiles:</b> liberan CO₂ y contaminantes; el calentamiento y la acidificación reducen la productividad.</li>
   <li><b>Deforestación:</b> reduce la productividad y el almacenamiento de carbono; destruye hábitats.</li>
   <li><b>Urbanización:</b> convierte suelo productivo en asfalto y fragmenta hábitats.</li>
   <li><b>Agricultura:</b> monocultivos, fertilizantes que causan eutrofización, riego que agota el agua y saliniza el suelo.</li>
   <li>Ej. local: la tala de manglar para camaroneras reduce la productividad del estuario, que sostiene a la pesca.</li></ul>`,
   tip:"Para cada actividad, di qué flujo o almacén altera (productividad, carbono, nutrientes) y una consecuencia."}
 ],
 casesIntro:"Estos casos muestran cómo la energía y los contaminantes se mueven por las cadenas tróficas. Para cada uno, identifica los niveles tróficos implicados.",
 cases:[
  {t:"El DDT y las aves rapaces",u:"2.2.18",vid:null,
   bg:"Tras la Segunda Guerra Mundial, el insecticida DDT se usó masivamente. Llegaba a ríos y lagos en concentraciones muy bajas, pero se acumulaba en la grasa del plancton, los peces y finalmente las aves que comen peces. En las águilas calvas, halcones peregrinos y pelícanos, el DDT hacía que las cáscaras de los huevos fueran tan delgadas que se rompían. Las poblaciones se desplomaron. Tras la prohibición del DDT en EE. UU. (1972), muchas se recuperaron.",
   st:[["Agua","","Concentraciones muy bajas de DDT."],["Plancton y peces","","El DDT se bioacumula en su grasa."],["Aves rapaces","","Concentraciones miles a millones de veces mayores que en el agua."]],
   q:["Explica por qué el depredador tope tenía la mayor concentración de DDT.","Diferencia bioacumulación y biomagnificación con este ejemplo.","¿Qué papel tuvo Primavera silenciosa (1.1.10) en esta historia?"]},
  {t:"Minamata: mercurio en la cadena trófica",u:"2.2.18",vid:null,

   q:["¿Por qué las personas recibieron las dosis más altas?","¿Qué responsabilidad tenían la empresa y el gobierno? Relaciona con justicia ambiental (1.3.9)."]},
  {t:"Mercurio de la minería de oro en ríos del sur del Ecuador",u:"2.2.18 · 2.2.20",vid:null,local:true,
   bg:"En la minería artesanal y a pequeña escala de oro se usa mercurio para separar el metal. En zonas mineras del sur del país, parte de ese mercurio llega a los ríos, donde las bacterias lo transforman en metilmercurio, la forma que más se acumula en los seres vivos. Diversos estudios han encontrado mercurio en sedimentos y peces de ríos cercanos a zonas mineras. Ecuador firmó el Convenio de Minamata.",

   q:["Describe cómo llega el mercurio de una mina al cuerpo de una persona.","¿Qué alternativas podrían reducir este problema?","¿Qué perspectivas (1.1) chocan en este caso?"]},
  {t:"¿Comer más abajo en la cadena trófica?",u:"2.2.8 · 2.2.14",vid:null,

   st:[["Ventaja energética","","Comer productores aprovecha más energía por hectárea."],["Factores culturales","","La carne tiene un papel importante en muchas dietas y tradiciones."],["Matiz","","Algunos terrenos (pastos de montaña) no sirven para cultivos, solo para pastoreo."]],
   q:["Usa la segunda ley de la termodinámica para explicar el caso.","¿Qué perspectivas y valores influyen en las decisiones sobre la dieta?"]}

function practice22(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Red trófica del manglar</h3><span class="eyebrow">2.2.10 · 2.2.11 · 2.2.15</span></div>
   <p class="prose" style="margin:6px 0 10px">Toca un organismo para ver su nivel trófico, qué come y quién se lo come. Las flechas van del alimento hacia el que lo come.</p>
   <div class="graph" id="web"></div><div class="detail" id="webd" style="margin-top:10px">Toca un organismo de la red.</div></div>
  <div class="card"><div class="rowhead"><h3>Construye una pirámide de energía</h3><span class="eyebrow">2.2.8 · 2.2.14 · 2.2.17</span></div>
   <p class="prose" style="margin:6px 0 10px">Los productores fijan 20 000 kJ m⁻² año⁻¹. Cambia la eficiencia de transferencia y observa cuánta energía llega a cada nivel.</p>
   <div class="ctl"><label for="eff">Eficiencia ecológica: <b id="effv">10</b> %</label><input type="range" id="eff" min="5" max="20" step="1" value="10"></div>
   <div class="graph" id="pyr" style="margin-top:10px"></div><div class="detail" id="pyrd" style="margin-top:10px"></div></div>
  <div class="card"><div class="rowhead"><h3>Practica cálculos</h3><span class="eyebrow">2.2.13 · 2.2.14</span></div>
   <p class="prose" style="margin:6px 0 10px">Ejercicios con números nuevos cada vez. Escribe tu respuesta y compruébala.</p>
   <div class="seg" id="calcmode"><button class="opt" data-m="np" aria-pressed="true">Productividad neta</button><button class="opt" data-m="eff" aria-pressed="false">Eficiencia ecológica</button></div>
   <p id="calcq" style="font-weight:600;margin:12px 0 8px"></p>
   <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><input id="calca" type="text" inputmode="decimal" aria-label="Tu respuesta" style="padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;width:160px;color:var(--ink)"><button class="btn" id="calcc">Comprobar</button><button class="btn ghost" id="calcn">Otro ejercicio</button></div>
   <div class="fb" id="calcf" hidden style="margin-top:10px"></div></div>
  <div class="card"><div class="rowhead"><h3>Biomagnificación del DDT</h3><span class="eyebrow">2.2.18</span></div>
   <p class="prose" style="margin:6px 0 10px">Valores aproximados del estudio clásico de un estuario de Long Island (EE. UU.), en partes por millón (ppm). Toca cada nivel. La escala es logarítmica: cada línea es 10 veces más que la anterior.</p>
   <div class="graph" id="bio"></div><div class="detail" id="biod" style="margin-top:10px">Toca una barra.</div></div>
  <div class="card" id="consbox"></div>`;
  // food web
  const drawWeb=sel=>{
    const W=640,H=400;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Red trófica del manglar"><defs><marker id="wah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker><marker id="wah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ochre)"/></marker></defs>`;
    WEB_EDGES.forEach(([a,b])=>{const A=WEB_NODES[a],B=WEB_NODES[b];const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy);const ux=dx/L,uy=dy/L;
      const on=sel&&(a===sel||b===sel);
      g+=`<line x1="${(A.x+ux*24).toFixed(1)}" y1="${(A.y+uy*24).toFixed(1)}" x2="${(B.x-ux*28).toFixed(1)}" y2="${(B.y-uy*28).toFixed(1)}" stroke="${on?"var(--ochre)":"var(--line)"}" stroke-width="${on?3:1.8}" marker-end="url(#${on?"wah2":"wah"})"/>`});
    Object.entries(WEB_NODES).forEach(([k,v])=>{const prod=v.lvl.startsWith("Nivel 1"),det=k==="detr";
      g+=`<g class="wn" data-k="${k}" tabindex="0" role="button" style="cursor:pointer" aria-label="${v.n}"><rect x="${v.x-56}" y="${v.y-18}" width="112" height="36" rx="18" fill="${k===sel?"var(--accent)":prod?"var(--eco-soft)":det?"var(--ochre-soft)":"var(--surface)"}" stroke="${prod?"var(--eco)":det?"var(--ochre)":"var(--accent)"}" stroke-width="1.6"/><text x="${v.x}" y="${v.y+5}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${k===sel?"var(--accent-ink)":"var(--ink)"}" font-family="Bricolage Grotesque, sans-serif">${v.n.length>14?v.n.split(" ")[0]:v.n}</text></g>`});
    g+=`</svg>`;$("#web").innerHTML=g;
    document.querySelectorAll(".wn").forEach(el=>{const f=()=>{const k=el.dataset.k,v=WEB_NODES[k];drawWeb(k);
      const eats=WEB_EDGES.filter(e=>e[1]===k).map(e=>WEB_NODES[e[0]].n),eaten=WEB_EDGES.filter(e=>e[0]===k).map(e=>WEB_NODES[e[1]].n);
      $("#webd").innerHTML=`<b>${v.n}</b> · <span class="mono" style="font-size:.82rem;color:var(--accent)">${v.lvl}</span><br>${v.d}<br><b>Se alimenta de:</b> ${eats.length?eats.join(", "):"energía solar (fotosíntesis)"}. <b>Es alimento de:</b> ${eaten.length?eaten.join(", "):"ningún organismo de esta red (depredador tope)"}.`};
      el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  };drawWeb(null);
  // pyramid
  const pyr=()=>{const e=+$("#eff").value/100;$("#effv").textContent=Math.round(e*100);
    const names=["Productores","Consumidores primarios","Consumidores secundarios","Consumidores terciarios"];const vals=[20000];for(let i=1;i<4;i++)vals.push(vals[i-1]*e);
    const W=600,H=230,cx=W/2,bh=46,maxw=560;
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pirámide de energía">`;
    vals.forEach((v,i)=>{const w=Math.max(60,maxw*Math.pow(v/20000,0.35)),y=H-10-(i+1)*bh-i*6;
      g+=`<rect x="${cx-w/2}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${["var(--eco)","var(--accent)","var(--antropo)","var(--bad)"][i]}" fill-opacity=".85"/><text x="${cx}" y="${y+20}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)" font-family="Bricolage Grotesque, sans-serif">${names[i]}</text><text x="${cx}" y="${y+37}" text-anchor="middle" font-size="12" fill="var(--surface)" font-family="IBM Plex Mono, monospace">${v>=10?Math.round(v).toLocaleString("es"):v.toFixed(1).replace(".",",")} kJ m⁻² año⁻¹</text>`});
    g+=`</svg>`;$("#pyr").innerHTML=g;
    $("#pyrd").innerHTML=`Con ${Math.round(e*100)} % de eficiencia, al cuarto nivel llega solo el <b>${(Math.pow(e,3)*100).toFixed(e<0.1?3:2).replace(".",",")} %</b> de la energía que fijaron los productores. El ancho de las barras está comprimido para que se vean todos los niveles. Por eso las cadenas tróficas son cortas.`;};
  $("#eff").oninput=pyr;pyr();
  // calculator
  let cm="np",ans=0;
  const newQ=()=>{$("#calcf").hidden=true;$("#calca").value="";
    if(cm==="np"){const gp=(5+Math.floor(Math.random()*30))*1000,r=Math.round(gp*(0.3+Math.random()*0.5)/100)*100;ans=gp-r;
      $("#calcq").innerHTML=`Una parcela de pasto tiene una productividad bruta de <b>${gp.toLocaleString("es")}</b> kJ m⁻² año⁻¹ y pierde <b>${r.toLocaleString("es")}</b> kJ m⁻² año⁻¹ por respiración. Calcula la productividad neta (kJ m⁻² año⁻¹).`;}
    else{const ein=(2+Math.floor(Math.random()*20))*1000,pct=[5,8,10,12,15,20][Math.floor(Math.random()*6)],eout=ein*pct/100;ans=pct;
      $("#calcq").innerHTML=`Los herbívoros de una pradera reciben <b>${ein.toLocaleString("es")}</b> kJ m⁻² año⁻¹ y transfieren <b>${eout.toLocaleString("es")}</b> kJ m⁻² año⁻¹ a los carnívoros. Calcula la eficiencia ecológica (%).`;}};
  p.querySelectorAll("#calcmode .opt").forEach(b=>b.onclick=()=>{cm=b.dataset.m;p.querySelectorAll("#calcmode .opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));newQ()});
  $("#calcn").onclick=newQ;
  $("#calcc").onclick=()=>{const raw=$("#calca").value.replace(/\s/g,"");const v=parseFloat(cm==="np"?raw.replace(/\./g,"").replace(",","."):raw.replace(",","."));const f=$("#calcf");f.hidden=false;
    if(isNaN(v)){f.className="fb no";f.innerHTML="<b>Escribe un número.</b>";return}
    const ok=Math.abs(v-ans)<=Math.max(0.5,Math.abs(ans)*0.005);f.className="fb "+(ok?"ok":"no");
    f.innerHTML=ok?`<b>Correcto.</b> ${cm==="np"?"PN = PB − R = "+ans.toLocaleString("es")+" kJ m⁻² año⁻¹.":"Eficiencia = salida ÷ entrada × 100 = "+ans+" %."}`:`<b>Revisa:</b> ${cm==="np"?"usa PN = PB − R.":"usa (energía transferida ÷ energía recibida) × 100."} La respuesta es ${ans.toLocaleString("es")}${cm==="np"?" kJ m⁻² año⁻¹":" %"}.`};
  newQ();
  // biomagnification
  const BIO=[["Agua","0,00005",0.00005,"El DDT está tan diluido que es casi indetectable."],["Plancton","0,04",0.04,"El plancton absorbe el DDT y lo guarda en su grasa: unas 800 veces más que en el agua."],["Peces pequeños","0,5",0.5,"Cada pez come mucho plancton y acumula su DDT."],["Peces grandes","2",2,"Comen muchos peces pequeños: la concentración sigue subiendo."],["Aves que comen peces","25",25,"Depredadores tope: concentración cientos de miles de veces mayor que en el agua. Suficiente para adelgazar la cáscara de sus huevos."]];
  (()=>{const W=600,H=280,L=110,R=20,T=16,B=36;const lg=v=>Math.log10(v),mn=-5,mx=2;const xs=v=>L+(lg(v)-mn)/(mx-mn)*(W-L-R);const bh=(H-T-B)/BIO.length;
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Concentración de DDT por nivel trófico en escala logarítmica">`;
    for(let e=mn;e<=mx;e++){const x=L+(e-mn)/(mx-mn)*(W-L-R);g+=`<line x1="${x}" x2="${x}" y1="${T}" y2="${H-B}" stroke="var(--line)"/><text x="${x}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${e<0?"10"+["⁻⁵","⁻⁴","⁻³","⁻²","⁻¹"][e+5]:e===0?"1":e===1?"10":"100"}</text>`}
    g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">DDT (ppm, escala logarítmica)</text>`;
    BIO.forEach((b,i)=>{const y=T+i*bh+6;g+=`<g class="bb" data-i="${i}" tabindex="0" role="button" style="cursor:pointer" aria-label="${b[0]}: ${b[1]} ppm"><text x="${L-8}" y="${y+bh/2}" text-anchor="end" font-size="12" fill="var(--ink)">${b[0]}</text><rect x="${L}" y="${y}" width="${Math.max(4,xs(b[2])-L)}" height="${bh-12}" rx="4" fill="var(--bad)" fill-opacity="${0.35+i*0.15}"/><text x="${Math.max(L+4,xs(b[2]))+6}" y="${y+bh/2}" font-size="11" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${b[1]}</text></g>`});
    g+=`</svg>`;$("#bio").innerHTML=g;
    document.querySelectorAll(".bb").forEach(el=>{const f=()=>{const b=BIO[+el.dataset.i];$("#biod").innerHTML=`<b>${b[0]}: ${b[1]} ppm.</b> ${b[3]}`};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});})();
  classifier($("#consbox"),"¿Qué estrategia de alimentación?","2.2.9 · Clasifica cada consumidor.",CONS_ITEMS,CONS_CATS);
}
