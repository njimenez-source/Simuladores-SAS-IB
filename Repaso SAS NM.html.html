<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Repaso SAS NM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: guía de campo — índice de temas a la izquierda, columna de lectura con paneles interactivos a la derecha */
/* Tema único verde suave, elegido para lectura prolongada */
:root{
  color-scheme:light;
  --bg:#e7f3e9; --surface:#fbfdf9; --sunk:#dcefe0; --side:#d2eada; --ink:#163326; --muted:#4a6957; --line:#bfdcc7;
  --accent:#1d7d55; --accent-ink:#ffffff; --accent-soft:#c9e9d6; --ochre:#a6630a; --ochre-soft:#fcefd4;
  --ok:#2a7a37; --ok-soft:#d6f0da; --bad:#b03e2c; --bad-soft:#f9e1db;
  --tecno:#3a58a3; --tecno-soft:#e1e9f8; --antropo:#9c6806; --antropo-soft:#f8ebcd; --eco:#2a7a37; --eco-soft:#d4eed9;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:.85rem;color:var(--muted)}
.topic{margin-bottom:10px}
.topic h3{font-size:.8rem;font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.sub{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.9rem;line-height:1.3}
.sub .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);min-width:2.2em}
.sub:hover{background:var(--surface)}
.sub[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.sub[aria-current="true"] .n{color:var(--accent-ink)}
.sub[aria-current="true"] .dot{background:var(--accent-ink)}
.sub.soon{color:var(--muted)}
.sub .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;align-self:center}
.mobnav{display:none}

/* Main */
main{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:880px;margin:0 auto}
.hero{display:grid;gap:10px;margin-bottom:22px}
.hero h1{font-size:clamp(2rem,4.5vw,3.1rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.gq{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.gq span{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.88rem}
.meta{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.98rem;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{display:grid;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.prose{max-width:68ch}
.prose p{margin:0 0 .8em}
.prose ul{margin:.2em 0 .8em;padding-left:1.2em}
.prose li{margin:.25em 0}

/* Understandings */
.und{display:grid;gap:12px}
.u{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.u > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 18px}
.u > summary::-webkit-details-marker{display:none}
.u .code{font-family:var(--f-mono);font-size:.85rem;color:var(--accent);font-weight:500}
.u .ttl{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.u .chev{transition:transform .2s;color:var(--muted)}
.u[open] .chev{transform:rotate(90deg)}
.u .body{padding:0 18px 18px;display:grid;gap:14px}
.statement{border-left:3px solid var(--accent);padding:4px 0 4px 14px;font-style:italic;color:var(--muted);max-width:68ch}
.tip{background:var(--ochre-soft);border-radius:8px;padding:12px 14px;font-size:.95rem;max-width:68ch}
.tip b{color:var(--ochre);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.done-badge{font-family:var(--f-mono);font-size:.72rem;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:999px}

.defgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.def{background:var(--sunk);border-radius:8px;padding:12px}
.def h4{font-size:1rem;margin-bottom:4px}
.def p{margin:0;font-size:.92rem}
.en{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:400}

.progressbar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* EVS model */
.evs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.col{display:grid;gap:8px}
.col h4{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;text-align:left;cursor:pointer;font-size:.92rem}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.core{width:150px;height:150px;border-radius:50%;border:2px dashed var(--accent);display:grid;place-items:center;text-align:center;padding:14px;font-family:var(--f-display);font-weight:700;background:var(--accent-soft)}
.core small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.arrow{font-family:var(--f-mono);color:var(--accent);font-size:1.4rem;text-align:center}
.detail{background:var(--sunk);border-radius:8px;padding:14px;min-height:64px;font-size:.95rem}

/* classifier */
.cls{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:10px;background:var(--surface)}
.item q{quotes:"“" "”";font-style:italic}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{background:var(--ok-soft);border-color:var(--ok);opacity:1;color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:1;color:var(--ink)}
.fb{font-size:.92rem;padding:10px 12px;border-radius:6px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--f-display)}
.score{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.rowhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.reset{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.82rem;color:var(--muted)}

/* worldview spectrum */
.wv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wvc{border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.wvc h4{font-size:1.15rem}
.wvc p{margin:0;font-size:.92rem}
.wvc .ex{font-size:.86rem;color:var(--muted)}
.t-tecno{background:var(--tecno-soft)} .t-tecno h4{color:var(--tecno)}
.t-antropo{background:var(--antropo-soft)} .t-antropo h4{color:var(--antropo)}
.t-eco{background:var(--eco-soft)} .t-eco h4{color:var(--eco)}
.spectrum{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--tecno),var(--antropo),var(--eco))}
.speclabels{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}

/* graph */
.graph{overflow-x:auto}
.graph svg{display:block;width:100%;min-width:520px;height:auto}

/* timeline */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 16px 22px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.ec::before{background:var(--ochre);border-color:var(--ochre)}
.tl .yr{font-family:var(--f-mono);font-weight:500;font-size:.9rem;color:var(--accent)}
.tl .cat{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-left:8px}
.tl p{margin:2px 0 0;font-size:.94rem;max-width:64ch}

/* cases */
.case{display:grid;gap:12px}
.case h3{font-size:1.3rem}
.stake{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.st{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:4px}
.st b{font-family:var(--f-display)}
.st .tag{justify-self:start;font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:999px}
.tag.tecno{background:var(--tecno-soft);color:var(--tecno)} .tag.antropo{background:var(--antropo-soft);color:var(--antropo)} .tag.eco{background:var(--eco-soft);color:var(--eco)}
.st p{margin:0;font-size:.9rem}
.qs{margin:0;padding-left:1.2em;font-size:.95rem}
.local{border:2px solid var(--ochre)}
.local .eyebrow{color:var(--ochre)}

/* videos */
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.vid h4{font-size:1rem}
.vid p{margin:0;font-size:.9rem;color:var(--muted)}
.vid .lk{justify-self:start;display:inline-flex;gap:6px;align-items:center;background:var(--accent);color:var(--accent-ink);text-decoration:none;border-radius:6px;padding:6px 12px;font-family:var(--f-display);font-weight:700;font-size:.88rem}
.vid .code{font-family:var(--f-mono);font-size:.72rem;color:var(--accent)}
.vgroup{display:grid;gap:12px}
.vgroup h3{font-size:1.15rem}

/* flashcards */
.fcwrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fc{perspective:900px;height:170px;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.fc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;justify-content:center;gap:4px;border:1px solid var(--line)}
.fc .front{background:var(--surface)}
.fc .front b{font-family:var(--f-display);font-size:1.15rem}
.fc .back{background:var(--accent-soft);transform:rotateY(180deg);font-size:.88rem;line-height:1.45;overflow:auto;justify-content:flex-start}
@media (prefers-reduced-motion: reduce){.fc .in{transition:none}.progressbar i{transition:none}}

/* quiz */
.qz{display:grid;gap:14px}
.qq{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.qq .qn{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.qq p.stem{margin:0;font-weight:600}
.qopts{display:grid;gap:6px}
.qo{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px;cursor:pointer;font-size:.94rem}
.qo:hover:not(:disabled){border-color:var(--accent)}
.qo:disabled{cursor:default}
.qo.right{background:var(--ok-soft);border-color:var(--ok)}
.qo.wrong{background:var(--bad-soft);border-color:var(--bad)}
.scorebox{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px}
.scorebox b{font-family:var(--f-display);font-size:1.5rem}

.long{display:grid;gap:10px}
.long .marks{font-family:var(--f-mono);font-size:.8rem;color:var(--ochre)}
.long textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font:inherit;font-size:.95rem;color:var(--ink);resize:vertical}
.btn{justify-self:start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.9rem}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.rubric{background:var(--sunk);border-radius:8px;padding:12px 14px}
.rubric ul{margin:.3em 0 0;padding-left:1.2em}
.cmd{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.cmd div{background:var(--sunk);border-radius:8px;padding:10px;font-size:.88rem}
.cmd b{font-family:var(--f-display);display:block}

.soonbox{text-align:left;display:grid;gap:10px}
footer{margin-top:40px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
footer p{margin:0}
footer .author{font-size:.92rem;color:var(--ink)}
footer .author b{font-family:var(--f-display)}
/* 1.2 interactives */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ctl{display:grid;gap:6px;max-width:420px}
.ctl label{font-size:.9rem}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.lake{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;align-items:center}
.lakebox{aspect-ratio:4/3;max-width:100%;border-radius:50% 46% 52% 44%/48% 52% 46% 50%;transition:background .5s;border:2px solid var(--line)}
@media (max-width:560px){.lake{grid-template-columns:minmax(0,1fr)}.lakebox{max-width:200px}}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobnav{display:block;margin-bottom:14px}
  .mobnav label{display:block;font-family:var(--f-mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
  .mobnav select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
  .evs{grid-template-columns:minmax(0,1fr)}
  .core{margin:0 auto}
  .arrow{transform:rotate(90deg)}
  .wv{grid-template-columns:minmax(0,1fr)}
}
</style>

<script>
const TOPICS=[
 {n:1,name:"Fundamentos",subs:[["1.1","Perspectivas"],["1.2","Sistemas"],["1.3","Sostenibilidad"]]},
 {n:2,name:"Ecología",subs:[["2.1","Individuos, poblaciones, comunidades y ecosistemas"],["2.2","Energía y biomasa en los ecosistemas"],["2.3","Ciclos biogeoquímicos"],["2.4","Clima y biomas"],["2.5","Zonación, sucesión y cambio"]]},
 {n:3,name:"Biodiversidad y conservación",subs:[["3.1","Biodiversidad y evolución"],["3.2","Impacto humano en la biodiversidad"],["3.3","Conservación y regeneración"]]},
 {n:4,name:"Agua",subs:[["4.1","Sistemas hídricos"],["4.2","Acceso, uso y seguridad del agua"],["4.3","Producción acuática de alimentos"],["4.4","Contaminación del agua"]]},
 {n:5,name:"La tierra",subs:[["5.1","Suelos"],["5.2","Agricultura y alimentos"]]},
 {n:6,name:"Atmósfera y cambio climático",subs:[["6.1","Introducción a la atmósfera"],["6.2","Cambio climático: causas e impactos"],["6.3","Cambio climático: mitigación y adaptación"],["6.4","Ozono estratosférico"]]},
 {n:7,name:"Recursos naturales",subs:[["7.1","Uso de recursos en la sociedad"],["7.2","Fuentes de energía"],["7.3","Residuos sólidos"]]},
 {n:8,name:"Poblaciones humanas y sistemas urbanos",subs:[["8.1","Dinámica de poblaciones humanas"],["8.2","Sistemas urbanos y planificación"],["8.3","Contaminación del aire urbano"]]}
];

const yt=id=>"https://www.youtube.com/watch?v="+id;

/* ================= SUBTEMA 1.1 ================= */
const S11={
 code:"1.1",title:"Perspectivas",hours:"3 horas de clase",
 intro:"Ante una misma situación ambiental, dos personas pueden reaccionar de forma opuesta. Este subtema explica por qué: cada quien mira el mundo a través de una perspectiva formada por sus valores, creencias y experiencias. Entenderlo te ayuda a analizar conflictos ambientales y a construir argumentos sólidos en el examen.",
 guiding:["¿Cómo se desarrollan las distintas perspectivas?","¿Cómo influyen las perspectivas en las decisiones sobre temas ambientales?"],
 und:[
  {c:"1.1.1",t:"¿Qué es una perspectiva?",
   s:"Una perspectiva es la forma en que una persona ve y entiende una situación. Se basa en una mezcla de supuestos, valores y creencias personales y colectivas.",
   html:`<p>Piensa en la perspectiva como el <b>lente</b> con el que miras un problema. Ese lente no es solo tuyo: también lo moldean tu familia, tu comunidad y tu sociedad.</p>
   <ul><li>Las perspectivas influyen en cómo entendemos un problema ambiental y en cómo reaccionamos ante él.</li>
   <li>La cultura, la educación y la experiencia producen una gran variedad de puntos de vista, y esos puntos de vista terminan en opiniones, políticas y acciones distintas.</li>
   <li>Ejemplo: quien valora la biodiversidad defenderá proteger un manglar del estero Salado; quien prioriza el crecimiento económico puede preferir rellenarlo para construir.</li></ul>`,
   tip:"Si te piden «explicar» una perspectiva, nombra los valores o creencias que la sostienen. No basta con decir qué opina la persona; di por qué lo opina."},
  {c:"1.1.2",t:"¿Qué forma una perspectiva?",
   s:"Las perspectivas se informan y justifican con normas socioculturales, comprensión científica, leyes, religión, condiciones económicas, eventos locales y globales y experiencia vivida, entre otros factores.",
   html:`<div class="defgrid">
   <div class="def"><h4>Normas socioculturales</h4><p>Tradiciones y costumbres que aprendemos desde pequeños.</p></div>
   <div class="def"><h4>Ciencia</h4><p>Lo que la evidencia científica nos dice sobre el mundo físico.</p></div>
   <div class="def"><h4>Leyes</h4><p>El marco legal define qué es obligatorio o prohibido.</p></div>
   <div class="def"><h4>Religión y espiritualidad</h4><p>Guían juicios éticos sobre nuestra relación con la naturaleza.</p></div>
   <div class="def"><h4>Condiciones económicas</h4><p>La situación económica personal y del país pesa en cómo se usan los recursos.</p></div>
   <div class="def"><h4>Eventos locales y globales</h4><p>Un desastre natural o un acuerdo internacional pueden cambiar lo que pensamos.</p></div>
   <div class="def"><h4>Experiencia vivida</h4><p>Haber sufrido una inundación o crecido junto al mar marca tu visión.</p></div></div>
   <p style="margin-top:12px"><b>Perspectiva ≠ argumento.</b> La perspectiva es el punto de vista. El <b>argumento</b> es una serie de afirmaciones lógicas que se construyen para defender esa perspectiva. En el examen, una buena respuesta identifica la perspectiva y luego desarrolla argumentos con evidencia.</p>`,
   tip:"Cuando el examen pide «distinguir», da la diferencia clara entre ambos términos en una o dos frases: perspectiva = cómo veo; argumento = razones lógicas con las que defiendo cómo veo."},
  {c:"1.1.3",t:"Valores",
   s:"Los valores son cualidades o principios que las personas consideran valiosos e importantes en la vida.",
   html:`<p>Los valores guían decisiones. Varían entre personas y culturas: unas priorizan el crecimiento económico, otras la conservación. El IB usa la clasificación de la IPBES (plataforma intergubernamental sobre biodiversidad):</p>
   <div class="defgrid">
   <div class="def"><h4>Valores amplios <span class="en">broad values</span></h4><p>Principios morales generales y metas de vida: libertad, justicia, responsabilidad, armonía con la Madre Tierra, salud, prosperidad.</p></div>
   <div class="def"><h4>Valores específicos <span class="en">specific values</span></h4><p>Juicios sobre la importancia de la naturaleza en una situación concreta. Se dividen en tres tipos:</p></div>
   <div class="def"><h4>Instrumentales</h4><p>La naturaleza vale como <b>medio</b> para un fin humano: recurso, capital, madera, pesca.</p></div>
   <div class="def"><h4>Intrínsecos</h4><p>La naturaleza vale <b>por sí misma</b>, sin importar si sirve a las personas. Una especie merece existir.</p></div>
   <div class="def"><h4>Relacionales</h4><p>Valen las <b>relaciones</b> entre personas y naturaleza, y entre personas a través de ella: sentido de pertenencia, espiritualidad, cuidado, reciprocidad.</p></div></div>`,
   tip:"Pregunta típica: «Define valores». Respuesta modelo: cualidades o principios que las personas consideran que tienen valor e importancia en la vida."},
  {c:"1.1.4",t:"Los valores se ven en lo que comunicamos y hacemos",
   s:"Los valores que sostienen nuestras perspectivas se ven en nuestra comunicación y acciones. Los valores de las organizaciones se ven en sus anuncios, medios, políticas y acciones.",
   html:`<ul><li><b>Personas:</b> quien valora la sostenibilidad va en bicicleta, recicla o participa en mingas de limpieza de playas.</li>
   <li><b>Organizaciones:</b> muestran sus valores en la publicidad, en el contenido de sus redes, en sus políticas internas (contratación, uso de recursos) y en los proyectos que financian.</li>
   <li>Ejemplo clásico: la campaña de Patagonia «No compres esta chaqueta» (2011), que pedía consumir menos. Mira el caso completo en la pestaña <b>Casos</b>.</li></ul>
   <p>Cuidado con el <b>lavado verde</b> (greenwashing): cuando una empresa comunica valores ambientales que sus acciones reales no cumplen. Por eso hay que comparar lo que dice con lo que hace.</p>`,
   tip:"Para «evaluar» si una organización tiene valores ambientales, compara su publicidad con sus acciones y políticas reales. Da evidencia a favor y en contra y llega a una conclusión."},
  {c:"1.1.5",t:"Encuestas de valores",
   s:"Las encuestas de valores sirven para investigar las perspectivas que muestra un grupo social sobre temas ambientales.",
   html:`<p>Una encuesta revela valores, creencias y actitudes, y sus datos pueden orientar políticas públicas y campañas. Para diseñar una buena encuesta:</p>
   <ul><li>Parte de una <b>pregunta de investigación</b> clara.</li>
   <li>Usa preguntas <b>neutrales</b>, que no induzcan la respuesta.</li>
   <li>Adapta las preguntas a la cultura y al idioma del grupo.</li>
   <li>Combina preguntas cerradas (fáciles de analizar) y abiertas (dan profundidad).</li></ul>
   <div class="defgrid">
   <div class="def"><h4>Demográficas</h4><p>Edad, nivel educativo, ocupación, lugar. Permiten comparar grupos.</p></div>
   <div class="def"><h4>Escala Likert</h4><p>«Del 1 al 5, ¿qué tan de acuerdo está con invertir en energía solar?»</p></div>
   <div class="def"><h4>Opción múltiple</h4><p>Elegir la medida más eficaz contra el cambio climático.</p></div>
   <div class="def"><h4>Ordenamiento</h4><p>Ordenar acciones del municipio por prioridad.</p></div>
   <div class="def"><h4>Abiertas</h4><p>«¿Qué experiencia cambió tu forma de ver el ambiente?»</p></div>
   <div class="def"><h4>De escenario</h4><p>«¿Aceptarías un trabajo bien pagado que daña el ambiente?»</p></div>
   <div class="def"><h4>De conducta</h4><p>«¿Cuántas veces usaste transporte público este mes?» Compara lo que dicen con lo que hacen.</p></div></div>
   <p style="margin-top:12px"><b>Habilidad:</b> los datos de una encuesta se analizan con una herramienta estadística adecuada, y los cambios de comportamiento en el tiempo se muestran con <b>gráficas conducta–tiempo</b>. Practica leer una en la pestaña <b>Practica</b>.</p>`,
   tip:"Si te piden evaluar una encuesta, revisa: ¿preguntas tendenciosas?, ¿muestra representativa?, ¿tamaño suficiente?, ¿se mezclan preguntas abiertas y cerradas?"},
  {c:"1.1.6",t:"Cosmovisiones",
   s:"Las cosmovisiones son los lentes compartidos por grupos de personas con los que perciben, dan sentido y actúan en su entorno. Moldean valores y perspectivas a través de la cultura, la filosofía, la ideología, la religión y la política.",
   html:`<ul><li>Una <b>perspectiva</b> es individual; una <b>cosmovisión</b> es compartida por un grupo.</li>
   <li>Internet y las redes sociales nos exponen a muchas cosmovisiones a la vez. Por eso hoy es común tener creencias mezcladas, únicas de cada persona.</li>
   <li>Las perspectivas cambian con la información nueva, así que es difícil encasillar a alguien en una sola categoría.</li>
   <li>Ejemplos contrastantes: un ejecutivo petrolero que confía en la tecnología para reducir impactos; una líder maorí que combina conocimiento ecológico tradicional con ciencia moderna para manejar pesquerías; una estudiante activista que organiza campañas climáticas.</li>
   <li>Muchas cosmovisiones indígenas ven la tierra como un ser vivo con el que hay reciprocidad. En los Andes y la Amazonía esto se expresa en el <b>Sumak Kawsay</b> (buen vivir) y la <b>Pachamama</b>.</li></ul>`,
   tip:"Para «comparar», escribe semejanzas y diferencias entre dos cosmovisiones en la misma respuesta, usando conectores como «mientras que», «ambas»."},
  {c:"1.1.7",t:"Sistema de valores ambientales (SVA)",
   s:"Un sistema de valores ambientales es un modelo que muestra las entradas que afectan a nuestras perspectivas y las salidas que resultan de ellas.",
   html:`<p>El SVA se trata como un <b>sistema</b>: tiene entradas (lo que nos influye), un proceso (cómo filtramos esa información según nuestros valores) y salidas (decisiones y acciones).</p>
   <ul><li><b>Entradas:</b> cultura, educación, medios de comunicación y redes sociales, situación económica, religión o creencias morales, familia, eventos.</li>
   <li><b>Salidas:</b> decisiones personales (consumo, reciclaje), participación pública (voto, activismo, protestas), elección de carrera y prácticas profesionales.</li></ul>
   <p>Explora el modelo interactivo en la pestaña <b>Practica</b>.</p>`,
   tip:"Error común: confundir entradas con salidas. «Ver un documental» es entrada. «Dejar de comprar plástico después de verlo» es salida."},
  {c:"1.1.8",t:"Tecnocéntrica, antropocéntrica, ecocéntrica",
   s:"Las perspectivas ambientales (cosmovisiones) se pueden clasificar en tres categorías amplias: tecnocéntrica, antropocéntrica y ecocéntrica.",
   html:`<div class="spectrum" aria-hidden="true"></div><div class="speclabels"><span>Tecnocéntrica</span><span>Antropocéntrica</span><span>Ecocéntrica</span></div>
   <div class="wv" style="margin-top:10px">
   <div class="wvc t-tecno"><h4>Tecnocéntrica</h4><p>La tecnología y la innovación humana pueden prevenir o resolver los problemas ambientales. No hace falta reducir el consumo.</p><p class="ex">Ej.: captura de carbono, geoingeniería, cultivos transgénicos para alimentar más gente.</p></div>
   <div class="wvc t-antropo"><h4>Antropocéntrica</h4><p>Los humanos están en el centro. El ambiente se gestiona para el beneficio humano, desde la conservación de recursos para el futuro hasta su explotación inmediata.</p><p class="ex">Ej.: cuotas de pesca, impuestos al carbono, áreas protegidas para turismo.</p></div>
   <div class="wvc t-eco"><h4>Ecocéntrica</h4><p>La naturaleza tiene valor intrínseco y es lo más importante. Pide cambios profundos en el estilo de vida y límites al crecimiento.</p><p class="ex">Ej.: derechos de la naturaleza en la Constitución del Ecuador (2008), autosuficiencia, consumir menos.</p></div></div>
   <p style="margin-top:12px">Estas categorías <b>no son cajas cerradas</b>: son puntos en un continuo. Muchas personas combinan elementos de varias y cambian de posición con el tiempo. Ecuador y Bolivia reconocen derechos a la naturaleza en sus leyes, y hay un movimiento creciente para dar derechos a los ríos.</p>`,
   tip:"Al clasificar una opinión, justifica con una palabra clave: confía en la tecnología → tecnocéntrica; gestiona para beneficio humano → antropocéntrica; valor intrínseco de la naturaleza → ecocéntrica."},
  {c:"1.1.9",t:"Las perspectivas cambian con el tiempo",
   s:"Las perspectivas y las creencias que las sostienen cambian en todas las sociedades. Pueden cambiar por campañas de gobiernos u ONG, o por cambios sociales y demográficos.",
   html:`<ul><li><b>Campañas:</b> La Hora del Planeta (WWF), la Gran Muralla Verde de la Unión Africana (restaurar 8000 km del Sahel), el Día de ir al trabajo en bicicleta, campañas de plantación de árboles.</li>
   <li><b>Cambios sociales y demográficos:</b> la urbanización y la llegada de generaciones más jóvenes, que suelen dar más prioridad a la sostenibilidad, cambian lo que una sociedad exige a sus gobiernos.</li>
   <li>Estos cambios se ven en <b>gráficas conducta–tiempo</b>: la caída del tabaquismo tras campañas de salud, la tendencia del consumo de carne, el aumento del reciclaje de plástico.</li></ul>`,
   tip:"Al interpretar una gráfica conducta–tiempo, describe la tendencia, cita valores o fechas del eje y relaciona el cambio con un evento concreto (una ley, una campaña, un desastre)."},
  {c:"1.1.10",t:"El movimiento ambiental",
   s:"El desarrollo del movimiento ambiental ha sido influido por individuos, literatura, medios, grandes desastres ambientales, acuerdos internacionales, nuevas tecnologías y descubrimientos científicos.",
   html:`<p>Hitos clave: <i>Primavera silenciosa</i> de Rachel Carson (1962), la hipótesis Gaia de James Lovelock, el desastre de Minamata, Bhopal (1984), Chernóbil (1986), el documental <i>Una verdad incómoda</i> (2006), el derrame de Deepwater Horizon (2010), Fukushima (2011), el movimiento Chipko en India, el Día de la Tierra y las cumbres de Río.</p>
   <p>La historia del movimiento suele contarse desde Occidente. Conviene compararla con otras sociedades: pueblos originarios de América frente a la economía de frontera europea; sociedades budistas frente a judeocristianas; sistemas comunistas frente a capitalistas.</p>
   <p>Recorre la línea de tiempo interactiva en la pestaña <b>Practica</b>.</p>`,
   tip:"Para «justificar» cómo un hito influyó, usa la estructura: hecho → qué reveló → qué cambió (ley, organización, opinión pública). Ej.: Primavera silenciosa → reveló efectos del DDT → contribuyó a su prohibición en EE. UU. (1972) y a la creación de la EPA (1970)."}
 ]
};

const S12={
 code:"1.2",title:"Sistemas",hours:"5 horas de clase",src:"https://www.mrgscience.com/ess-subtopic-12-systems.html",
 intro:"Un sistema es un conjunto de partes que funcionan juntas como un todo: una célula, una persona, un manglar, una ciudad o el planeta entero. SAS usa el enfoque de sistemas porque los problemas ambientales no se entienden mirando cada parte por separado. Este subtema te da el lenguaje (almacenes, flujos, retroalimentación, puntos de inflexión, resiliencia) que usarás en todos los demás temas.",
 guiding:["¿Cómo puede el enfoque de sistemas modelar problemas ambientales con distintos niveles de complejidad y escala?"],
 und:[
  {c:"1.2.1",t:"¿Qué es un sistema?",
   s:"Los sistemas son conjuntos de componentes que interactúan o son interdependientes.",
   html:`<p>Todo sistema tiene dos tipos de componentes:</p>
   <ul><li><b>Elementos:</b> las partes que se pueden contar o medir. Ej.: árboles, insectos, peces, personas.</li>
   <li><b>Procesos:</b> los cambios o actividades que ocurren. Ej.: crecimiento, mortalidad, descomposición, perturbaciones.</li></ul>
   <p>La <b>hipótesis Gaia</b> (James Lovelock y Lynn Margulis, década de 1970) lleva esta idea al extremo: propone que la Tierra entera se comporta como un solo ser que se autorregula, formado por partes interconectadas.</p>`,
   tip:"Si te piden «definir sistema», incluye las dos ideas clave: componentes y que interactúan o dependen entre sí."},
  {c:"1.2.2",t:"El enfoque de sistemas",
   s:"Un enfoque de sistemas es una forma holística de visualizar un conjunto complejo de interacciones, que se aplica a situaciones ecológicas o sociales.",
   html:`<ul><li><b>Holístico</b> significa mirar el todo y las relaciones entre las partes. Lo contrario es el <b>reduccionismo</b>: estudiar cada parte por separado, lo que puede ocultar cómo se comporta el sistema completo.</li>
   <li>Se aplica a sistemas <b>ecológicos</b> (ciclo del carbono, ciclo del nitrógeno) y <b>sociales</b> (una ciudad, para detectar dónde se desperdicia energía o agua).</li>
   <li>Ventaja: muestra efectos directos e indirectos y ayuda a tomar mejores decisiones a largo plazo.</li>
   <li>El enfoque integra varias disciplinas: biología, química, economía, sociología.</li></ul>`,
   tip:"En preguntas de «evaluar el enfoque de sistemas», menciona una fortaleza (visión del todo, efectos indirectos) y una limitación (simplifica, puede perder detalle)."},
  {c:"1.2.3",t:"Diagramas de sistemas",
   s:"En los diagramas de sistemas, los almacenes se representan con cajas rectangulares y los flujos con flechas que indican la dirección.",
   html:`<div class="defgrid">
   <div class="def"><h4>Almacén <span class="en">storage / stock</span></h4><p>Donde se guarda materia o energía. Se dibuja como <b>caja</b>. Ej.: un lago (agua), un bosque (carbono), una ciudad (población).</p></div>
   <div class="def"><h4>Flujo <span class="en">flow</span></h4><p>Movimiento entre almacenes, como entradas o salidas. Se dibuja como <b>flecha</b>. Ej.: evaporación, consumo, migración.</p></div>
   <div class="def"><h4>Tamaño relativo</h4><p>Cajas y flechas más grandes pueden indicar almacenes o flujos de mayor magnitud.</p></div>
   <div class="def"><h4>Etiquetas</h4><p>Cada flecha lleva el nombre del proceso: fotosíntesis, respiración, difusión, consumo.</p></div></div>
   <p style="margin-top:12px">Practica con el diagrama del ciclo del carbono amazónico en la pestaña <b>Practica</b>.</p>`,
   tip:"Al dibujar un diagrama en el examen: cajas para almacenes, flechas con dirección para flujos, y cada flecha con su proceso escrito. Sin etiquetas pierdes puntos."},
  {c:"1.2.4",t:"Transferencias y transformaciones",
   s:"Los flujos son procesos que pueden ser transferencias o transformaciones.",
   html:`<div class="defgrid">
   <div class="def"><h4>Transferencia</h4><p>La materia o energía <b>cambia de lugar</b> pero no de forma. Ej.: hojas que caen al suelo, agua que fluye por un río, un herbívoro que come una planta (la biomasa pasa de un nivel a otro), cosechar madera.</p></div>
   <div class="def"><h4>Transformación</h4><p>La materia o energía <b>cambia de forma o de estado</b>. Ej.: fotosíntesis (luz → energía química), respiración, evaporación (líquido → gas), combustión.</p></div></div>
   <p style="margin-top:12px">Las transformaciones pueden ser: materia a materia, energía a energía, materia a energía o energía a materia.</p>`,
   tip:"Truco: pregúntate «¿cambió la forma o el estado?». Si sí, es transformación. Si solo cambió de lugar, es transferencia."},
  {c:"1.2.5",t:"Sistemas abiertos, cerrados y aislados",
   s:"Los sistemas pueden ser abiertos o cerrados.",
   html:`<div class="defgrid">
   <div class="def"><h4>Abierto</h4><p>Intercambia <b>materia y energía</b> con su entorno. Casi todos los ecosistemas: un bosque, un lago, el manglar.</p></div>
   <div class="def"><h4>Cerrado</h4><p>Intercambia <b>energía, pero no materia</b>. Ej.: la Tierra (recibe luz solar y emite calor, pero casi no gana ni pierde materia), Biosfera 2, un terrario sellado.</p></div>
   <div class="def"><h4>Aislado</h4><p>No intercambia <b>ni materia ni energía</b>. Fuera del universo entero, no existen en la práctica.</p></div></div>`,
   tip:"Pregunta clásica: «¿La Tierra es un sistema abierto o cerrado?». Respuesta: cerrado, porque intercambia energía (luz y calor) pero prácticamente no intercambia materia."},
  {c:"1.2.6",t:"La Tierra, un sistema de esferas",
   s:"La Tierra es un único sistema integrado de esferas.",
   html:`<div class="defgrid">
   <div class="def"><h4>Biosfera</h4><p>Todos los seres vivos.</p></div>
   <div class="def"><h4>Hidrosfera</h4><p>Océanos, ríos, lagos, agua subterránea.</p></div>
   <div class="def"><h4>Criosfera</h4><p>Hielo y nieve: glaciares del Chimborazo, polos.</p></div>
   <div class="def"><h4>Geosfera</h4><p>Rocas, minerales y suelo.</p></div>
   <div class="def"><h4>Atmósfera</h4><p>La capa de gases.</p></div>
   <div class="def"><h4>Antroposfera</h4><p>Todo lo que los humanos hacen y construyen.</p></div></div>
   <p style="margin-top:12px">Las esferas se conectan: la fotosíntesis y la respiración (biosfera) regulan el oxígeno y el CO₂ (atmósfera). La antroposfera puede alterar esos mecanismos de autorregulación.</p>
   <p><b>Mundo de margaritas (Daisyworld):</b> un planeta imaginario creado por Lovelock y Watson con margaritas negras y blancas. Muestra cómo la vida puede regular el clima mediante retroalimentación negativa (ver 1.2.8).</p>`,
   tip:"Si te piden un ejemplo de interacción entre esferas, nombra las dos esferas y el proceso que las une. Ej.: la deforestación (antroposfera) reduce la fotosíntesis (biosfera) y aumenta el CO₂ (atmósfera)."},
  {c:"1.2.7",t:"Sistemas a distintas escalas",
   s:"El concepto de sistema se puede aplicar a distintas escalas.",
   html:`<ul><li><b>Pequeña:</b> una bromelia en el bosque, que guarda agua en sus hojas y alberga insectos, ranas y microorganismos.</li>
   <li><b>Grande:</b> la Amazonía, con subsistemas (ríos, parches de bosque, fauna) que regulan el clima y reciclan agua y carbono.</li>
   <li><b>Global:</b> la circulación atmosférica, que reparte calor y humedad por el planeta.</li></ul>
   <p>La escala importa porque una acción local puede tener efectos lejanos, y los mismos patrones (retroalimentación, equilibrio) aparecen en todos los niveles.</p>`,
   tip:"Ten listo un ejemplo propio para cada escala. Ej. local: un acuario o un estanque del colegio; regional: el estuario del Guayas; global: el ciclo del agua."},
  {c:"1.2.8",t:"Retroalimentación negativa",
   s:"Los bucles de retroalimentación negativa son estabilizadores.",
   html:`<p>La retroalimentación negativa <b>contrarresta</b> el cambio y devuelve el sistema a su estado inicial. Es como un termostato.</p>
   <ul><li><b>Temperatura corporal:</b> si te calientas, sudas y te enfrías; si te enfrías, tiritas y generas calor.</li>
   <li><b>Depredador-presa:</b> más presas → más depredadores → menos presas → menos depredadores.</li>
   <li><b>Daisyworld:</b> si el planeta se calienta, crecen las margaritas blancas, que reflejan luz y lo enfrían.</li>
   <li><b>CO₂ y plantas:</b> más CO₂ puede aumentar la fotosíntesis, que retira CO₂ de la atmósfera.</li></ul>
   <p>Observa cómo se comporta en el simulador de la pestaña <b>Practica</b>.</p>`,
   tip:"Al describir un bucle, escríbelo como cadena de causas con flechas y cierra el círculo: «aumenta X → … → X disminuye». Si el cambio se reduce, es negativa."},
  {c:"1.2.9",t:"Equilibrio en los ecosistemas",
   s:"Los ecosistemas abiertos tienden a un equilibrio estable, mantenido por retroalimentación negativa.",
   html:`<div class="defgrid">
   <div class="def"><h4>Equilibrio de estado estable <span class="en">steady-state</span></h4><p>Entradas y salidas continuas; hay fluctuaciones a corto plazo, pero no hay cambio a largo plazo. Ej.: un arrecife maduro.</p></div>
   <div class="def"><h4>Equilibrio estable <span class="en">stable equilibrium</span></h4><p>Tras una perturbación, el sistema vuelve a su estado original. Ej.: la vegetación vuelve a crecer tras un incendio.</p></div></div>
   <p style="margin-top:12px">La <b>sucesión</b> lleva a un ecosistema de un equilibrio a otro: tras el retroceso de un glaciar llegan líquenes y musgos, luego hierbas, arbustos y finalmente un bosque maduro.</p>`,
   tip:"No confundas estado estable (fluctúa alrededor de un valor medio) con equilibrio estable (vuelve al mismo estado tras una perturbación). Dibuja una gráfica de cada uno si puedes."},
  {c:"1.2.10",t:"Retroalimentación positiva",
   s:"Los bucles de retroalimentación positiva son desestabilizadores.",
   html:`<p>La retroalimentación positiva <b>amplifica</b> el cambio y aleja al sistema del equilibrio.</p>
   <ul><li><b>Hielo-albedo:</b> el calentamiento derrite hielo → queda expuesto océano oscuro que absorbe más calor → más calentamiento → más deshielo.</li>
   <li><b>Crecimiento poblacional:</b> más individuos → más nacimientos → aún más individuos.</li></ul>
   <p><b>Diagramas de bucles causales:</b> variables unidas por flechas con signo <b>+</b> (cambian en la misma dirección) o <b>−</b> (dirección opuesta). En el centro se marca <b>R</b> (refuerzo = positiva) o <b>B</b> (balance = negativa).</p>`,
   tip:"Ojo: «positiva» no significa «buena». Significa que refuerza el cambio. Un bucle positivo puede ser muy dañino."},
  {c:"1.2.11",t:"Hacia un punto de inflexión",
   s:"Los bucles de retroalimentación positiva tienden a llevar a los sistemas hacia un punto de inflexión.",
   html:`<p>Un <b>punto de inflexión</b> (tipping point) es un umbral crítico: al cruzarlo, un cambio pequeño desencadena cambios grandes, a menudo irreversibles, hacia un nuevo equilibrio.</p>
   <ul><li><b>Hielo ártico:</b> el bucle hielo-albedo podría llevar a veranos sin hielo.</li>
   <li><b>Amazonía:</b> menos bosque → menos lluvia reciclada y más CO₂ → más estrés y menos bosque. Podría convertirse en sabana.</li></ul>`,
   tip:"Para explicar un punto de inflexión, nombra el bucle positivo que empuja al sistema y describe el nuevo estado al que llega."},
  {c:"1.2.12",t:"Puntos de inflexión y cambios de régimen",
   s:"Los puntos de inflexión pueden causar grandes cambios de equilibrio a partir de cambios pequeños.",
   html:`<p>A diferencia del cambio gradual, el cambio en un punto de inflexión es <b>abrupto</b> y afecta a todo el sistema: se pasa a un estado estable alternativo (<b>cambio de régimen</b>).</p>
   <ul><li><b>Eutrofización:</b> exceso de nutrientes → algas → falta de oxígeno → el lago pasa de agua clara a turbia.</li>
   <li><b>Blanqueamiento de corales:</b> temperatura alta sostenida → los corales expulsan sus algas → arrecife muerto.</li>
   <li><b>Bosque a sabana</b> por deforestación y menos lluvia.</li>
   <li><b>Colapso pesquero:</b> la sobrepesca deja una población incapaz de reproducirse lo suficiente.</li></ul>
   <p>Sistemas en riesgo: hielo marino ártico, mantos de Groenlandia y Antártida occidental, El Niño (ENSO), monzón de África occidental, Amazonía, bosque boreal y la circulación termohalina.</p>`,
   tip:"Prueba el simulador del lago en la pestaña Practica: verás que para volver a agua clara hace falta reducir mucho más los nutrientes de lo que se necesitó para enturbiarlo. Esa es la irreversibilidad."},
  {c:"1.2.13",t:"Modelos",
   s:"Un modelo es una representación simplificada de la realidad que se usa para entender cómo funciona un sistema y predecir cómo responderá a un cambio.",
   html:`<ul><li>Ejemplos: un diagrama de flujos, un acuario como ecosistema en miniatura, un modelo climático por computadora, una ecuación.</li>
   <li>Algunos modelos usan aproximaciones; por eso las predicciones climáticas pueden variar entre modelos.</li>
   <li>Al resumir algo complejo, todo modelo pierde algo de información y precisión.</li></ul>`,
   tip:"Si te piden «identificar» un modelo en un texto, busca representaciones simplificadas: diagramas, mapas, gráficas, maquetas, simulaciones."},
  {c:"1.2.14",t:"Fortalezas y limitaciones de los modelos",
   s:"Simplificar un modelo implica aproximación y pérdida de precisión.",
   html:`<div class="defgrid">
   <div class="def"><h4>Fortalezas</h4><p>Simplifican sistemas complejos; permiten predecir; permiten probar cambios sin esperar a que ocurran; sirven para comunicar resultados a científicos y al público.</p></div>
   <div class="def"><h4>Limitaciones</h4><p>No son totalmente precisos; los factores ambientales son muy complejos; dependen de la calidad de los datos y de quién los construye; distintos modelos dan resultados distintos; pueden interpretarse de diferentes formas o usarse con fines políticos.</p></div></div>`,
   tip:"«Evaluar un modelo» = fortalezas + limitaciones + conclusión. Una buena conclusión dice para qué sirve el modelo a pesar de sus límites."},
  {c:"1.2.15",t:"Propiedades emergentes",
   s:"Las interacciones entre los componentes de un sistema pueden generar propiedades emergentes.",
   html:`<p>Una <b>propiedad emergente</b> es una característica del sistema completo que no tienen sus partes por separado. El todo es más que la suma de las partes.</p>
   <ul><li>Dos bosques con los mismos árboles pueden ofrecer hábitats distintos según cómo están distribuidos y su tamaño.</li>
   <li>Una sola abeja no regula la temperatura; una colmena sí.</li>
   <li>La estabilidad y la resiliencia de un ecosistema son propiedades emergentes.</li></ul>
   <p>Ignorar la emergencia lleva a la <b>falacia de división</b>: suponer que lo que es cierto del todo es cierto de cada parte.</p>`,
   tip:"Una propiedad emergente solo se puede estudiar con un enfoque holístico. Es un buen argumento a favor del enfoque de sistemas (1.2.2)."},
  {c:"1.2.16",t:"Resiliencia",
   s:"La resiliencia de un sistema ayuda a evitar los puntos de inflexión y a mantener la estabilidad.",
   html:`<p>La <b>resiliencia</b> es la capacidad de un sistema para <b>resistir</b> una perturbación, <b>recuperarse</b> de ella y <b>adaptarse</b>.</p>
   <ul><li>Los pinos de Yellowstone se regeneraron tras los incendios de 1988 gracias a piñas que se abren con el calor.</li>
   <li>Un arrecife puede recuperarse del blanqueamiento si la temperatura se estabiliza.</li>
   <li>La sociedad japonesa se reconstruyó tras el tsunami y el accidente nuclear de 2011 (resiliencia social).</li>
   <li>La reintroducción de lobos en Yellowstone (1995) devolvió la resiliencia al ecosistema. Ver pestaña <b>Casos</b>.</li></ul>`,
   tip:"Usa los tres verbos en tus respuestas: resistir, recuperarse, adaptarse. Muestra que entiendes que la resiliencia no es solo «aguantar»."},
  {c:"1.2.17",t:"Diversidad, tamaño de almacenes y retrasos",
   s:"La diversidad y el tamaño de los almacenes contribuyen a la resiliencia de los sistemas y afectan su velocidad de respuesta al cambio (retrasos).",
   html:`<ul><li><b>Diversidad = redundancia:</b> si varias especies cumplen la misma función, el sistema sigue funcionando aunque una desaparezca. Una pradera diversa resiste sequías, fuegos y plagas; un monocultivo de banano o cacao es vulnerable y necesita muchos insumos.</li>
   <li><b>Almacenes grandes = amortiguación:</b> un charco responde de inmediato al sol o la lluvia; un lago grande responde lento y absorbe mejor los cambios.</li>
   <li><b>Retrasos (time lags):</b> el sistema tarda en mostrar la respuesta. Esto hace difícil predecir los puntos de inflexión: cuando vemos el daño, puede ser tarde.</li></ul>`,
   tip:"Un retraso puede ser engañoso: la gente cree que no hay problema porque aún no se ve el efecto. Es un buen argumento para el principio de precaución."},
  {c:"1.2.18",t:"Los humanos reducen la resiliencia",
   s:"Los humanos pueden afectar la resiliencia de los sistemas al reducir sus almacenes y su diversidad.",
   html:`<ul><li>La deforestación y la contaminación reducen la diversidad y los almacenes (carbono, suelo, agua). El sistema queda más vulnerable a especies invasoras y se recupera peor, lo que puede llevar a degradación irreversible o desertificación.</li>
   <li><b>Cómo aumentar la resiliencia:</b> reducir perturbaciones (frenar la deforestación) y aumentar almacenes y diversidad (reforestar con especies variadas, prácticas que guardan carbono en el suelo).</li>
   <li>Ej.: en Filipinas, una aldea pesquera que agotó sus peces con dinamita creó una reserva sin pesca en el 10 % de su arrecife y recuperó su pesquería.</li>
   <li>Ej. local: la tala de manglares para camaroneras reduce la protección de la costa ante oleajes e inundaciones.</li></ul>`,
   tip:"Estructura útil: acción humana → qué almacén o qué diversidad reduce → por qué baja la resiliencia → consecuencia concreta."}
 ],
 casesIntro:"Usa estos casos como evidencia de sistemas reales: identifica almacenes, flujos, bucles de retroalimentación y qué hace al sistema más o menos resiliente.",
 cases:[
  {t:"Biosfera 2: un sistema cerrado construido por humanos",u:"1.2.5 · 1.2.13",vid:null,
   bg:"Biosfera 2 es un enorme invernadero sellado en Arizona (EE. UU.) que intentó recrear varios ecosistemas (selva, océano, desierto, sabana) como un sistema cerrado: entraba luz y salía calor, pero no entraba ni salía materia. En la primera misión (1991-1993), ocho personas vivieron dentro dos años. El oxígeno bajó tanto que hubo que inyectarlo desde fuera.",
   st:[["Almacenes","","Aire, agua, suelo, plantas, animales y personas dentro de la estructura."],["Problema","","El suelo rico en materia orgánica liberó CO₂ por descomposición microbiana y el concreto absorbió parte del CO₂ sin devolver oxígeno."],["Lección","","Es muy difícil reproducir los servicios que la Tierra presta gratis. Ningún modelo incluye todas las interacciones."]],
   q:["¿Por qué Biosfera 2 es un sistema cerrado y no aislado?","¿Qué limitaciones de los modelos muestra este experimento?","¿Qué nos dice sobre el valor de los ecosistemas naturales?"]},
  {t:"Ciclo del carbono de la Amazonía",u:"1.2.3 · 1.2.11",vid:null,
   bg:"La Amazonía guarda enormes cantidades de carbono en su vegetación y su suelo, y funciona como sumidero de carbono. También recicla buena parte de su propia lluvia mediante la transpiración. La deforestación y los incendios liberan carbono y reducen la lluvia, lo que podría empujar al bosque hacia un punto de inflexión.",
   st:[["Almacenes","","Atmósfera, vegetación, suelo y hojarasca, ríos."],["Flujos","","Fotosíntesis, respiración, descomposición, caída de hojas, transporte por ríos, incendios."],["Bucle positivo","","Menos bosque → menos lluvia y más CO₂ → más sequía e incendios → menos bosque."]],
   q:["Dibuja el diagrama de sistema con almacenes y flujos etiquetados.","Clasifica cada flujo como transferencia o transformación.","Explica por qué la Amazonía podría convertirse en sabana."]},
  {t:"Los lobos de Yellowstone: una cascada trófica",u:"1.2.16",vid:"ysa5OBhXz-Q",
   bg:"A comienzos del siglo XX se eliminaron los lobos de Yellowstone. Los alces (wapitíes) aumentaron y sobrepastorearon sauces y álamos. En 1995 se reintrodujeron los lobos: controlaron a los alces, la vegetación se recuperó, las orillas de los ríos se estabilizaron y volvieron los castores, aves e insectos.",
   st:[["Lobos (depredador tope)","","Regulan a los alces desde arriba: control de arriba hacia abajo."],["Alces","","Sin depredadores, su población crece y degrada la vegetación."],["Vegetación y ríos","","Al recuperarse, sostienen a muchas otras especies y estabilizan el paisaje."]],
   q:["Describe el bucle de retroalimentación negativa entre lobos, alces y vegetación.","¿Cómo aumentó la resiliencia del ecosistema con la vuelta de los lobos?","¿Qué pasaría si se eliminara una especie clave en un ecosistema ecuatoriano?"]},
  {t:"Reserva marina en una aldea pesquera de Filipinas",u:"1.2.18",vid:"v8oNhckPjFM",
   bg:"Para pescar más, la comunidad usó dinamita, jornadas más largas y mejores redes. Los peces se agotaron. La comunidad decidió cerrar a la pesca el 10 % de su arrecife como santuario marino. Los peces se reprodujeron dentro de la reserva y se extendieron a las zonas vecinas, y la pesquería se recuperó.",
   st:[["Pescadores","","Al principio reducían el almacén de peces y la diversidad del arrecife."],["Santuario","","Aumentó el almacén y la diversidad, lo que devolvió la resiliencia al sistema."],["Comunidad","","Recuperó su sustento y su forma de vida."]],
   q:["Explica cómo la sobrepesca redujo la resiliencia del arrecife.","¿Por qué proteger solo el 10 % benefició a toda la zona?","¿Podría aplicarse esta estrategia en la costa ecuatoriana?"]},
  {t:"El Niño y la costa ecuatoriana",u:"1.2.7 · 1.2.10 · 1.2.12",vid:null,local:true,
   bg:"El Niño (ENSO) es un sistema océano-atmósfera de escala global que nos afecta directamente: cuando el Pacífico oriental se calienta, llegan lluvias intensas e inundaciones a la Costa y cambia la pesca. Se sostiene por un bucle de retroalimentación positiva (bucle de Bjerknes): los vientos alisios se debilitan, el agua cálida se acumula frente a Sudamérica, la diferencia de temperatura entre ambos lados del Pacífico disminuye y los vientos se debilitan aún más. El IB lo incluye entre los sistemas con posible punto de inflexión.",
   st:[["Escala","","Global (Pacífico), regional (costa ecuatoriana) y local (inundaciones en Guayaquil)."],["Bucle positivo","","Vientos más débiles → agua más cálida al este → vientos aún más débiles."],["Impactos","","Inundaciones, pérdidas agrícolas, cambios en la pesca de sardina y anchoveta, enfermedades transmitidas por mosquitos."]],
   q:["Explica por qué El Niño es un ejemplo de sistema a distintas escalas.","Dibuja el bucle de Bjerknes como diagrama de bucle causal y marca si es R o B.","¿Qué podría aumentar la resiliencia de Guayaquil ante un Niño fuerte?"]}
 ],

 cards:[
  ["Sistema","system","Conjunto de componentes que interactúan o son interdependientes."],
  ["Enfoque de sistemas","systems approach","Forma holística de visualizar un conjunto complejo de interacciones."],
  ["Reduccionismo","reductionism","Estudiar las partes de un sistema por separado; puede ocultar el comportamiento del todo."],
  ["Almacén","storage / stock","Lugar donde se guarda materia o energía. Se dibuja como caja."],
  ["Flujo","flow","Movimiento de materia o energía entre almacenes. Se dibuja como flecha."],
  ["Transferencia","transfer","Flujo en el que la materia o energía cambia de lugar, pero no de forma."],
  ["Transformación","transformation","Flujo en el que la materia o energía cambia de forma o de estado."],
  ["Sistema abierto","open system","Intercambia materia y energía con su entorno."],
  ["Sistema cerrado","closed system","Intercambia energía, pero no materia."],
  ["Sistema aislado","isolated system","No intercambia ni materia ni energía. No existe en la práctica."],
  ["Retroalimentación negativa","negative feedback","Bucle que contrarresta el cambio y estabiliza el sistema."],
  ["Retroalimentación positiva","positive feedback","Bucle que amplifica el cambio y desestabiliza el sistema."],
  ["Equilibrio de estado estable","steady-state equilibrium","Entradas y salidas continuas; fluctúa a corto plazo sin cambio a largo plazo."],
  ["Equilibrio estable","stable equilibrium","Tras una perturbación, el sistema vuelve a su estado original."],
  ["Punto de inflexión","tipping point","Umbral crítico tras el cual un cambio pequeño provoca un cambio grande, a menudo irreversible."],
  ["Modelo","model","Representación simplificada de la realidad para entender y predecir un sistema."],
  ["Propiedad emergente","emergent property","Característica del sistema completo que no tienen sus partes por separado."],
  ["Resiliencia","resilience","Capacidad de un sistema para resistir, recuperarse y adaptarse ante una perturbación."],
  ["Hipótesis Gaia","Gaia hypothesis","Propuesta de que la Tierra funciona como un sistema único que se autorregula."],
  ["Retraso","time lag","Tiempo que tarda un sistema en mostrar la respuesta a un cambio."]
 ],
 quiz:[
  {s:"En un diagrama de sistema, ¿cómo se representa un almacén?",o:["Con una flecha","Con una caja rectangular","Con un círculo punteado","Con una línea ondulada"],a:1,e:"Almacenes en cajas, flujos en flechas con dirección."},
  {s:"¿Cuál de estos flujos es una TRANSFORMACIÓN?",o:["Hojas que caen al suelo","Agua que corre por un río","Evaporación del agua de un lago","Un pez que es arrastrado por la corriente"],a:2,e:"La evaporación cambia el estado del agua (líquido → gas). Las demás solo cambian de lugar."},
  {s:"La Tierra se considera un sistema cerrado porque:",o:["No intercambia ni materia ni energía","Intercambia energía, pero prácticamente no materia","Intercambia materia y energía libremente","Solo intercambia materia"],a:1,e:"Recibe luz solar y emite calor, pero casi no gana ni pierde materia."},
  {s:"Cuando la temperatura corporal sube, sudamos y el cuerpo se enfría. Es un ejemplo de:",o:["Retroalimentación positiva","Punto de inflexión","Retroalimentación negativa","Propiedad emergente"],a:2,e:"El sistema contrarresta el cambio y vuelve a su estado inicial."},
  {s:"El deshielo reduce el albedo, el océano absorbe más calor y se derrite más hielo. Esto es:",o:["Retroalimentación negativa","Retroalimentación positiva","Equilibrio de estado estable","Una transferencia"],a:1,e:"El cambio se amplifica a sí mismo: es un bucle de refuerzo."},
  {s:"¿Qué describe mejor un punto de inflexión?",o:["Un cambio gradual y reversible","Un umbral tras el cual un cambio pequeño causa un cambio grande y a menudo irreversible","El punto donde entradas y salidas se igualan","El momento en que un modelo deja de funcionar"],a:1,e:"Al cruzar el umbral el sistema pasa a un nuevo equilibrio, muchas veces sin retorno."},
  {s:"¿Cuál es una limitación de los modelos ambientales?",o:["Permiten predecir resultados","Simplifican sistemas complejos","Pueden dar resultados distintos con los mismos datos","Sirven para comunicar ideas al público"],a:2,e:"Las otras opciones son fortalezas."},
  {s:"Un monocultivo de banano es menos resiliente que un bosque diverso porque:",o:["Tiene más almacenes de carbono","Tiene poca diversidad y por tanto poca redundancia ante plagas","Es un sistema cerrado","Tiene más retroalimentación positiva natural"],a:1,e:"Con una sola especie, una plaga puede afectar a todo el sistema; no hay otras especies que cumplan la misma función."},
  {s:"¿Por qué un lago grande responde más lento que un charco a una sequía?",o:["Porque tiene mayor diversidad","Porque es un sistema aislado","Porque su almacén es mayor y amortigua el cambio","Porque no tiene flujos de salida"],a:2,e:"Los almacenes grandes amortiguan los cambios y producen retrasos en la respuesta."},
  {s:"La capacidad de una colmena para regular su temperatura, que una abeja sola no tiene, es un ejemplo de:",o:["Propiedad emergente","Reduccionismo","Transferencia","Sistema aislado"],a:0,e:"Es una característica del todo que no tienen las partes por separado."}

 long:[
  {q:"Distingue entre retroalimentación positiva y negativa, usando un ejemplo ambiental de cada una.",m:"[4]",

function practice12(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Diagrama de sistema: carbono en la Amazonía</h3><span class="eyebrow">1.2.3 · 1.2.4</span></div>
   <p class="prose" style="margin:6px 0 10px">Cajas = almacenes. Flechas = flujos. Toca un número para ver el proceso y si es transferencia o transformación.</p>
   <div class="graph" id="amz"></div><div class="detail" id="amzd" style="margin-top:10px">Toca un número en el diagrama.</div></div>
  <div class="card" id="ttbox"></div>
  <div class="card" id="ocbox"></div>
  <div class="card"><div class="rowhead"><h3>Simulador de retroalimentación</h3><span class="eyebrow">1.2.8 · 1.2.10</span></div>
   <p class="prose" style="margin:6px 0 10px">Aplica una perturbación al sistema y observa qué pasa en los siguientes pasos. Gráfica <b>esquemática</b>, no son datos reales.</p>
   <div class="seg" id="fbmode"><button class="opt" data-m="neg" aria-pressed="true">Negativa: temperatura corporal</button><button class="opt" data-m="pos" aria-pressed="false">Positiva: hielo y albedo</button></div>
   <div class="ctl" style="margin-top:12px"><label for="pert">Tamaño de la perturbación inicial: <b id="pertv">2</b></label><input type="range" id="pert" min="1" max="5" step="1" value="2"></div>
   <div class="graph" id="fbg" style="margin-top:8px"></div><div class="detail" id="fbd" style="margin-top:10px"></div></div>
  <div class="card"><div class="rowhead"><h3>Simulador: el lago y su punto de inflexión</h3><span class="eyebrow">1.2.11 · 1.2.12</span></div>
   <p class="prose" style="margin:6px 0 10px">Sube los nutrientes (fertilizantes, aguas residuales) que llegan al lago. Luego intenta bajarlos para recuperar el agua clara. Modelo simplificado con umbrales ilustrativos.</p>
   <div class="lake"><div class="lakebox" id="lakebox" role="img" aria-label="Color del lago"></div>
   <div style="display:grid;gap:10px"><div class="ctl"><label for="nut">Entrada de nutrientes: <b id="nutv">2</b> de 10</label><input type="range" id="nut" min="0" max="10" step="1" value="2"></div>
   <div class="detail" id="laked"></div></div></div></div>
  <div class="card" id="fbbox"></div>`;
  drawAmazon();
  classifier($("#ttbox"),"¿Transferencia o transformación?","1.2.4 · Pregúntate si cambió la forma o el estado, o solo el lugar.",TT_ITEMS,TT_CATS);
  classifier($("#ocbox"),"¿Abierto, cerrado o aislado?","1.2.5 · Piensa qué entra y qué sale: ¿materia, energía o ambas?",OC_ITEMS,OC_CATS);
  classifier($("#fbbox"),"¿Retroalimentación positiva o negativa?","1.2.8 · 1.2.10 · Sigue la cadena: ¿el cambio se reduce o se amplifica?",FB_ITEMS,FB_CATS);
  let mode="neg";
  const fbDraw=()=>{
    const k=+$("#pert").value;$("#pertv").textContent=k;
    const W=600,H=260,L=48,R=16,T=16,B=40,N=10;
    const vals=[0,k];for(let i=2;i<=N;i++){const v=vals[i-1];vals.push(mode==="neg"?v*0.55:Math.min(v*1.45,30))}
    const max=mode==="neg"?6:30;
    const xs=i=>L+i/N*(W-L-R),ys=v=>T+(1-v/max)*(H-T-B);
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de la desviación del sistema en cada paso">`;
    const ticks=mode==="neg"?[0,2,4,6]:[0,10,20,30];
    ticks.forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`});
    for(let i=0;i<=N;i+=2)g+=`<text x="${xs(i)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${i}</text>`;
    g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">Paso de tiempo</text><text x="12" y="${(T+H-B)/2}" transform="rotate(-90 12 ${(T+H-B)/2})" text-anchor="middle" font-size="11" fill="var(--muted)">Desviación del equilibrio</text>`;
    const col=mode==="neg"?"var(--ok)":"var(--bad)";
    g+=`<path d="${vals.map((v,i)=>(i?"L":"M")+xs(i).toFixed(1)+","+ys(v).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>`;
    vals.forEach((v,i)=>g+=`<circle cx="${xs(i)}" cy="${ys(v)}" r="${i===N?5:3.5}" fill="${col}"/>`);
    g+=`</svg>`;$("#fbg").innerHTML=g;
    $("#fbd").innerHTML=mode==="neg"
      ?`<b>Retroalimentación negativa.</b> Te sube la temperatura → sudas → la temperatura baja. Cada paso la desviación se reduce hasta volver al equilibrio (37 °C). Prueba con una perturbación mayor: el sistema igual vuelve.`
      :`<b>Retroalimentación positiva.</b> Se calienta el Ártico → se derrite hielo → el océano oscuro absorbe más calor → se derrite más hielo. La desviación crece en cada paso. Así un sistema se acerca a un punto de inflexión.`;
  };
  p.querySelectorAll("#fbmode .opt").forEach(b=>b.onclick=()=>{mode=b.dataset.m;p.querySelectorAll("#fbmode .opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));fbDraw()});
  $("#pert").oninput=fbDraw;fbDraw();
  let turbid=false;
  const lakeDraw=()=>{
    const n=+$("#nut").value;$("#nutv").textContent=n;
    if(!turbid&&n>=7)turbid=true;
    if(turbid&&n<=2)turbid=false;
    const box=$("#lakebox");
    box.style.background=turbid?"color-mix(in oklab, var(--eco) 70%, var(--ochre))":`color-mix(in oklab, var(--tecno) ${55+n*4}%, var(--eco) ${n*4}%)`;
    let msg;
    if(!turbid&&n<4)msg="<b>Agua clara.</b> Las plantas acuáticas fijan el sedimento y compiten con las algas. La retroalimentación negativa mantiene el equilibrio.";
    else if(!turbid)msg="<b>Agua clara, pero bajo estrés.</b> Hay más algas, aunque el sistema todavía resiste. Está perdiendo resiliencia y se acerca al umbral.";
    else if(n>2&&n<7)msg="<b>Sigue turbio aunque bajaste los nutrientes.</b> Las algas dan sombra, las plantas del fondo murieron y el sedimento libera más nutrientes. El nuevo estado se mantiene solo. Esto es la irreversibilidad de un punto de inflexión: para volver hay que bajar mucho más.";
    else msg="<b>Cambio de régimen: agua turbia.</b> Cruzaste el umbral. Las algas cubren la superficie, al morir consumen oxígeno y los peces mueren. Un bucle positivo empuja al lago a un nuevo equilibrio.";
    if(!turbid&&n<=2&&lakeDraw.wasTurbid)msg="<b>Recuperado.</b> Solo al reducir los nutrientes casi al mínimo, el lago volvió a su estado claro. Hizo falta mucho más esfuerzo para restaurarlo que el que costó dañarlo.";
    lakeDraw.wasTurbid=turbid||(lakeDraw.wasTurbid&&n<=2);
    $("#laked").innerHTML=msg;
  };
  $("#nut").oninput=lakeDraw;lakeDraw.wasTurbid=false;lakeDraw();
}

function drawAmazon(){
  const W=640,H=380;
  const box=(x,y,w,h,label,sub)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="${x+w/2}" y="${y+h/2-2}" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque, sans-serif">${label}</text><text x="${x+w/2}" y="${y+h/2+15}" text-anchor="middle" font-size="11" fill="var(--muted)">${sub}</text>`;
  const arrows=[[220,76,108,206,7],[165,206,262,80,3],[208,206,306,80,3],[232,238,404,238,3],[520,206,402,80,3],[510,268,510,312,2.5]];
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama del ciclo del carbono en la Amazonía con almacenes y flujos numerados"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>`;
  g+=box(200,20,240,56,"Atmósfera","CO₂")+box(30,210,200,56,"Vegetación","biomasa")+box(410,210,200,56,"Suelo y hojarasca","materia orgánica")+box(410,316,200,50,"Ríos y océano","carbono disuelto");
  arrows.forEach((a,i)=>{const mx=(a[0]+a[2])/2,my=(a[1]+a[3])/2;
    g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${a[2]}" y2="${a[3]}" stroke="var(--accent)" stroke-width="${a[4]}" marker-end="url(#ah)"/>`;
    g+=`<g class="amzf" data-i="${i}" tabindex="0" role="button" style="cursor:pointer" aria-label="Flujo ${i+1}: ${AMAZON_FLOWS[i][0]}"><circle cx="${mx}" cy="${my}" r="13" fill="var(--ochre)"/><text x="${mx}" y="${my+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)" font-family="IBM Plex Mono, monospace">${i+1}</text></g>`;});
  g+=`</svg>`;
  $("#amz").innerHTML=g;
  document.querySelectorAll(".amzf").forEach(el=>{const f=()=>{const x=AMAZON_FLOWS[+el.dataset.i];$("#amzd").innerHTML=`<b>${+el.dataset.i+1}. ${esc(x[0])}</b> · <span class="tag ${x[1]==="Transferencia"?"tecno":"eco"}" style="font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:999px">${x[1]}</span><br>${esc(x[2])}`};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
}
