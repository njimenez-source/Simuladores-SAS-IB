const S83={
 code:"8.3",title:"Contaminación del aire urbano",hours:"3 horas de clase",src:"https://www.mrgscience.com/ess-subtopic-83-urban-air-pollution.html",
 intro:"Según la Organización Mundial de la Salud, la contaminación del aire causa alrededor de siete millones de muertes prematuras al año en el mundo. En ciudades como Quito, el tráfico, la altitud y las montañas que la rodean influyen en la calidad del aire. Este subtema explica los principales contaminantes urbanos, sus fuentes, la lluvia ácida y las estrategias para reducirlos.",
 guiding:["¿Qué contaminantes afectan el aire de las ciudades y de dónde vienen?","¿Cómo se puede gestionar la contaminación del aire y la lluvia ácida?"],
 und:[
  {c:"8.3.1",t:"Contaminantes del aire urbano",
   s:"La contaminación del aire urbano se debe a entradas humanas como óxidos de nitrógeno, dióxido de azufre, monóxido de carbono y material particulado.",
   html:`<div class="defgrid">
   <div class="def"><h4>Material particulado (PM)</h4><p><b>PM2,5</b>: partículas finas (≤ 2,5 µm) de la combustión; llegan a lo profundo de los pulmones y a la sangre. <b>PM10</b>: partículas más gruesas (polvo de calles, construcción); irritan las vías respiratorias.</p></div>
   <div class="def"><h4>Óxidos de nitrógeno (NOₓ)</h4><p>Combustión a alta temperatura en motores e industria. Forman ozono troposférico y lluvia ácida.</p></div>
   <div class="def"><h4>Dióxido de azufre (SO₂)</h4><p>Quema de carbón y combustibles con azufre (diésel de mala calidad). Causa lluvia ácida y problemas respiratorios.</p></div>
   <div class="def"><h4>Monóxido de carbono (CO)</h4><p>Combustión incompleta. Incoloro e inodoro; reduce el transporte de oxígeno en la sangre.</p></div></div>`,
   tip:"Asocia cada contaminante con su fuente principal y un efecto en la salud."},
  {c:"8.3.2",t:"Contaminantes primarios y secundarios",
   s:"Los contaminantes primarios se emiten directamente; los secundarios se forman en la atmósfera.",
   html:`<ul><li><b>Primarios:</b> se emiten directamente y son activos al salir. Fuentes naturales: incendios, polvo, erupciones (ceniza del Tungurahua, Cotopaxi o Sangay). Fuentes humanas: tráfico, industria, quema de biomasa, construcción.</li>
   <li><b>Secundarios:</b> se forman al reaccionar los primarios en la atmósfera, a menudo con la luz solar. Ej.: <b>ozono troposférico</b> (de NOₓ y compuestos orgánicos volátiles con luz solar), ácido sulfúrico y ácido nítrico (lluvia ácida).</li>
   <li>El ozono troposférico daña los pulmones y los cultivos, y es un gas de efecto invernadero. No confundir con el ozono estratosférico, que nos protege (6.4).</li>
   <li>Los <b>líquenes</b> son especies indicadoras: desaparecen donde el aire está contaminado con SO₂.</li></ul>`,
   tip:"Primario = sale tal cual de la fuente. Secundario = se forma después en el aire."},
  {c:"8.3.3",t:"Contaminantes de la quema de combustibles fósiles",
   s:"La quema de combustibles fósiles produce contaminantes directos e indirectos.",
   html:`<ul><li><b>Directos:</b> NOₓ, SO₂, CO, material particulado, CO₂.</li>
   <li><b>Indirectos (secundarios):</b> ozono troposférico, lluvia ácida, partículas secundarias de sulfatos y nitratos.</li>
   <li>Los vehículos diésel antiguos son una fuente importante de partículas en las ciudades ecuatorianas.</li></ul>`,
   tip:"Relaciona este punto con 6.1 y 6.2: la misma quema de combustibles causa contaminación local y cambio climático global."},
  {c:"8.3.4",t:"Gestión de la contaminación del aire urbano",
   s:"Existen estrategias para reducir la contaminación del aire en las ciudades.",
   html:`<ul><li><b>Transporte:</b> transporte público (Metro de Quito, buses de tránsito rápido como en Bogotá, buses eléctricos), ciclovías, zonas peatonales.</li>
   <li><b>Planificación verde:</b> árboles y muros verdes que filtran partículas.</li>
   <li><b>Tecnología:</b> convertidores catalíticos (transforman CO, NOₓ e hidrocarburos en sustancias menos dañinas), filtros de partículas, combustibles con menos azufre.</li>
   <li><b>Políticas:</b> revisión técnica vehicular obligatoria (como en Quito), cobros por congestión, zonas de bajas emisiones, restricción vehicular por placa (pico y placa).</li>
   <li><b>Monitoreo y educación:</b> redes de monitoreo de la calidad del aire y alertas al público.</li></ul>`,
   tip:"Organiza las estrategias según el modelo de gestión de la contaminación (4.4.8): cambiar la actividad, controlar la emisión, limpiar."},
  {c:"8.3.5",t:"La química de la lluvia ácida",
   s:"La lluvia ácida se forma cuando el dióxido de azufre y los óxidos de nitrógeno reaccionan en la atmósfera.",
   html:`<p style="font-family:var(--f-mono);font-size:.98rem;background:var(--sunk);padding:10px 14px;border-radius:8px">2SO₂ + O₂ → 2SO₃<br>SO₃ + H₂O → H₂SO₄ (ácido sulfúrico)<br><br>2NO + O₂ → 2NO₂<br>4NO₂ + 2H₂O + O₂ → 4HNO₃ (ácido nítrico)</p>
   <ul><li>La lluvia normal es un poco ácida (pH alrededor de 5,6) por el CO₂; la lluvia ácida tiene pH menor.</li>
   <li>Los contaminantes pueden viajar cientos de kilómetros y caer en otros países: es un problema <b>transfronterizo</b>.</li>
   <li>Caso: el «Triángulo Negro» entre Alemania, Polonia y la República Checa, donde las centrales de carbón destruyeron bosques y acidificaron lagos.</li></ul>`,
   tip:"Recuerda los dos ácidos y sus orígenes: sulfúrico del SO₂, nítrico de los NOₓ."},
  {c:"8.3.6",t:"Impactos de la lluvia ácida",
   s:"La lluvia ácida afecta a los ecosistemas terrestres y acuáticos, a los edificios y a la salud humana.",
   html:`<ul><li><b>Suelos y bosques:</b> lixivia calcio, magnesio y potasio; libera aluminio tóxico para las raíces (efecto indirecto); daña las hojas (efecto directo).</li>
   <li><b>Lagos y ríos:</b> el aluminio liberado daña las branquias de los peces; desaparecen especies sensibles.</li>
   <li><b>Edificios:</b> disuelve el mármol y la piedra caliza (el carbonato de calcio se convierte en sulfato de calcio soluble) y corroe metales.</li>
   <li><b>Salud:</b> la lluvia en sí no es peligrosa al tocarla, pero los gases y las partículas de sulfatos y nitratos causan enfermedades respiratorias.</li></ul>`,
   tip:"Diferencia efectos directos (sobre hojas y edificios) e indirectos (a través del suelo y el agua)."},
  {c:"8.3.7",t:"Gestión del SO₂ y los NOₓ",
   s:"La lluvia ácida se puede gestionar cambiando la actividad humana, controlando las emisiones y restaurando los ecosistemas.",
   html:`<div class="defgrid">
   <div class="def"><h4>Cambiar la actividad</h4><p>Energías renovables, eficiencia energética, transporte público y vehículos eléctricos.</p></div>
   <div class="def"><h4>Controlar en el punto de emisión</h4><p>Depuradores de gases (desulfuración con caliza que produce yeso), reducción catalítica de NOₓ, convertidores catalíticos, quemadores de bajo NOₓ, combustibles con menos azufre.</p></div>
   <div class="def"><h4>Restaurar</h4><p>Encalado de lagos y suelos (añadir caliza para neutralizar la acidez), fertilización, reforestación.</p></div></div>`,
   tip:"Es el modelo de gestión de la contaminación con tres niveles; el primero es el más sostenible."}
 ],

function classifier(el,title,lead,items,cats,key){
  el.innerHTML=`<div class="rowhead"><h3>${title}</h3><span><span class="score"></span> <button class="reset">Reiniciar</button></span></div><p class="prose" style="margin:0">${lead}</p><div class="cls"></div>`;
  const list=$(".cls",el);let right=0,answered=0;
  const sc=()=>$(".score",el).textContent=`${right}/${items.length} correctas`;
  items.forEach(it=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML=`<q>${esc(it.q)}</q><div class="opts">${cats.map(([k,l])=>`<button class="opt" data-k="${k}">${l}</button>`).join("")}</div><div class="fb" hidden></div>`;
    d.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const ok=b.dataset.k===it.a;answered++;if(ok)right++;
      d.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.k===it.a)x.classList.add("right")});
      if(!ok)b.classList.add("wrong");
      const fb=$(".fb",d);fb.hidden=false;fb.className="fb "+(ok?"ok":"no");
      fb.innerHTML=`<b>${ok?"Correcto.":"Revisa:"}</b> ${esc(it.e)}`;sc();
    });
    list.appendChild(d);
  });
  sc();$(".reset",el).onclick=()=>classifier(el,title,lead,items,cats,key);
}

function drawGraph(){
  // schematic: x 2000..2025, y 0..80 %
  const W=640,H=300,L=56,R=20,T=20,B=44;
  const xs=y=>L+(y-2000)/25*(W-L-R), ys=v=>T+(1-v/80)*(H-T-B);
  const pts=[[2000,6],[2004,7],[2008,8],[2010,9],[2012,14],[2014,22],[2016,28],[2018,33],[2019,36],[2020,48],[2021,58],[2022,62],[2024,66],[2025,67]];
  const path=pts.map((p,i)=>(i?"L":"M")+xs(p[0]).toFixed(1)+","+ys(p[1]).toFixed(1)).join(" ");
  const area=path+` L${xs(2025)},${ys(0)} L${xs(2000)},${ys(0)} Z`;
  const marks=[[2011,11,"1","Campaña de una ONG en colegios","El aumento empieza lento: una campaña educativa cambia valores poco a poco. Es un cambio en las entradas del SVA."],[2020,48,"2","Ordenanza que cobra las fundas plásticas","Salto brusco: una ley con incentivo económico cambia la conducta rápidamente. Las leyes son una entrada poderosa."],[2024,66,"3","Estabilización","La curva se aplana: quedan grupos que no cambian (por costo, costumbre o acceso). Una nueva campaña tendría que dirigirse a ellos."]];
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica esquemática conducta-tiempo del uso de bolsas reutilizables entre 2000 y 2025">`;
  [0,20,40,60,80].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${ys(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`});
  [2000,2005,2010,2015,2020,2025].forEach(y=>{g+=`<text x="${xs(y)}" y="${H-B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${y}</text>`});
  g+=`<text x="14" y="${(T+H-B)/2}" transform="rotate(-90 14 ${(T+H-B)/2})" text-anchor="middle" font-size="11" fill="var(--muted)">% de personas</text>`;
  g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">Año</text>`;
  g+=`<path d="${area}" fill="var(--accent-soft)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>`;
  marks.forEach((m,i)=>{g+=`<g class="gm" data-i="${i}" tabindex="0" role="button" style="cursor:pointer" aria-label="Marcador ${m[2]}: ${m[3]}"><line x1="${xs(m[0])}" x2="${xs(m[0])}" y1="${ys(m[1])}" y2="${ys(0)}" stroke="var(--ochre)" stroke-dasharray="4 4"/><circle cx="${xs(m[0])}" cy="${ys(m[1])}" r="13" fill="var(--ochre)"/><text x="${xs(m[0])}" y="${ys(m[1])+4}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--surface)" font-family="IBM Plex Mono, monospace">${m[2]}</text></g>`});
  g+=`</svg>`;
  $("#graph").innerHTML=g;
  document.querySelectorAll(".gm").forEach(el=>{const f=()=>{const m=marks[+el.dataset.i];$("#gdetail").innerHTML=`<b>${m[2]}. ${esc(m[3])}.</b> ${esc(m[4])}`};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
}

      d.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.k===c[3])x.classList.add("right")});if(!ok)b.classList.add("wrong");
      const fb=$(".fb",d);fb.hidden=false;fb.className="fb "+(ok?"ok":"no");
      fb.innerHTML=`<b>Sugerencia: ${WV_CATS.find(w=>w[0]===c[3])[1]}.</b> ${esc(c[4])} Si elegiste otra, ¿puedes justificarla?`;
    });
    box.appendChild(d);
  });
}

function renderReview(data){
  const p=$("#p-repaso");const CARDS=data.cards,QUIZ=data.quiz,LONG=data.long,K="long"+data.code+"-";
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Tarjetas de términos clave</h3><span><button class="reset" id="shuf">Barajar</button></span></div>
   <p class="prose" style="margin:6px 0 12px">Toca una tarjeta para ver la definición. Intenta decirla en voz alta antes de girarla.</p><div class="fcwrap" id="fc"></div></div>
  <div class="card"><div class="rowhead"><h3>Términos de instrucción del IB</h3></div>
   <p class="prose" style="margin:6px 0 12px">El verbo de la pregunta te dice qué tipo de respuesta esperan.</p>
   <div class="cmd">${COMMANDS.map(c=>`<div><b>${c[0]}</b>${esc(c[1])}</div>`).join("")}</div></div>
  <div class="scorebox"><div><span class="eyebrow">Cuestionario tipo examen</span><div><b id="qscore">0/${QUIZ.length}</b> <span id="qinfo" style="color:var(--muted)">respondidas: 0</span></div></div><button class="reset" id="qreset">Reiniciar cuestionario</button></div>
  <div class="qz" id="qz"></div>
  <div class="card long"><div class="rowhead"><h3>Preguntas de respuesta larga</h3></div>
   <p class="prose" style="margin:0">Escribe tu respuesta y luego compárala con los puntos que el examinador buscaría. Lo que escribas se queda solo en tu navegador.</p>
   <div id="longs" style="display:grid;gap:18px"></div></div>`;
  let order=CARDS.map((_,i)=>i);
  const drawFc=()=>{$("#fc").innerHTML=order.map(i=>{const c=CARDS[i];return `<button class="fc" aria-label="Tarjeta: ${esc(c[0])}"><div class="in"><div class="face front"><b>${esc(c[0])}</b><span class="en">${esc(c[1])}</span></div><div class="face back">${esc(c[2])}</div></div></button>`}).join("");
    document.querySelectorAll(".fc").forEach(b=>b.onclick=()=>b.classList.toggle("flip"))};
  drawFc();$("#shuf").onclick=()=>{order.sort(()=>Math.random()-.5);drawFc()};
  drawQuiz(QUIZ);$("#qreset").onclick=()=>drawQuiz(QUIZ);
  $("#longs").innerHTML=LONG.map((l,i)=>`<div class="long"><div><span class="marks">${l.m} puntos</span><p style="margin:4px 0 0;font-weight:600">${esc(l.q)}</p></div>
   <textarea id="long-${data.code.replace(".","-")}-${i}" placeholder="Escribe tu respuesta aquí">${esc(store[K+i]||(data.code==="1.1"?store["long"+i]:"")||"")}</textarea>
   <button class="btn" data-i="${i}">Ver qué buscaría el examinador</button>
   <div class="rubric" hidden><b style="font-family:var(--f-display)">Tu respuesta debería incluir:</b><ul>${l.pts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>`).join("");
  document.querySelectorAll("#longs textarea").forEach((t,i)=>t.oninput=()=>{store[K+i]=t.value;save()});
  document.querySelectorAll("#longs .btn").forEach(b=>b.onclick=()=>{const r=b.nextElementSibling;r.hidden=!r.hidden;b.textContent=r.hidden?"Ver qué buscaría el examinador":"Ocultar puntos"});
}

function drawQuiz(QUIZ){
  let right=0,ans=0;
  const upd=()=>{$("#qscore").textContent=`${right}/${QUIZ.length}`;$("#qinfo").textContent=`respondidas: ${ans}`+(ans===QUIZ.length?(right>=8?" · ¡Excelente dominio!":right>=6?" · Bien, repasa las que fallaste.":" · Vuelve a la pestaña Aprende y reintenta."):"")};
  $("#qz").innerHTML="";
  QUIZ.forEach((q,i)=>{
    const d=document.createElement("div");d.className="qq";
    d.innerHTML=`<span class="qn">Pregunta ${i+1}</span><p class="stem">${esc(q.s)}</p><div class="qopts">${q.o.map((o,j)=>`<button class="qo" data-j="${j}">${String.fromCharCode(65+j)}. ${esc(o)}</button>`).join("")}</div><div class="fb" hidden></div>`;
    d.querySelectorAll(".qo").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j,ok=j===q.a;ans++;if(ok)right++;
      d.querySelectorAll(".qo").forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add("right")});if(!ok)b.classList.add("wrong");
      const fb=$(".fb",d);fb.hidden=false;fb.className="fb "+(ok?"ok":"no");fb.innerHTML=`<b>${ok?"Correcto.":"Respuesta correcta: "+String.fromCharCode(65+q.a)+"."}</b> ${esc(q.e)}`;upd();
    });
    $("#qz").appendChild(d);
  });
  upd();
}

/* init */
const h=(location.hash||"").replace("#s","").replace("-",".");
render(allSubs().some(s=>s.code===h)?h:"1.1");
</script>
