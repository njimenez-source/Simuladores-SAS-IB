const IUCN=[
 ["LC","Preocupación menor","var(--ok)","Especie abundante y con amplia distribución.","Piquero de patas azules"],
 ["NT","Casi amenazada","#7da33a","Cerca de cumplir los criterios de amenaza.","Jaguar"],
 ["VU","Vulnerable","var(--antropo)","Riesgo alto de extinción en estado silvestre.","Oso de anteojos, cóndor andino"],
 ["EN","En peligro","#c46a1b","Riesgo muy alto de extinción en estado silvestre.","Pingüino de Galápagos"],
 ["CR","En peligro crítico","var(--bad)","Riesgo extremadamente alto de extinción en estado silvestre.","Pinzón de manglar"],
 ["EW","Extinta en estado silvestre","#6b2a52","Solo sobrevive en cautiverio o cultivo.","El órix de cimitarra (África) estuvo en esta categoría hasta que su reintroducción en Chad permitió reclasificarlo en 2023"],
 ["EX","Extinta","var(--ink)","No queda ningún individuo vivo.","Tortuga gigante de Pinta"]
];

function practice32(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Categorías de la Lista Roja</h3><span class="eyebrow">3.2.4</span></div>
   <p class="prose" style="margin:6px 0 10px">Toca cada categoría para ver qué significa y un ejemplo relacionado con el Ecuador. El estado de cada especie puede cambiar; verifica en <a href="https://www.iucnredlist.org/" target="_blank" rel="noopener">iucnredlist.org</a>.</p>
   <div id="iucn" style="display:flex;flex-wrap:wrap;gap:6px"></div><div class="detail" id="iucnd" style="margin-top:10px">Toca una categoría.</div></div>
  <div class="card"><div class="rowhead"><h3>¿Qué tan propensa a la extinción es esta especie?</h3><span class="eyebrow">3.2.4</span></div>
   <p class="prose" style="margin:6px 0 10px">Marca los rasgos que tiene una especie y observa su nivel de vulnerabilidad. Herramienta <b>didáctica</b>: la UICN usa criterios cuantitativos más precisos.</p>
   <div id="traits" style="display:grid;gap:6px"></div>
   <div class="scorebox" style="margin-top:12px"><div><span class="eyebrow">Vulnerabilidad estimada</span><div><b id="trv">Baja</b></div></div><div class="progressbar" style="flex:1;min-width:160px;max-width:320px"><i id="trb"></i></div></div></div>
  <div class="card"><div class="rowhead"><h3>Juego: la tragedia de los comunes</h3><span class="eyebrow">3.2.7</span></div>
   <p class="prose" style="margin:6px 0 10px">Eres uno de cuatro pescadores que comparten un banco de peces. Cada temporada decides cuánto pescar. Los otros tres pescan según su propio interés, pero se moderan si tú das el ejemplo. Los peces que quedan se reproducen. ¿Puedes mantener la pesquería durante 10 temporadas?</p>
   <div class="ctl"><label for="catch">Tu captura esta temporada: <b id="catchv">10</b> toneladas</label><input type="range" id="catch" min="0" max="40" step="1" value="10"></div>
   <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"><button class="btn" id="fish">Pescar</button><button class="btn ghost" id="fishr">Reiniciar</button></div>
   <div class="graph" id="fishg" style="margin-top:10px"></div><div class="detail" id="fishd" style="margin-top:10px"></div></div>
  <div class="card" id="dibox"></div>`;
  // IUCN
  $("#iucn").innerHTML=IUCN.map((c,i)=>`<button class="opt" data-i="${i}" style="border-color:${c[2]};border-width:2px"><b class="mono">${c[0]}</b> ${c[1]}</button>`).join("");
  p.querySelectorAll("#iucn .opt").forEach(b=>b.onclick=()=>{const c=IUCN[+b.dataset.i];$("#iucnd").innerHTML=`<b style="color:${c[2]}">${c[0]} · ${c[1]}.</b> ${c[3]}<br><b>Ejemplo:</b> ${c[4]}.${["VU","EN","CR"].includes(c[0])?" <span class='mono' style='font-size:.8rem;color:var(--bad)'>Categoría amenazada</span>":""}`});
  // traits
  const TR=[["Vive solo en una isla o área muy pequeña",2],["Población pequeña o en descenso",2],["Reproducción lenta, pocas crías",1.5],["Gran tamaño corporal",1],["Necesita territorios grandes",1],["Dieta o hábitat muy especializado",1.5],["Poca capacidad de dispersión",1],["Es cazada o tiene valor comercial",1.5],["Afectada por especies invasoras",1.5]];
  $("#traits").innerHTML=TR.map((t,i)=>`<label class="check" style="color:var(--ink)"><input type="checkbox" id="tr-${i}" data-w="${t[1]}"> ${t[0]}</label>`).join("");
  const tr=()=>{let s=0;p.querySelectorAll("#traits input").forEach(c=>{if(c.checked)s+=+c.dataset.w});const pct=Math.min(100,s/13*100);
    $("#trb").style.width=pct+"%";$("#trb").style.background=pct<30?"var(--ok)":pct<60?"var(--antropo)":"var(--bad)";
    $("#trv").textContent=pct<15?"Baja":pct<30?"Moderada":pct<60?"Alta":"Muy alta";};
  p.querySelectorAll("#traits input").forEach(c=>c.onchange=tr);tr();
  // fishing game
  let stock,season,hist,mine;
  const K=200,r=0.5;
  const reset=()=>{stock=150;season=0;hist=[{s:stock,me:0,oth:0}];mine=0;drawF();$("#fishd").innerHTML="Hay <b>150 toneladas</b> de peces. La población crece mejor cuando está alrededor de la mitad de su capacidad (100 t). Una captura total sostenible ronda las 25 toneladas por temporada.";$("#fish").disabled=false};
  const drawF=()=>{const W=600,H=230,L=50,R=16,T=16,B=36;const xs=i=>L+i/10*(W-L-R),ys=v=>T+(1-v/K)*(H-T-B);
    let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Población de peces por temporada">`;
    [0,50,100,150,200].forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`);
    for(let i=0;i<=10;i+=2)g+=`<text x="${xs(i)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${i}</text>`;
    g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">Temporada</text><text x="12" y="${(T+H-B)/2}" transform="rotate(-90 12 ${(T+H-B)/2})" text-anchor="middle" font-size="11" fill="var(--muted)">Peces (t)</text>`;
    g+=`<line x1="${L}" x2="${W-R}" y1="${ys(100)}" y2="${ys(100)}" stroke="var(--ochre)" stroke-dasharray="5 4"/>`;
    g+=`<path d="${hist.map((h,i)=>(i?"L":"M")+xs(i)+","+ys(h.s)).join(" ")}" fill="none" stroke="var(--tecno)" stroke-width="3"/>`;
    hist.forEach((h,i)=>g+=`<circle cx="${xs(i)}" cy="${ys(h.s)}" r="4" fill="${h.s<20?"var(--bad)":"var(--tecno)"}"/>`);
    g+=`</svg>`;$("#fishg").innerHTML=g};
  $("#catch").oninput=()=>$("#catchv").textContent=$("#catch").value;
  $("#fish").onclick=()=>{if(season>=10||stock<=0)return;const me=Math.min(+$("#catch").value,stock);
    // others: greedy-ish, take 10-14 each, increasing when they see others take more
    // the others cooperate only when you set a moderate example
    let oth=0;for(let k=0;k<3;k++)oth+=me<=7?5+Math.round(Math.random()*3):8+Math.round(Math.random()*6)+(me>12?2:0);
    oth=Math.min(oth,stock-me);const total=me+oth;stock=Math.max(0,stock-total);mine+=me;
    stock=Math.min(K,stock+r*stock*(1-stock/K));season++;hist.push({s:stock,me,oth});drawF();
    let msg=`<b>Temporada ${season}:</b> pescaste ${me} t, los otros ${oth} t (total ${total} t). Quedan <b>${Math.round(stock)} t</b> tras la reproducción. Tu captura acumulada: ${mine} t.`;
    if(stock<5){msg+=`<br><b>La pesquería colapsó.</b> Nadie puede pescar más. Así ocurrió con el bacalao de Terranova. ¿Qué regla habría evitado el colapso?`;$("#fish").disabled=true}
    else if(season===10){msg+=`<br><b>Fin del juego.</b> ${stock>80?"La pesquería sigue sana: la cooperación y la moderación permitieron pescar todas las temporadas.":"El banco sobrevive, pero muy debilitado."} Prueba otra estrategia y compara tu captura total.`;$("#fish").disabled=true}
    else if(total>30)msg+=`<br>La captura total supera lo que el banco puede reponer. Aunque tú pesques poco, los demás siguen sacando de más: ese es el dilema.`;
    $("#fishd").innerHTML=msg;};
  $("#fishr").onclick=reset;reset();
  classifier($("#dibox"),"¿Amenaza directa o indirecta?","3.2.1 · Clasifica cada amenaza.",DI_ITEMS,DI_CATS);
}
S32.practice=practice32;

/* ================= SUBTEMA 3.3 ================= */
const S33={
 code:"3.3",title:"Conservación y regeneración",hours:"4 horas de clase",src:"https://www.mrgscience.com/ess-subtopic-33-conservation-oand-regeneration.html",
 intro:"¿Por qué conservar la biodiversidad y cuál es la mejor forma de hacerlo? Este subtema compara la conservación dentro y fuera del hábitat natural, explica cómo diseñar una reserva, qué papel tienen los acuerdos internacionales y cómo el resilvestrar y la regeneración pueden recuperar ecosistemas. También muestra que la estrategia que se elige depende de los valores y la cosmovisión de quien decide.",
 guiding:["¿Cómo se pueden comparar las estrategias de conservación y regeneración?","¿Cómo influyen los valores y las cosmovisiones en lo que decidimos proteger?"],
 und:[
  {c:"3.3.1",t:"Argumentos para conservar la biodiversidad",
   s:"Existen argumentos estéticos, ecológicos, económicos, éticos y sociales para conservar la biodiversidad.",
   html:`<div class="defgrid">
   <div class="def"><h4>Ecológicos</h4><p>Servicios ecosistémicos: polinización, formación de suelo, purificación del agua, captura de carbono, regulación del clima.</p></div>
   <div class="def"><h4>Económicos</h4><p>Alimentos, madera, medicinas (muchos fármacos vienen de plantas), ecoturismo (Galápagos), recursos genéticos para la agricultura.</p></div>
   <div class="def"><h4>Éticos</h4><p>Las especies tienen valor intrínseco y derecho a existir; los humanos tenemos el deber de cuidarlas.</p></div>
   <div class="def"><h4>Estéticos</h4><p>La belleza de la naturaleza inspira arte, bienestar y recreación.</p></div>
   <div class="def"><h4>Sociales y culturales</h4><p>Los pueblos indígenas dependen de la biodiversidad para su sustento, su identidad y sus prácticas espirituales.</p></div></div>`,
   tip:"Relaciona con los valores de 1.1.3: los argumentos económicos son valores instrumentales; los éticos, intrínsecos; los culturales, relacionales."},
  {c:"3.3.2",t:"Conservación in situ y ex situ",
   s:"La conservación puede ser in situ, dentro del hábitat natural, o ex situ, fuera de él.",
   html:`<div class="defgrid">
   <div class="def"><h4>In situ</h4><p>Proteger a las especies en su hábitat: parques nacionales, reservas, santuarios. Ej.: Parque Nacional Yasuní.<br><b>Ventaja:</b> protege todo el ecosistema y las interacciones. <b>Limitación:</b> difícil de vigilar; conflictos con la población local.</p></div>
   <div class="def"><h4>Ex situ</h4><p>Proteger fuera del hábitat: zoológicos, jardines botánicos, bancos de semillas, centros de cría. Ej.: centros de cría de tortugas en Galápagos, Bóveda Global de Semillas de Svalbard.<br><b>Ventaja:</b> salva especies al borde de la extinción. <b>Limitación:</b> costosa, poca diversidad genética, los animales pueden perder comportamientos naturales.</p></div></div>
   <p style="margin-top:12px"><b>CITES</b> (Convención sobre el Comercio Internacional de Especies Amenazadas) regula el comercio de especies:</p>
   <ul><li><b>Apéndice I:</b> prohibido el comercio internacional (especies en mayor peligro).</li>
   <li><b>Apéndice II:</b> comercio regulado con permisos.</li>
   <li><b>Apéndice III:</b> especies que un país pide proteger y para las que necesita cooperación internacional.</li></ul>`,
   tip:"Pregunta típica: «Compara la conservación in situ y ex situ». Organiza la respuesta en ventajas y limitaciones de cada una, con un ejemplo."},
  {c:"3.3.3",t:"Enfoques mixtos y especies especiales",
   s:"Los enfoques mixtos combinan la conservación in situ y ex situ, y suelen centrarse en especies bandera, clave o paraguas.",
   html:`<ul><li>Ej.: cría en cautiverio seguida de reintroducción. El órix árabe se extinguió en estado silvestre y, tras décadas de cría en zoológicos, se reintrodujo en Omán y Arabia Saudita.</li></ul>
   <div class="defgrid">
   <div class="def"><h4>Especie bandera</h4><p>Carismática, atrae atención y dinero. Ej.: tortuga gigante, oso de anteojos.</p></div>
   <div class="def"><h4>Especie clave</h4><p>Tiene un efecto desproporcionado en el ecosistema. Ej.: nutria marina, castor, elefante.</p></div>
   <div class="def"><h4>Especie paraguas</h4><p>Necesita un territorio grande; al protegerla se protege a muchas otras. Ej.: jaguar, cóndor andino.</p></div></div>
   <p style="margin-top:12px">Limitación de centrarse en especies bandera: otras especies menos llamativas, pero igual de importantes, reciben menos recursos.</p>`,
   tip:"Una especie puede ser bandera y paraguas a la vez (el panda gigante, el jaguar). Explica por qué en cada caso."},
  {c:"3.3.4",t:"El Convenio sobre la Diversidad Biológica",
   s:"El Convenio sobre la Diversidad Biológica (CDB) es un tratado internacional para conservar la biodiversidad, usarla de forma sostenible y repartir de forma justa los beneficios de los recursos genéticos.",
   html:`<ul><li>Se firmó en la Cumbre de la Tierra de Río de Janeiro (1992). Casi todos los países del mundo son parte.</li>
   <li>Cada país prepara una <b>Estrategia y Plan de Acción Nacional de Biodiversidad</b>.</li>
   <li>Metas de Aichi (2010-2020): avances limitados. Las reemplazó el <b>Marco Mundial Kunming-Montreal</b> (2022), con la meta de proteger el 30 % del planeta para 2030.</li>
   <li><b>Protocolo de Nagoya:</b> reparto justo de los beneficios de los recursos genéticos (por ejemplo, si una empresa crea un medicamento con una planta usada por un pueblo indígena). <b>Protocolo de Cartagena:</b> manejo seguro de organismos genéticamente modificados.</li>
   <li>Retos: no es fácil hacerlo cumplir, falta financiamiento y el avance es lento.</li></ul>`,
   tip:"Recuerda los tres objetivos del CDB: conservación, uso sostenible y reparto justo de beneficios."},
  {c:"3.3.5",t:"Conservación de hábitats",
   s:"Las estrategias de conservación basadas en hábitats protegen ecosistemas completos.",
   html:`<ul><li><b>Áreas protegidas</b> terrestres y marinas. Ecuador tiene un Sistema Nacional de Áreas Protegidas y grandes reservas marinas en Galápagos.</li>
   <li><b>Restauración de hábitats:</b> reforestar manglares, recuperar humedales.</li>
   <li><b>Corredores biológicos:</b> conectan áreas protegidas (Yellowstone a Yukón; el Corredor Marino del Pacífico Este Tropical, que une Galápagos con Isla del Coco en Costa Rica).</li>
   <li><b>Ecosantuarios:</b> zonas cercadas libres de depredadores invasores (Zealandia, Nueva Zelanda).</li>
   <li><b>Manejo sostenible del suelo:</b> agroforestería, pesca sostenible, zonas de amortiguamiento.</li></ul>`,
   tip:"La ventaja principal de conservar hábitats frente a especies sueltas: protege a la vez a todas las especies, sus interacciones y los servicios del ecosistema."},
  {c:"3.3.6",t:"Diseño de reservas",
   s:"El tamaño, la forma, la conectividad y la gestión de las reservas influyen en su eficacia.",
   html:`<ul><li><b>Tamaño:</b> las reservas grandes sostienen poblaciones mayores y especies que necesitan territorios amplios.</li>
   <li><b>Debate SLOSS</b> (una sola grande o varias pequeñas): una grande protege mejor a los grandes mamíferos; varias pequeñas reducen el riesgo de que un solo desastre (incendio, enfermedad) lo destruya todo y pueden cubrir más hábitats distintos.</li>
   <li><b>Efecto de borde:</b> en los bordes cambian la luz, la temperatura y la humedad, y entran especies invasoras y personas. Una reserva redonda tiene menos borde que una alargada del mismo tamaño.</li>
   <li><b>Corredores:</b> permiten el flujo genético y la migración, pero también pueden facilitar la propagación de enfermedades y la caza furtiva.</li>
   <li><b>Reserva de biosfera de la UNESCO:</b> zona núcleo (protección estricta), zona de amortiguamiento (investigación, educación, uso controlado) y zona de transición (desarrollo sostenible con las comunidades).</li>
   <li>Involucrar a la comunidad local es clave: excluirla suele hacer fracasar la reserva.</li></ul>
   <p>Diseña tu propia reserva en la pestaña <b>Practica</b>.</p>`,
   tip:"Si te dan dibujos de reservas para comparar, evalúa: tamaño, forma (borde), fragmentación, corredores y zonas de amortiguamiento."},
  {c:"3.3.7",t:"Resilvestrar",
   s:"Resilvestrar es restaurar ecosistemas naturales con la mínima intervención humana.",
   html:`<ul><li><b>Reintroducir depredadores tope y especies clave:</b> los lobos en Yellowstone redujeron a los alces y la vegetación se recuperó.</li>
   <li><b>Conectar hábitats</b> con corredores.</li>
   <li><b>Abandonar la agricultura o la explotación</b> y dejar que la naturaleza se recupere sola, a veces con grandes herbívoros que moldean el paisaje (Oostvaardersplassen en Países Bajos, finca Knepp en Inglaterra).</li>
   <li>En Galápagos, liberar tortugas gigantes en islas donde se extinguieron (como Pinta) busca recuperar su papel ecológico.</li></ul>`,
   tip:"Resilvestrar no es solo plantar árboles: se trata de restaurar procesos naturales (depredación, pastoreo, dispersión) y luego intervenir lo menos posible."},
  {c:"3.3.8",t:"Conservación y regeneración a distintas escalas",
   s:"La conservación y la regeneración se pueden aplicar a escala individual, colectiva, nacional e internacional.",
   html:`<div class="defgrid">
   <div class="def"><h4>Individual</h4><p>Plantar especies nativas, reducir plásticos, hacer voluntariado, ciencia ciudadana.</p></div>
   <div class="def"><h4>Colectiva</h4><p>Movimiento Cinturón Verde (Kenia), mingas de reforestación, comunidades custodias del manglar.</p></div>
   <div class="def"><h4>Nacional</h4><p>Leyes contra la deforestación, áreas protegidas, programa Socio Bosque en Ecuador.</p></div>
   <div class="def"><h4>Internacional</h4><p>CDB, CITES, Acuerdo de París.</p></div></div>
   <p style="margin-top:12px"><b>Conservar</b> = proteger lo que existe. <b>Regenerar</b> = recuperar activamente lo que se dañó (restaurar humedales, reforestar la meseta de Loess en China).</p>`,
   tip:"En preguntas de escala, da un ejemplo concreto para cada nivel. Los ejemplos locales muestran comprensión real."},
  {c:"3.3.9",t:"Valores, perspectivas y éxito",
   s:"Las estrategias de conservación y regeneración reflejan distintos valores y perspectivas, y su éxito depende de varios factores.",
   html:`<ul><li><b>Enfoque ecocéntrico:</b> valor intrínseco, mínima intervención; prefiere conservación in situ y resilvestrar.</li>
   <li><b>Enfoque antropocéntrico o tecnocéntrico:</b> valor para las personas; usa bancos de genes, zoológicos, ecoturismo y manejo activo.</li>
   <li><b>Factores de éxito:</b> apoyo de la comunidad, financiamiento estable, educación, leyes que se cumplan e investigación.</li>
   <li><b>Justicia ambiental:</b> los beneficios y costos de la conservación deben repartirse de forma justa e incluir a las comunidades locales e indígenas.</li></ul>`,
   tip:"Conecta con 1.1.8: al evaluar una estrategia, identifica qué cosmovisión refleja y qué valores prioriza."}
 ],
 casesIntro:"Estos casos muestran distintas estrategias de conservación y regeneración. Para cada uno identifica si es in situ, ex situ o mixta, y qué factores explican su éxito o sus dificultades.",
 cases:[
  {t:"Reserva de Biosfera del Chocó Andino de Pichincha",u:"3.3.6 · 3.3.9",vid:null,local:true,
   bg:"Al noroccidente de Quito, el Chocó Andino une bosques nublados de los Andes con los bosques húmedos del Chocó. En 2018 la UNESCO lo declaró reserva de biosfera. Tiene zonas núcleo con áreas protegidas, zonas de amortiguamiento y zonas de transición donde viven comunidades que se dedican al turismo, la agricultura y la producción de panela y café. En 2023, en una consulta popular, los habitantes de Quito votaron por prohibir la minería metálica en esta zona.",
   st:[["Zona núcleo","","Bosques protegidos con osos de anteojos, aves endémicas y orquídeas."],["Zona de transición","","Comunidades con turismo, agricultura sostenible y emprendimientos locales."],["Conflicto","","Concesiones mineras frente a conservación y turismo; la consulta de 2023 reflejó la decisión ciudadana."]],
   q:["Describe las tres zonas de una reserva de biosfera con este ejemplo.","¿Por qué es importante incluir a las comunidades en la gestión?","¿Qué perspectivas (1.1) chocaron en la consulta sobre minería?"]},
  {t:"Programa Socio Bosque",u:"3.3.8 · 3.3.9",vid:null,local:true,
   bg:"Desde 2008, el Estado ecuatoriano paga incentivos económicos anuales a propietarios privados y comunidades, incluidas comunidades indígenas, que se comprometen a conservar sus bosques nativos y páramos. A cambio, deben evitar la tala, las quemas y el cambio de uso del suelo. El programa ha incorporado más de un millón de hectáreas. Sus críticas incluyen la dependencia del presupuesto del Estado, que ha sufrido recortes, y el monto de los pagos, a veces menor que los ingresos de otras actividades.",
   st:[["Fortaleza","","Reconoce económicamente el valor de conservar y beneficia a comunidades rurales."],["Estrategia","","In situ, basada en incentivos (pago por servicios ambientales)."],["Limitación","","Depende de financiamiento estable y de la vigilancia del cumplimiento."]],

function practice33(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Diseña una reserva</h3><span class="eyebrow">3.3.6</span></div>
   <p class="prose" style="margin:6px 0 10px">Elige las características de tu reserva. La franja exterior representa el <b>borde</b>, donde las condiciones cambian. Observa la puntuación y el porcentaje de hábitat de interior. Herramienta <b>didáctica</b>.</p>

   </div>

  <div class="card"><div class="rowhead"><h3>Zonas de una reserva de biosfera</h3><span class="eyebrow">3.3.6</span></div>
   <p class="prose" style="margin:6px 0 10px">Toca cada zona. Ecuador tiene varias reservas de biosfera de la UNESCO, como Galápagos, Yasuní, Sumaco, Macizo del Cajas, Bosque Seco y Chocó Andino.</p>
   <div class="graph" id="bios"></div><div class="detail" id="biosd" style="margin-top:10px">Toca una zona.</div></div>
  <div class="card" id="isbox"></div>
  <div class="card" id="arbox"></div>`;
  const st={shape:"circ",corr:0,buf:0,com:0};
  const bind=(id,k)=>p.querySelectorAll("#"+id+" .opt").forEach(b=>b.onclick=()=>{st[k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;p.querySelectorAll("#"+id+" .opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));res()});
  bind("rshape","shape");bind("rcorr","corr");bind("rbuf","buf");bind("rcom","com");
  const res=()=>{const W=600,H=260,e=14;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diseño de la reserva">`;
    g+=`<rect x="0" y="0" width="${W}" height="${H}" rx="8" fill="var(--ochre-soft)"/>`;
    let interior;
    const shapeC=(cx,cy,r)=>{let s="";if(st.buf)s+=`<circle cx="${cx}" cy="${cy}" r="${r+18}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="5 4"/>`;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--antropo)" fill-opacity=".45"/><circle cx="${cx}" cy="${cy}" r="${Math.max(0,r-e)}" fill="var(--eco)"/>`;return s};
    if(st.shape==="circ"){g+=shapeC(300,130,95);interior=Math.pow((95-e)/95,2)}
    else if(st.shape==="long"){const w=440,h=68,x=80,y=96;if(st.buf)g+=`<rect x="${x-18}" y="${y-18}" width="${w+36}" height="${h+36}" rx="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-dasharray="5 4"/>`;g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="var(--antropo)" fill-opacity=".45"/><rect x="${x+e}" y="${y+e}" width="${w-2*e}" height="${h-2*e}" rx="6" fill="var(--eco)"/>`;interior=((w-2*e)*(h-2*e))/(w*h)}
    else{const pts=[[150,75],[450,75],[150,190],[450,190]],r=47;if(st.corr)g+=`<path d="M150,75 L450,75 L450,190 L150,190 Z" fill="none" stroke="var(--eco)" stroke-width="16" stroke-opacity=".55"/>`;pts.forEach(q=>g+=shapeC(q[0],q[1],r));interior=Math.pow((r-e)/r,2)}
    if(st.corr&&st.shape!=="frag")g+=`<path d="M${st.shape==="circ"?395:520},130 L590,130" stroke="var(--eco)" stroke-width="16" stroke-opacity=".55"/><text x="585" y="118" text-anchor="end" font-size="11" fill="var(--ink)">corredor a otra reserva</text>`;
    if(st.com)g+=`<text x="12" y="${H-12}" font-size="12" fill="var(--ink)" font-weight="700">Comunidad participa en la gestión</text>`;
    g+=`<g font-size="11" fill="var(--ink)"><rect x="12" y="12" width="12" height="12" fill="var(--eco)"/><text x="30" y="22">Interior</text><rect x="90" y="12" width="12" height="12" fill="var(--antropo)" fill-opacity=".45"/><text x="108" y="22">Borde</text>${st.buf?`<rect x="160" y="12" width="12" height="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="178" y="22">Amortiguamiento</text>`:""}</g></svg>`;
    $("#resg").innerHTML=g;
    let score=0;const notes=[];
    if(st.shape==="circ"){score+=3;notes.push("La forma circular minimiza el borde.")}else if(st.shape==="long"){score+=1;notes.push("La forma alargada tiene mucho borde: más invasoras, luz y perturbaciones.")}else{score+=1;notes.push("Las reservas pequeñas tienen mucho borde, pero un solo desastre no las destruye todas (SLOSS).")}
    if(st.corr){score+=2;notes.push("Los corredores permiten flujo genético y migración, aunque pueden facilitar enfermedades o caza.")}
    if(st.buf){score+=2;notes.push("La zona de amortiguamiento protege el interior de actividades humanas intensas.")}
    if(st.com){score+=3;notes.push("Con la comunidad participando, la vigilancia y el apoyo local aumentan.")}else notes.push("Excluir a la comunidad suele generar conflictos e incumplimiento.");
    $("#resd").innerHTML=`<b>Hábitat de interior: ${Math.round(interior*100)} %</b> · <b>Puntuación: ${score}/10</b><br>${notes.join(" ")}`};
  res();
  // biosphere
  const Z=[["Zona núcleo","Protección estricta. Solo investigación y monitoreo que no perturben. Ej.: las áreas protegidas dentro del Chocó Andino."],["Zona de amortiguamiento","Rodea al núcleo. Actividades compatibles: educación ambiental, investigación, ecoturismo de bajo impacto."],["Zona de transición","Donde viven las comunidades. Desarrollo sostenible: agricultura, turismo, emprendimientos. Aquí se busca equilibrar conservación y bienestar humano."]];
  (()=>{const W=600,H=260;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zonas de una reserva de biosfera">`;

    g+=`<g class="bz" data-i="1" tabindex="0" role="button" style="cursor:pointer" aria-label="Zona de amortiguamiento"><ellipse cx="300" cy="138" rx="190" ry="82" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="300" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">Amortiguamiento</text></g>`;
    g+=`<g class="bz" data-i="0" tabindex="0" role="button" style="cursor:pointer" aria-label="Zona núcleo"><ellipse cx="300" cy="148" rx="95" ry="42" fill="var(--eco)" stroke="var(--eco)"/><text x="300" y="153" text-anchor="middle" font-size="14" font-weight="700" fill="var(--surface)">Núcleo</text></g></svg>`;
    $("#bios").innerHTML=g;document.querySelectorAll(".bz").forEach(el=>{const f=e=>{if(e)e.stopPropagation();const z=Z[+el.dataset.i];$("#biosd").innerHTML=`<b>${z[0]}.</b> ${z[1]}`};el.onclick=f;el.onkeydown=k=>{if(k.key==="Enter"||k.key===" "){k.preventDefault();f()}}});})();
  classifier($("#isbox"),"¿In situ o ex situ?","3.3.2 · ¿Dentro o fuera del hábitat natural?",IS_ITEMS,IS_CATS);
  classifier($("#arbox"),"¿Qué tipo de argumento para conservar?","3.3.1 · Clasifica cada argumento.",AR_ITEMS,AR_CATS);
}

/* ===== helper: line chart in SVG ===== */
function lineChart(opts){
  const {W=600,H=250,L=52,R=16,T=16,B=40,xmin,xmax,ymin=0,ymax,xticks,yticks,xlab,ylab,series,extra=()=>""}=opts;
  const xs=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),ys=y=>T+(1-(y-ymin)/(ymax-ymin))*(H-T-B);
  let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||ylab)}">`;
  yticks.forEach(v=>g+=`<line x1="${L}" x2="${W-R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/><text x="${L-6}" y="${ys(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`);
  xticks.forEach(v=>g+=`<text x="${xs(v)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`);
  g+=`<text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${xlab}</text><text x="12" y="${(T+H-B)/2}" transform="rotate(-90 12 ${(T+H-B)/2})" text-anchor="middle" font-size="11" fill="var(--muted)">${ylab}</text>`;
  series.forEach(s=>{g+=`<path d="${s.pts.map((p,i)=>(i?"L":"M")+xs(p[0]).toFixed(1)+","+ys(p[1]).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="3" ${s.dash?'stroke-dasharray="6 5"':""}/>`});
  g+=extra(xs,ys)+`</svg>`;return g;
}

function orderer(el,title,lead,steps){
  const draw=()=>{const order=steps.map((_,i)=>i).sort(()=>Math.random()-.5);let next=0;
    el.innerHTML=`<div class="rowhead"><h3>${title}</h3><button class="reset">Reiniciar</button></div><p class="prose" style="margin:0">${lead}</p>
    <ol id="ordl" style="margin:10px 0;padding-left:1.4em;display:grid;gap:4px"></ol><div class="opts" id="ordo"></div><div class="fb" hidden></div>`;
    const ol=$("#ordl",el),fb=$(".fb",el);
    order.forEach(i=>{const b=document.createElement("button");b.className="opt";b.textContent=steps[i];b.onclick=()=>{
      if(i===next){const li=document.createElement("li");li.textContent=steps[i];ol.appendChild(li);b.remove();next++;fb.hidden=true;

function practice42(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>¿Cuánta agua usas al día?</h3><span class="eyebrow">4.2.6</span></div>
   <p class="prose" style="margin:6px 0 10px">Estima tu consumo doméstico. Valores <b>aproximados</b> por actividad. Compáralo con el límite de 50 litros que tuvo Ciudad del Cabo en 2018.</p>
   <div id="wu" style="display:grid;gap:10px"></div>
   <div class="scorebox" style="margin-top:12px"><div><span class="eyebrow">Tu consumo estimado</span><div><b id="wut">–</b> <span style="color:var(--muted)">litros por día</span></div></div></div>
   <div class="detail" id="wud" style="margin-top:10px"></div></div>
  <div class="card" id="scbox"></div>
  <div class="card" id="sdbox"></div>`;
  const U=[["Minutos de ducha",10,0,30,1,10,"min"],["Descargas del inodoro",5,0,12,1,8,"veces"],["Minutos con el grifo abierto (dientes, manos, platos)",8,0,30,1,6,"min"],["Cargas de lavadora por semana",3,0,10,1,70/7,"cargas"],["Vasos de agua y cocina",1,1,1,1,8,"fijo"]];
  $("#wu").innerHTML=U.slice(0,4).map((u,i)=>`<div class="ctl"><label for="wu${i}">${u[0]}: <b id="wu${i}v">${u[1]}</b></label><input type="range" id="wu${i}" min="${u[2]}" max="${u[3]}" step="${u[4]}" value="${u[1]}"></div>`).join("")+`<label class="check" style="color:var(--ink)"><input type="checkbox" id="wulow"> Tengo inodoro de bajo consumo y ducha ahorradora</label>`;
  const wu=()=>{const low=$("#wulow").checked;let tot=8,parts=[];U.slice(0,4).forEach((u,i)=>{const v=+$("#wu"+i).value;$("#wu"+i+"v").textContent=v;let rate=u[5];if(low&&(i===0))rate=6;if(low&&i===1)rate=4.5;const l=v*rate;tot+=l;parts.push([u[0],l])});
    $("#wut").textContent=Math.round(tot);const big=parts.sort((a,b)=>b[1]-a[1])[0];
    $("#wud").innerHTML=`${tot>50?`Usas unas <b>${(tot/50).toFixed(1).replace(".",",")} veces</b> el límite de Ciudad del Cabo.`:"Estás dentro del límite de 50 litros de Ciudad del Cabo."} Lo que más consume: <b>${big[0].toLowerCase()}</b> (${Math.round(big[1])} L). ${low?"":"Prueba marcar los aparatos ahorradores para ver la diferencia."}`};
  $("#wu").querySelectorAll("input").forEach(i=>i.oninput=wu);$("#wulow").onchange=wu;wu();
  classifier($("#scbox"),"¿Escasez física o económica?","4.2.5 · ¿Falta el agua o faltan los medios para llevarla?",SC_ITEMS,SC_CATS);
  classifier($("#sdbox"),"¿Aumenta la oferta o reduce la demanda?","4.2.3 · 4.2.4 · 4.2.6 · Clasifica cada estrategia.",SD_ITEMS,SD_CATS);
}

   s:"La sobreexplotación ha llevado al colapso de pesquerías.",
   html:`<ul><li>Sobreexplotar = pescar más rápido de lo que la población puede reproducirse.</li>
   <li><b>Bacalao de Terranova:</b> la tecnología (sonares, buques factoría) y cuotas demasiado altas, que ignoraron advertencias científicas, llevaron al colapso. En 1992 Canadá cerró la pesquería y unas 30 000 personas perdieron su empleo.</li>
   <li>Al desaparecer el bacalao, aumentaron el camarón y el cangrejo que antes comía: la red trófica cambió.</li></ul>`,
   tip:"Al explicar un colapso, incluye causas (tecnológicas, de gestión, ambientales) y consecuencias (ecológicas, económicas, sociales)."},
  {c:"4.3.6",t:"Rendimiento máximo sostenible",
   s:"El rendimiento máximo sostenible (RMS) es la mayor captura anual que se puede mantener en el tiempo, y debe usarse para fijar el tope de las cuotas de pesca.",
   html:`<ul><li>En una gráfica de captura frente a esfuerzo pesquero, la captura sube, llega a un máximo (RMS) y luego baja si se sigue aumentando el esfuerzo.</li>
   <li>Pescar en el RMS deja la población en un tamaño donde se reproduce más rápido (alrededor de la mitad de su capacidad de carga).</li>
   <li>Se recomienda pescar <b>por debajo</b> del RMS porque los datos son inciertos, las poblaciones varían, hay captura incidental y efectos en el ecosistema.</li>
   <li>Retos: falta de datos, pesca ilegal, presión económica y especies migratorias que cruzan fronteras.</li></ul>
   <p>Explora la curva en la pestaña <b>Practica</b>.</p>`,
   tip:"Si te dan una gráfica de captura vs. esfuerzo, identifica el RMS en el punto más alto y explica qué pasa a la derecha (sobrepesca)."},
  {c:"4.3.7",t:"Cambio climático y acidificación",

   html:`<ul><li>El calentamiento cambia la temperatura, las corrientes y la intensidad de las tormentas. Muchas especies se desplazan hacia los polos.</li>
   <li>La acidificación dificulta la formación de conchas y esqueletos (2.3.10).</li>
   <li>El <b>blanqueamiento de corales</b>: con agua demasiado caliente, el coral expulsa las algas simbióticas que le dan alimento.</li>

   tip:"Relaciona con El Niño: cuando el mar se calienta frente a Ecuador y Perú, la pesca de sardina y anchoveta cae."},
  {c:"4.3.8",t:"Políticas y consumidores",
   s:"La explotación insostenible se puede reducir con políticas y con cambios en el comportamiento de los consumidores.",

   <li><b>Consumidores:</b> ecoetiquetas (MSC para pesca, ASC para acuicultura), guías de consumo responsable, no comprar especies en veda o de tamaño menor al permitido.</li></ul>`,
   tip:"Explica por qué funciona una malla más grande: deja escapar a los juveniles, que pueden reproducirse antes de ser capturados."},
  {c:"4.3.9",t:"Áreas marinas protegidas",
   s:"Las áreas marinas protegidas pueden sostener las cadenas tróficas acuáticas y mantener rendimientos sostenibles.",
   html:`<ul><li>Zonas del mar donde la pesca y otras actividades extractivas están restringidas o prohibidas.</li>
   <li><b>Protegen zonas de reproducción y crianza</b>, para que los juveniles lleguen a adultos.</li>
   <li><b>Efecto de desborde:</b> los peces adultos y las larvas salen de la reserva hacia zonas de pesca vecinas.</li>
   <li>Retos: vigilancia, diseño (tamaño, zonas) y participación de las comunidades pesqueras.</li>

  {c:"4.3.10",t:"Acuicultura",

function practice43(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>La curva del rendimiento máximo sostenible</h3><span class="eyebrow">4.3.6</span></div>
   <p class="prose" style="margin:6px 0 10px">Mueve el esfuerzo pesquero (número de barcos, días de pesca) y observa la captura sostenible a largo plazo y el tamaño de la población. Modelo <b>esquemático</b> (modelo logístico de Schaefer).</p>
   <div class="ctl"><label for="eff2">Esfuerzo pesquero: <b id="eff2v">30</b> %</label><input type="range" id="eff2" min="0" max="100" step="5" value="30"></div>
   <div class="graph" id="msy" style="margin-top:10px"></div><div class="detail" id="msyd" style="margin-top:10px"></div></div>
  <div class="card" id="prbox"></div>`;
  const ms=()=>{const e=+$("#eff2").value/100;$("#eff2v").textContent=Math.round(e*100);
    const Y=x=>4*x*(1-x)*100,stock=x=>(1-x)*100;const pts=Array.from({length:21},(_,i)=>[i*5,Y(i/20)]);
    $("#msy").innerHTML=lineChart({xmin:0,xmax:100,ymax:100,xticks:[0,25,50,75,100],yticks:[0,25,50,75,100],xlab:"Esfuerzo pesquero (%)",ylab:"Captura sostenible (% del RMS)",label:"Curva de rendimiento",series:[{pts,color:"var(--accent)"}],
      extra:(xs,ys)=>`<line x1="${xs(50)}" x2="${xs(50)}" y1="${ys(0)}" y2="${ys(100)}" stroke="var(--ochre)" stroke-dasharray="5 4"/><text x="${xs(50)+4}" y="${ys(100)+12}" font-size="11" font-weight="700" fill="var(--ochre)">RMS</text><circle cx="${xs(e*100)}" cy="${ys(Y(e))}" r="8" fill="${e>0.5?"var(--bad)":"var(--ok)"}" stroke="var(--surface)" stroke-width="2"/>`});
    $("#msyd").innerHTML=`Captura sostenible: <b>${Math.round(Y(e))} %</b> del RMS. Población a largo plazo: <b>${Math.round(stock(e))} %</b> de la capacidad de carga.<br>${e===0?"Sin pesca, la población está en su máximo, pero no hay captura.":e<0.5?"Zona segura: aumentar el esfuerzo todavía aumenta la captura.":e===0.5?"Estás en el RMS: la población está a la mitad de su capacidad, donde se reproduce más rápido. Es un punto arriesgado si los datos fallan.":"<b>Sobrepesca:</b> con más barcos se captura <b>menos</b> a largo plazo, porque la población es demasiado pequeña para reproducirse bien. Aquí empiezan los colapsos."}`};
  $("#eff2").oninput=ms;ms();
  classifier($("#prbox"),"¿Práctica sostenible o insostenible?","4.3.4 · 4.3.8 · 4.3.10 · Clasifica cada práctica.",PR_ITEMS,PR_CATS);
}

   <div class="def"><h4>Fuente puntual</h4><p>Un origen identificable: la tubería de una fábrica, la descarga de alcantarillado, un derrame de un barco. Más fácil de controlar.</p></div>

function practice44(p){
  p.innerHTML=`
  <div class="card" id="eubox"></div>
  <div class="card"><div class="rowhead"><h3>Interpreta un análisis de agua</h3><span class="eyebrow">4.4.3 · 4.4.4</span></div>
   <p class="prose" style="margin:6px 0 10px">Mueve los valores medidos en un punto de un río y observa la interpretación. Rangos <b>aproximados</b> con fines didácticos.</p>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">
    <div class="ctl"><label for="q_do">Oxígeno disuelto: <b id="q_dov">8</b> mg/L</label><input type="range" id="q_do" min="0" max="12" step="0.5" value="8"></div>
    <div class="ctl"><label for="q_bod">DBO: <b id="q_bodv">2</b> mg/L</label><input type="range" id="q_bod" min="0" max="30" step="1" value="2"></div>
    <div class="ctl"><label for="q_no3">Nitratos: <b id="q_no3v">2</b> mg/L</label><input type="range" id="q_no3" min="0" max="50" step="1" value="2"></div>
    <div class="ctl"><label for="q_sec">Profundidad del disco de Secchi: <b id="q_secv">2</b> m</label><input type="range" id="q_sec" min="0.1" max="5" step="0.1" value="2"></div></div>
   <div class="detail" id="qd2" style="margin-top:12px"></div></div>
  <div class="card" id="pnbox"></div>
  <div class="card" id="mlbox"></div>`;
  orderer($("#eubox"),"Ordena la secuencia de la eutrofización","4.4.6 · Toca los pasos en el orden correcto.",["Entran nitratos y fosfatos al agua","Floración de algas (fitoplancton)","Las algas bloquean la luz y mueren las plantas del fondo","Las algas mueren","Las bacterias descomponen la materia muerta y aumenta la DBO","Baja el oxígeno disuelto","Mueren peces e invertebrados","Se forma una zona muerta"]);
  const qa=()=>{const v={};["q_do","q_bod","q_no3","q_sec"].forEach(id=>{v[id]=+$("#"+id).value;$("#"+id+"v").textContent=String(v[id]).replace(".",",")});
    const m=[];m.push(v.q_do>=6?"<b style='color:var(--ok)'>Oxígeno bueno:</b> la mayoría de peces sobreviven.":v.q_do>=2?"<b style='color:var(--antropo)'>Oxígeno bajo:</b> estrés para peces sensibles.":"<b style='color:var(--bad)'>Hipoxia:</b> por debajo de unos 2 mg/L la mayoría de los animales no sobreviven.");
    m.push(v.q_bod<=3?"DBO baja: poca materia orgánica.":v.q_bod<=8?"DBO moderada: algo de contaminación orgánica.":"<b style='color:var(--bad)'>DBO alta:</b> mucha materia orgánica, probablemente aguas residuales.");
    m.push(v.q_no3<=5?"Nitratos bajos.":v.q_no3<=20?"Nitratos elevados: riesgo de eutrofización.":"<b style='color:var(--bad)'>Nitratos muy altos:</b> fertilizantes o aguas residuales.");
    m.push(v.q_sec>=2?"Agua transparente.":v.q_sec>=0.7?"Agua algo turbia.":"<b style='color:var(--bad)'>Agua muy turbia:</b> sedimentos o floración de algas.");
    const bad=(v.q_do<4)+(v.q_bod>8)+(v.q_no3>20)+(v.q_sec<0.7);
    $("#qd2").innerHTML=m.join("<br>")+`<br><b>Conclusión:</b> ${bad===0?"agua de buena calidad.":bad<=2?"calidad regular; hay signos de contaminación.":"agua muy contaminada, con signos de eutrofización o aguas residuales."} ${v.q_bod>8&&v.q_do<4?"La DBO alta explica el oxígeno bajo: las bacterias lo están consumiendo.":""}`};
  ["q_do","q_bod","q_no3","q_sec"].forEach(id=>$("#"+id).oninput=qa);qa();
  classifier($("#pnbox"),"¿Fuente puntual o difusa?","4.4.1 · ¿Se puede señalar un único origen?",PN_ITEMS,PN_CATS);
  classifier($("#mlbox"),"¿En qué nivel del modelo de gestión?","4.4.8 · Clasifica cada estrategia.",ML_ITEMS,ML_CATS);
}
S44.practice=practice44;

   tip:"Los tres nutrientes principales: N, P y K. Son los que aparecen en las etiquetas de los fertilizantes."},
  {c:"5.1.10",t:"Biodiversidad del suelo",

   html:`<ul><li><b>Bacterias:</b> fijan nitrógeno y descomponen materia orgánica.</li>

   <li><b>Animales:</b> lombrices, nematodos, ácaros, insectos.</li>

  {c:"5.1.11",t:"Detritívoros y saprótrofos",

  {c:"5.1.12",t:"Textura del suelo",

   html:`<div class="defgrid">
   <div class="def"><h4>Arena</h4><p>Partículas grandes. Drena rápido, retiene poca agua y pocos nutrientes, bien aireada.</p></div>
   <div class="def"><h4>Limo</h4><p>Partículas medianas. Retención moderada; común en llanuras de inundación.</p></div>
   <div class="def"><h4>Arcilla</h4><p>Partículas muy finas. Retiene mucha agua y nutrientes, pero drena mal y se compacta.</p></div>

  {c:"5.1.13",t:"Humus y productividad",
   s:"El humus aumenta la productividad primaria de los suelos.",
   html:`<ul><li>El humus es materia orgánica oscura y descompuesta, sobre todo en el horizonte A.</li>
   <li>Mejora la retención de agua y nutrientes, la aireación y la estructura del suelo.</li>
   <li>La deforestación, el sobrepastoreo y la agricultura intensiva lo agotan.</li></ul>`,
   tip:"El humus combina las ventajas de la arena y la arcilla: retiene agua y nutrientes sin compactar el suelo."},
  {c:"5.1.14",t:"El suelo como sumidero o fuente de carbono",
   s:"El suelo puede actuar como sumidero o como fuente de carbono.",
   html:`<ul><li>Guarda carbono como materia orgánica y carbonatos.</li>

   tip:"Relaciona con 2.3.8: la labranza cero y los cultivos de cobertura convierten el suelo agrícola en sumidero."}

function texClass(sa,si,cl){
  if(si+1.5*cl<15)return"Arenoso";
  if(si+1.5*cl>=15&&si+2*cl<30)return"Arenoso franco";
  if((cl>=7&&cl<20&&sa>52&&si+2*cl>=30)||(cl<7&&si<50&&si+2*cl>=30))return"Franco arenoso";
  if(cl>=7&&cl<27&&si>=28&&si<50&&sa<=52)return"Franco";
  if((si>=50&&cl>=12&&cl<27)||(si>=50&&si<80&&cl<12))return"Franco limoso";
  if(si>=80&&cl<12)return"Limoso";
  if(cl>=20&&cl<35&&si<28&&sa>45)return"Franco arcillo-arenoso";
  if(cl>=27&&cl<40&&sa>20&&sa<=45)return"Franco arcilloso";
  if(cl>=27&&cl<40&&sa<=20)return"Franco arcillo-limoso";
  if(cl>=35&&sa>45)return"Arcillo-arenoso";
  if(cl>=40&&si>=40)return"Arcillo-limoso";
  if(cl>=40&&sa<=45&&si<40)return"Arcilloso";
  return"Franco";
}

  let y=0,g=`<svg viewBox="0 0 200 280" style="width:100%;max-width:220px" role="img" aria-label="Perfil del suelo">`;

  document.querySelectorAll(".hz").forEach(el=>{const f=()=>{const h=H[+el.dataset.i];$("#profd").innerHTML=`<b>Horizonte ${h[0]}.</b> ${h[1]}`};el.onclick=f;el.onkeydown=k=>{if(k.key==="Enter"||k.key===" "){k.preventDefault();f()}}});
  const tx=()=>{let sa=+$("#tsa").value,cl=+$("#tcl").value;if(sa+cl>100){cl=100-sa;$("#tcl").value=cl}const si=100-sa-cl;$("#tsav").textContent=sa;$("#tclv").textContent=cl;

}

function practice52(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Compara fuentes de proteína</h3><span class="eyebrow">5.2.10</span></div>
   <p class="prose" style="margin:6px 0 10px">Tierra y emisiones necesarias para producir <b>100 g de proteína</b> de cada alimento. Valores medianos aproximados del estudio de Poore y Nemecek (2018), difundidos por Our World in Data. Elige tus comidas de la semana y compara.</p>
   <div class="seg" id="protm"><button class="opt" data-m="1" aria-pressed="true">Uso de tierra (m²)</button><button class="opt" data-m="2" aria-pressed="false">Emisiones (kg CO₂e)</button></div>
   <div id="protb" style="display:grid;gap:6px;margin-top:12px"></div>
   <div style="margin-top:14px"><b style="font-family:var(--f-display)">Tu semana:</b> elige la fuente de proteína principal de 7 almuerzos.</div>
   <div id="week" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px"></div>
   <div class="detail" id="weekd" style="margin-top:10px"></div></div>
  <div class="card" id="fsbox"></div>`;
  let pm=1;
  const pb=()=>{const mx=Math.max(...PROT.map(x=>x[pm]));$("#protb").innerHTML=PROT.map(x=>`<div style="display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem"><span>${x[0]}</span><span style="background:var(--sunk);height:14px;border-radius:7px;overflow:hidden"><i style="display:block;height:100%;width:${Math.max(1,x[pm]/mx*100)}%;background:${pm===1?"var(--antropo)":"var(--bad)"}"></i></span><span class="mono" style="font-size:.85rem">${String(x[pm]).replace(".",",")}</span></div>`).join("")};
  p.querySelectorAll("#protm .opt").forEach(b=>b.onclick=()=>{pm=+b.dataset.m;p.querySelectorAll("#protm .opt").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));pb()});pb();
  const days=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],sel=[0,4,0,8,4,0,6];
  $("#week").innerHTML=days.map((d,i)=>`<label style="font-size:.85rem;display:grid;gap:2px"><span>${d}</span><select id="wk${i}" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:.85rem">${PROT.map((x,j)=>`<option value="${j}" ${j===sel[i]?"selected":""}>${x[0]}</option>`).join("")}</select></label>`).join("");
  const wk=()=>{let land=0,co=0;days.forEach((_,i)=>{const x=PROT[+$("#wk"+i).value];land+=x[1]*0.3;co+=x[2]*0.3});const veg=PROT[8];const vl=veg[1]*0.3*7,vc=veg[2]*0.3*7;
    $("#weekd").innerHTML=`Suponiendo 30 g de proteína por almuerzo, tu semana usa unos <b>${Math.round(land)} m² de tierra</b> y emite unos <b>${co.toFixed(1).replace(".",",")} kg de CO₂e</b>.<br>Con legumbres los 7 días serían ${Math.round(vl)} m² y ${vc.toFixed(1).replace(".",",")} kg CO₂e. ${land>vl*5?"Cambiar algunos días de carne de res por pollo, huevos o menestra reduciría mucho tu huella.":"Tu elección de proteínas ya tiene una huella relativamente baja."}`};
  days.forEach((_,i)=>$("#wk"+i).onchange=wk);wk();
  classifier($("#fsbox"),"¿Qué dimensión de la seguridad alimentaria falla?","5.2.12 · Disponibilidad, acceso, utilización o estabilidad.",FS_ITEMS,FS_CATS);
}

const S61={
 code:"6.1",title:"Introducción a la atmósfera",hours:"2 horas de clase",src:"https://www.mrgscience.com/ess-subtopic-61-introduction-to-the-atmosphere.html",
 intro:"La atmósfera es una capa delgada de gases que separa la vida de la Tierra del espacio. Nos da oxígeno, nos protege de la radiación y mantiene una temperatura habitable gracias al efecto invernadero natural. Este subtema explica su composición, cómo el calentamiento desigual del planeta mueve el aire y por qué el aumento de gases de efecto invernadero está calentando la Tierra.",
 guiding:["¿Cómo sostiene la atmósfera la vida en la Tierra?","¿En qué se diferencia el efecto invernadero natural del aumentado por los humanos?"],
 und:[
  {c:"6.1.1",t:"La atmósfera: frontera y soporte de la vida",
   s:"La atmósfera es la frontera entre la Tierra y el espacio, y su composición y procesos sostienen la vida.",
   html:`<ul><li><b>Composición del aire seco:</b> nitrógeno ~78 %, oxígeno ~21 %, argón ~0,9 %, dióxido de carbono ~0,04 % (más de 420 ppm), y trazas de otros gases. El vapor de agua varía de 0 a 4 %.</li>
   <li>El nitrógeno se necesita para fabricar proteínas (a través del ciclo del nitrógeno). El oxígeno permite la respiración. El CO₂ se usa en la fotosíntesis y retiene calor.</li>
   <li><b>Capas:</b> troposfera (donde ocurre el tiempo atmosférico), estratosfera (con la capa de ozono), mesosfera, termosfera y exosfera. Las actividades humanas afectan sobre todo a las dos primeras.</li>
   <li>La atmósfera es un sistema con entradas (erupciones, evaporación, emisiones, respiración) y salidas (precipitación, fotosíntesis).</li></ul>`,
   tip:"Error común: decir que el CO₂ es el gas más abundante. Es menos del 0,05 % del aire, pero su efecto en el clima es enorme."},
  {c:"6.1.2",t:"Calentamiento desigual y modelo tricelular",
   s:"El calentamiento desigual de la Tierra impulsa la circulación atmosférica, explicada por el modelo tricelular.",
   html:`<ul><li>Por la forma esférica de la Tierra, el ecuador recibe la luz solar de forma más directa que los polos.</li>
   <li>Ese calentamiento desigual mueve el aire y las corrientes oceánicas, que reparten el calor hacia los polos.</li>
   <li>Tres celdas en cada hemisferio: Hadley, Ferrel y Polar (repasa 2.4.5).</li>
   <li>El <b>efecto Coriolis</b>, causado por la rotación de la Tierra, desvía los vientos. En los límites entre celdas se forman corrientes en chorro.</li></ul>`,
   tip:"Relaciona con el balance energético: la Tierra recibe y emite energía; el desequilibrio entre ecuador y polos es lo que mueve el aire."},
  {c:"6.1.3",t:"Gases de efecto invernadero y aerosoles",
   s:"Los gases de efecto invernadero y los aerosoles absorben y reemiten la radiación infrarroja de la superficie terrestre.",
   html:`<ul><li>Principales gases de efecto invernadero: vapor de agua, CO₂, metano (CH₄) y óxido nitroso (N₂O).</li>
   <li><b>Potencial de calentamiento global (CO₂e):</b> compara el efecto de un gas con el del CO₂ en 100 años. Una tonelada de metano calienta unas 28 veces más que una de CO₂.</li>

function practice61(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Simulador del efecto invernadero</h3><span class="eyebrow">6.1.3 · 6.1.4</span></div>
   <p class="prose" style="margin:6px 0 10px">Cambia la concentración de CO₂ y observa la temperatura media aproximada. Modelo <b>muy simplificado</b> basado en la sensibilidad climática de largo plazo (unos 3 °C por cada duplicación del CO₂). El calentamiento real tarda décadas en manifestarse.</p>
   <div class="ctl"><label for="ghg">CO₂ atmosférico: <b id="ghgv">280</b> ppm</label><input type="range" id="ghg" min="0" max="1120" step="10" value="280"></div>
   <div class="graph" id="ghgd" style="margin-top:10px"></div><div class="detail" id="ghgt" style="margin-top:10px"></div></div>
  <div class="card" id="rfbox"></div>`;
  const g1=()=>{const c=+$("#ghg").value;$("#ghgv").textContent=c;
    const T=c<=0?-18:Math.min(30,Math.max(-18,13.9+3*Math.log2(Math.max(c,1)/280)));const t=c===0?-18:(c<40?-18+(T+18)*c/40:T);
    const n=Math.round(c/40);let arrows="";
    const W=600,H=260;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama del efecto invernadero"><defs><marker id="gah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ochre)"/></marker><marker id="gah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--bad)"/></marker></defs>`;
    g+=`<rect x="0" y="0" width="${W}" height="${H}" fill="var(--tecno-soft)"/><rect x="0" y="60" width="${W}" height="140" fill="var(--sunk)" opacity=".6"/><text x="10" y="80" font-size="11" fill="var(--muted)">Atmósfera</text>`;
    for(let i=0;i<Math.min(n,28);i++){const x=20+((i*53)%560),y=95+((i*37)%90);g+=`<circle cx="${x}" cy="${y}" r="4" fill="var(--muted)" opacity=".55"/>`}
    g+=`<rect x="0" y="200" width="${W}" height="60" fill="var(--eco)" fill-opacity=".55"/><text x="10" y="248" font-size="12" font-weight="700" fill="var(--ink)">Superficie: ${t.toFixed(1).replace(".",",")} °C</text>`;
    g+=`<line x1="120" y1="10" x2="200" y2="196" stroke="var(--ochre)" stroke-width="4" marker-end="url(#gah)"/><text x="60" y="30" font-size="11" fill="var(--ink)">Luz solar (onda corta)</text>`;
    const back=Math.min(1,c/600);
    g+=`<line x1="340" y1="200" x2="420" y2="12" stroke="var(--bad)" stroke-width="${4*(1-back*0.6)}" marker-end="url(#gah2)"/><text x="430" y="30" font-size="11" fill="var(--ink)">Infrarrojo que escapa</text>`;
    if(c>0)g+=`<line x1="380" y1="110" x2="460" y2="198" stroke="var(--bad)" stroke-width="${1+4*back}" stroke-dasharray="6 4" marker-end="url(#gah2)"/><text x="470" y="150" font-size="11" fill="var(--ink)">Infrarrojo reemitido</text>`;
    g+=`</svg>`;$("#ghgd").innerHTML=g;
    $("#ghgt").innerHTML=`Temperatura media aproximada: <b>${t.toFixed(1).replace(".",",")} °C</b>. ${c===0?"Sin gases de efecto invernadero: la Tierra sería un planeta helado.":c<=290?"Similar a la era preindustrial (unos 280 ppm).":c<=440?"Similar a la actualidad (más de 420 ppm). Aunque el CO₂ ya subió, parte del calentamiento aún no se ha manifestado.":c<=600?"Escenario futuro con emisiones moderadas a altas.":"Escenario de emisiones muy altas: calentamiento peligroso."}`};
  $("#ghg").oninput=g1;g1();
  classifier($("#rfbox"),"¿Forzamiento radiativo positivo o negativo?","6.1.3 · ¿Calienta o enfría?",RF_ITEMS,RF_CATS);
}

   html:`<ul><li><b>Bióticos</b> (vivos): bosques, peces, cultivos. <b>Abióticos</b> (no vivos): minerales, agua, petróleo.</li>
   <li><b>Renovables</b> (se regeneran) y <b>no renovables</b> (finitos a escala humana).</li>
   <li>Ejemplos: luz solar (fotosíntesis, energía solar), agua (consumo, riego, hidroelectricidad), suelo, minerales, ecosistemas.</li></ul>`,
   tip:"Clasifica cualquier recurso en dos ejes: biótico o abiótico, y renovable o no renovable."},
  {c:"7.1.2",t:"Capital natural",
   s:"El capital natural es el conjunto de recursos de la Tierra que proporcionan bienes y servicios.",
   html:`<div class="defgrid">
   <div class="def"><h4>Renovable</h4><p>Se regenera por procesos naturales en poco tiempo: bosques, peces, agua dulce de ríos.</p></div>
   <div class="def"><h4>Reponible (replenishable)</h4><p>Se renueva, pero lentamente: agua subterránea, suelo, la capa de ozono.</p></div>
   <div class="def"><h4>No renovable</h4><p>Existe en cantidad fija a escala humana: petróleo, gas, oro, cobre.</p></div></div>
   <p style="margin-top:12px">Ejemplos del Ecuador: bosques amazónicos, páramos (agua), manglares, petróleo del oriente, oro y cobre del sur, suelos volcánicos de la Sierra.</p>`,
   tip:"Usa la analogía bancaria: el capital natural es el dinero en el banco; si solo usas los intereses (ingreso natural), el capital se mantiene."},
  {c:"7.1.3",t:"Ingreso natural",
   s:"El ingreso natural es el flujo anual de bienes y servicios que produce el capital natural.",
   html:`<div class="defgrid">
   <div class="def"><h4>Bienes</h4><p>Productos tangibles: madera, peces, frutas, agua potable.</p></div>
   <div class="def"><h4>Servicios</h4><p>Funciones que sostienen la vida: regulación del clima, control de inundaciones, polinización, purificación del agua.</p></div></div>
   <p style="margin-top:12px">Si se consume solo el ingreso (lo que el bosque produce cada año) y no el capital (el bosque mismo), el uso es sostenible.</p>`,
   tip:"Pregunta clásica: diferencia entre capital natural (el almacén) e ingreso natural (el flujo anual)."},
  {c:"7.1.4",t:"Ver la naturaleza como capital",
   s:"Usar los términos capital natural e ingreso natural refleja una perspectiva particular sobre la naturaleza.",
   html:`<ul><li>Es una visión <b>antropocéntrica</b>: la naturaleza vale por lo que aporta a las personas.</li>
   <li>Ventaja: permite poner precio a la naturaleza y argumentar su conservación en términos económicos.</li>
   <li>Riesgo: puede justificar la explotación y olvidar el valor intrínseco de la naturaleza.</li>
   <li>Una visión <b>ecocéntrica</b> rechaza tratar a la naturaleza como un simple recurso (como la Constitución del Ecuador al reconocer derechos de la naturaleza).</li></ul>`,
   tip:"Conecta con 1.1.8: esta terminología encaja con una cosmovisión antropocéntrica o tecnocéntrica."},
  {c:"7.1.5",t:"Servicios ecosistémicos",
   s:"Los ecosistemas proporcionan servicios que sostienen la vida.",
   html:`<ul><li><b>Reposición de agua:</b> páramos y humedales que alimentan ríos y acuíferos.</li>
   <li><b>Protección contra inundaciones y erosión:</b> manglares y marismas costeras.</li>
   <li><b>Mitigación de la contaminación:</b> humedales que filtran nitrógeno y fósforo.</li>
   <li><b>Captura de carbono:</b> bosques y manglares.</li>
   <li>Eliminar la vegetación tiene costos reales: hay que construir muros, plantas de tratamiento o pagar por los daños.</li>
   <li>Poner un valor económico a estos servicios es difícil, pero ayuda en las decisiones.</li></ul>`,
   tip:"Para cada servicio, di qué ecosistema lo presta y qué costaría reemplazarlo con tecnología."},
  {c:"7.1.6",t:"Todos los recursos son finitos",
   s:"Todos los recursos son finitos; los renovables solo son sostenibles si se usan por debajo de su tasa de regeneración.",
   html:`<ul><li>Si se pesca más rápido de lo que los peces se reproducen, el recurso renovable se agota como si fuera no renovable.</li>
   <li>Ejemplos: deforestación, sobrepesca, sobreexplotación de acuíferos.</li>
   <li>Los recursos no renovables (petróleo, minerales) se agotan con el uso, aunque nuevas tecnologías y descubrimientos pueden alargar su disponibilidad.</li></ul>`,
   tip:"Un recurso renovable deja de serlo en la práctica si la tasa de uso supera la de regeneración."},
  {c:"7.1.7",t:"Los valores del capital natural",
   s:"El capital natural tiene distintos tipos de valor.",
   html:`<div class="defgrid">
   <div class="def"><h4>Económico</h4><p>Madera, petróleo, turismo.</p></div>
   <div class="def"><h4>Ecológico</h4><p>Servicios ecosistémicos.</p></div>
   <div class="def"><h4>Estético</h4><p>Paisajes como el Cotopaxi o la laguna del Quilotoa.</p></div>
   <div class="def"><h4>Cultural y espiritual</h4><p>Lugares sagrados, como cerros y lagunas en la cosmovisión andina.</p></div>
   <div class="def"><h4>Científico y tecnológico</h4><p>Biomimética, nuevos medicamentos.</p></div>
   <div class="def"><h4>Intrínseco</h4><p>Valor por sí mismo, sin relación con las personas.</p></div></div>
   <p style="margin-top:12px">Algunos valores (estético, intrínseco, espiritual) son muy difíciles de expresar en dinero.</p>`,
   tip:"Relaciona con 1.1.3: valores instrumentales, intrínsecos y relacionales."},
  {c:"7.1.8",t:"El valor de un recurso cambia",
   s:"El valor de un recurso cambia con el tiempo y el lugar según factores culturales, económicos, tecnológicos y políticos.",
   html:`<ul><li>El petróleo casi no tenía valor antes de los motores; hoy es esencial.</li>
   <li>El litio era poco importante y hoy vale mucho por las baterías de celulares y autos eléctricos.</li>
   <li>La paja toquilla, con la que se tejen los sombreros de paja toquilla (famosos como «Panama hat»), ganó valor con la exportación.</li>
   <li>Las puntas de flecha de piedra fueron recursos valiosos y hoy son solo objetos históricos.</li></ul>`,
   tip:"Da un ejemplo de recurso que ganó valor y otro que lo perdió, con la razón (tecnología, moda, política)."},
  {c:"7.1.9",t:"Gestionar el capital natural",
   s:"La gestión sostenible del capital natural exige no usar los recursos más rápido de lo que se regeneran ni producir residuos más rápido de lo que el ambiente puede absorber.",
   html:`<ul><li><b>Pesca:</b> cuotas, áreas marinas protegidas, rendimiento máximo sostenible (4.3).</li>
   <li><b>Turismo en Galápagos:</b> cupos de visitantes, zonificación, guías obligatorios.</li>
   <li><b>Bosques:</b> tala selectiva, reforestación, certificación FSC, acuerdos con pueblos indígenas.</li></ul>`,
   tip:"Las dos reglas de la sostenibilidad: uso ≤ regeneración y residuos ≤ capacidad de absorción."},
  {c:"7.1.10",t:"Seguridad de los recursos",
   s:"La seguridad de los recursos es tener un suministro confiable a largo plazo para satisfacer la demanda.",
   html:`<ul><li>Depende de la geografía, la riqueza económica, la estabilidad política y la tecnología.</li>
   <li><b>Seguridad alimentaria:</b> afectada por el cambio climático, la desigualdad, los conflictos y el crecimiento poblacional (5.2.12).</li>
   <li><b>Seguridad hídrica:</b> Israel recicla la mayor parte de sus aguas residuales y usa desalinización y riego por goteo (4.2).</li>
   <li><b>Seguridad energética:</b> la sequía de 2024 en Ecuador mostró el riesgo de depender casi de una sola fuente (7.2).</li></ul>`,
   tip:"Usa un mismo esquema para cualquier recurso: ¿hay suficiente?, ¿es accesible?, ¿es confiable en el tiempo?"},
  {c:"7.1.11",t:"Factores en la elección de recursos",
   s:"Las sociedades eligen cómo usar los recursos según factores económicos, socioculturales, políticos, ambientales, geográficos, tecnológicos e históricos.",
   html:`<ul><li><b>Geográficos:</b> Noruega usa hidroelectricidad por sus montañas y ríos; Ecuador también.</li>
   <li><b>Económicos:</b> el gas barato de esquisto en EE. UU.</li>
   <li><b>Políticos:</b> Francia apostó por la energía nuclear; Alemania por las renovables.</li>
   <li><b>Socioculturales:</b> bosques sagrados en India que se conservan por creencias religiosas.</li>
   <li><b>Históricos:</b> el carbón en la Revolución Industrial británica; el petróleo en la economía ecuatoriana desde los años setenta.</li></ul>`,
   tip:"Para analizar la elección de un país, nombra al menos tres factores de categorías distintas."}
 ],

function practice71(p){
  p.innerHTML=`<div class="card"><div class="rowhead"><h3>Capital e ingreso: el banco de la naturaleza</h3><span class="eyebrow">7.1.2 · 7.1.3</span></div>
   <p class="prose" style="margin:6px 0 10px">Un bosque tiene 1000 árboles, su máximo posible. Crece más rápido cuando tiene espacio libre: como máximo unos 50 árboles nuevos al año, cuando está a la mitad. Decide cuántos árboles talar cada año durante 20 años. Modelo <b>simplificado</b> (crecimiento logístico).</p>
   <div class="ctl"><label for="cut">Árboles talados por año: <b id="cutv">40</b></label><input type="range" id="cut" min="0" max="120" step="5" value="40"></div>
   <div class="graph" id="capg" style="margin-top:10px"></div><div class="detail" id="capd" style="margin-top:10px"></div></div>
  <div class="card" id="ncbox"></div><div class="card" id="gsbox"></div>`;
  const cp=()=>{const c=+$("#cut").value;$("#cutv").textContent=c;let s=[1000];for(let y=1;y<=20;y++){const prev=s[y-1];const grow=Math.min(1000,prev+prev*0.05*(1-prev/1000)*4)-prev;s.push(Math.max(0,Math.min(1000,prev+grow-c)))}
    $("#capg").innerHTML=lineChart({xmin:0,xmax:20,ymax:1000,xticks:[0,5,10,15,20],yticks:[0,250,500,750,1000],xlab:"Años",ylab:"Árboles en el bosque",label:"Capital natural del bosque",series:[{pts:s.map((v,i)=>[i,v]),color:"var(--eco)"}]});
    const fin=Math.round(s[20]);
    $("#capd").innerHTML=`Tras 20 años quedan <b>${fin} árboles</b>. ${fin>=900?"Estás usando solo el ingreso natural: el capital se mantiene.":fin>0?"Estás consumiendo parte del capital: el bosque se reduce y producirá menos cada año.":"<b>Agotaste el capital.</b> Ya no hay ingreso natural: el bosque desapareció."} El crecimiento es máximo cuando el bosque está a la mitad de su tamaño; por eso un bosque reducido puede soportar algo más de tala, pero arriesga colapsar.`};
  $("#cut").oninput=cp;cp();
  classifier($("#ncbox"),"¿Qué tipo de capital natural?","7.1.2 · Renovable, reponible o no renovable.",NC_ITEMS,NC_CATS);
  classifier($("#gsbox"),"¿Bien o servicio?","7.1.3 · 7.1.5 · Clasifica el ingreso natural.",GS_ITEMS,GS_CATS);
}
S71.practice=practice71;

 intro:"Casi toda la energía que usamos viene, directa o indirectamente, del Sol. Ecuador genera gran parte de su electricidad con hidroeléctricas, pero mueve sus autos y buses con derivados del petróleo. Este subtema compara fuentes renovables y no renovables, analiza por qué el consumo de energía sigue creciendo, qué factores influyen en la elección de un país y cómo el almacenamiento, la conservación y la eficiencia ayudan en la transición energética.",
 guiding:["¿Qué hace más o menos sostenible a una fuente de energía?","¿Qué factores determinan la mezcla energética de un país?"],
 und:[
  {c:"7.2.1",t:"Fuentes renovables y no renovables",
   s:"Las fuentes de energía pueden ser renovables o no renovables.",
   html:`<div class="defgrid">
   <div class="def"><h4>Renovables</h4><p>Se reponen naturalmente en poco tiempo: solar, eólica, hidroeléctrica, geotérmica, mareomotriz, biomasa.</p></div>

   tip:"La nuclear es baja en carbono pero no renovable: es una trampa común en el examen."},

  {c:"7.2.3",t:"Sostenibilidad de las fuentes",

   <div class="def"><h4>Carbón</h4><p>El más contaminante: más CO₂ por unidad de energía, lluvia ácida, minería destructiva.</p></div>

  {c:"7.2.4",t:"Factores en la elección energética",

function practice72(p){
  p.innerHTML=`<div class="card"><div class="rowhead"><h3>Diseña la mezcla eléctrica de un país</h3><span class="eyebrow">7.2.3 · 7.2.4</span></div>
   <p class="prose" style="margin:6px 0 10px">Reparte la producción de electricidad entre fuentes y observa las emisiones medias por kilovatio-hora. Valores <b>aproximados</b> de emisiones en todo el ciclo de vida (medianas del IPCC, en gramos de CO₂e por kWh). Los porcentajes se ajustan para sumar 100.</p>
   <div id="mixs" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px"></div>
   <div id="mixbar" style="display:flex;height:24px;border-radius:6px;overflow:hidden;margin-top:12px;border:1px solid var(--line)"></div>
   <div class="detail" id="mixd" style="margin-top:10px"></div></div>
  <div class="card" id="rn2box"></div><div class="card" id="cebox"></div>`;
  const def=[0,10,10,2,3,0,70,0,5];
  $("#mixs").innerHTML=MIX.map((m,i)=>`<div class="ctl"><label for="mx${i}">${m[0]} <span class="en">${m[1]} g/kWh</span>: <b id="mx${i}v">${def[i]}</b></label><input type="range" id="mx${i}" min="0" max="100" step="5" value="${def[i]}"></div>`).join("");
  const mx=()=>{const v=MIX.map((_,i)=>+$("#mx"+i).value);const tot=v.reduce((a,b)=>a+b,0)||1;const pct=v.map(x=>x/tot*100);
    MIX.forEach((_,i)=>$("#mx"+i+"v").textContent=v[i]);
    $("#mixbar").innerHTML=pct.map((x,i)=>x>0?`<div title="${MIX[i][0]}" style="width:${x}%;background:${MIX[i][2]}"></div>`:"").join("");
    const g=pct.reduce((a,x,i)=>a+x/100*MIX[i][1],0);const inter=pct[4]+pct[8];const ren=pct[3]+pct[4]+pct[5]+pct[6]+pct[8];
    $("#mixd").innerHTML=`Emisiones medias: <b>${Math.round(g)} g CO₂e/kWh</b>. Renovables: <b>${Math.round(ren)} %</b>. Fuentes intermitentes (solar y eólica): <b>${Math.round(inter)} %</b>.<br>${g<100?"Mezcla muy baja en carbono.":g<400?"Emisiones moderadas.":"Mezcla muy contaminante, dominada por combustibles fósiles."} ${inter>40?"Con tanta energía intermitente necesitarás almacenamiento (baterías, bombeo) o respaldo.":""} ${pct[6]>60?"Depender tanto de la hidroelectricidad te hace vulnerable a las sequías.":""}`};
  MIX.forEach((_,i)=>$("#mx"+i).oninput=mx);mx();
  classifier($("#rn2box"),"¿Renovable o no renovable?","7.2.1 · Clasifica cada fuente.",RN2_ITEMS,RN2_CATS);
  classifier($("#cebox"),"¿Conservación o eficiencia?","7.2.6 · ¿Cambia el comportamiento o la tecnología?",CE_ITEMS,CE_CATS);
}

const S81={
 code:"8.1",title:"Dinámica de poblaciones humanas",hours:"3 horas de clase",src:"https://www.mrgscience.com/ess-subtopic-81-human-populations-dynamics.html",
 intro:"La población mundial pasó de unos 1000 millones de personas en 1800 a más de 8000 millones hoy. Ecuador tenía menos de 4 millones en 1950 y en el censo de 2022 contó unos 17 millones. Este subtema explica cómo se mide el crecimiento de una población, cómo leer pirámides de población, qué describe el modelo de transición demográfica y cómo los gobiernos intentan influir en el crecimiento.",
 guiding:["¿Cómo se mide y se explica el crecimiento de las poblaciones humanas?","¿Cómo intentan los gobiernos influir en el tamaño de la población?"],
 und:[
  {c:"8.1.1",t:"Entradas: nacimientos e inmigración",
   s:"Los nacimientos y la inmigración son entradas a una población.",
   html:`<ul><li>La población es un almacén con entradas (nacimientos, inmigración) y salidas (muertes, emigración).</li>
   <li><b>Tasa bruta de natalidad (TBN):</b> nacimientos por cada 1000 habitantes en un año.</li>
   <li><b>Tasa global de fecundidad (TGF):</b> promedio de hijos por mujer durante su vida reproductiva. Unos <b>2,1 hijos</b> es el nivel de reemplazo (la población se mantiene sin migración).</li>
   <li>Factores: acceso a salud y planificación familiar, educación de las mujeres, cultura y religión, situación económica.</li></ul>`,
   tip:"La TBN no tiene en cuenta la estructura por edad; la TGF sí es comparable entre países con poblaciones distintas."},
  {c:"8.1.2",t:"Salidas: muertes y emigración",
   s:"Las muertes y la emigración son salidas de una población.",
   html:`<ul><li><b>Tasa bruta de mortalidad (TBM):</b> muertes por cada 1000 habitantes en un año.</li>
   <li><b>Tasa de mortalidad infantil:</b> muertes de menores de un año por cada 1000 nacidos vivos; buen indicador de salud y desarrollo.</li>
   <li>Factores: atención médica, saneamiento, nutrición, enfermedades, estructura por edad.</li>
   <li>Un país rico con población envejecida puede tener una TBM más alta que un país en desarrollo con población joven.</li>
   <li>Ecuador vivió grandes olas de emigración, por ejemplo tras la crisis económica de 1999-2000, sobre todo hacia España, Italia y Estados Unidos.</li></ul>`,
   tip:"Una TBM alta no siempre significa mala salud: puede indicar una población envejecida."},
  {c:"8.1.3",t:"Medir la dinámica de una población",
   s:"La dinámica de una población se puede cuantificar con la tasa global de fecundidad, la esperanza de vida, el tiempo de duplicación y la tasa de crecimiento natural.",
   html:`<p style="font-family:var(--f-mono);font-size:1rem;background:var(--sunk);padding:10px 14px;border-radius:8px">TBN = (nacimientos ÷ población) × 1000<br>TBM = (muertes ÷ población) × 1000<br>Crecimiento natural (%) = (TBN − TBM) ÷ 10<br>Tiempo de duplicación (años) ≈ 70 ÷ crecimiento (%)</p>
   <ul><li>Ej.: TBN 25, TBM 10 → crecimiento natural 1,5 % → tiempo de duplicación ≈ 70 ÷ 1,5 ≈ 47 años.</li>
   <li><b>Esperanza de vida:</b> años que se espera que viva en promedio una persona al nacer.</li></ul>
   <p>Practica los cálculos en la pestaña <b>Practica</b>.</p>`,
   tip:"Cuidado con las unidades: TBN y TBM van por mil; el crecimiento natural se pasa a porcentaje dividiendo entre 10."},
  {c:"8.1.4",t:"Crecimiento global y proyecciones",
   s:"La población mundial ha seguido una curva de crecimiento rápido, y los modelos permiten proyectar su crecimiento futuro.",
   html:`<ul><li>Durante miles de años la población creció muy lentamente; desde la Revolución Industrial (alrededor de 1800) el crecimiento se aceleró por la medicina, el saneamiento y la producción de alimentos.</li>
   <li>Hoy el crecimiento se está desacelerando porque la fecundidad baja en casi todo el mundo.</li>
   <li>La ONU proyecta escenarios de fecundidad alta, media y baja. En el escenario medio, la población alcanzaría un máximo de algo más de 10 000 millones en la segunda mitad de este siglo.</li></ul>`,
   tip:"Los modelos dependen de supuestos sobre la fecundidad; por eso hay escenarios distintos y ninguno es seguro."},
  {c:"8.1.5",t:"Gestión directa: políticas de población",
   s:"Los gobiernos pueden gestionar el crecimiento de la población directamente con políticas de natalidad y de migración.",
   html:`<div class="defgrid">
   <div class="def"><h4>Antinatalistas</h4><p>Buscan reducir los nacimientos: límites legales, multas, planificación familiar. Ej.: la política del hijo único en China (1979-2015), que frenó el crecimiento pero causó envejecimiento y desequilibrio entre hombres y mujeres.</p></div>
   <div class="def"><h4>Pronatalistas</h4><p>Buscan aumentar los nacimientos: bonos por hijo, licencias de maternidad y paternidad largas, guarderías. Ej.: Francia mantiene una de las fecundidades más altas de Europa.</p></div>
   <div class="def"><h4>Migratorias</h4><p>Regulan la entrada y salida: sistemas de puntos para atraer trabajadores calificados (Australia), incentivos para el retorno de emigrantes.</p></div></div>
   <p style="margin-top:12px">Su éxito depende de la cultura, la religión, los incentivos económicos y la estabilidad política.</p>`,
   tip:"Al evaluar una política, menciona tanto su efecto en el crecimiento como sus consecuencias no deseadas."},
  {c:"8.1.6",t:"Gestión indirecta",
   s:"El crecimiento de la población puede gestionarse indirectamente con políticas económicas, sociales, de salud y de desarrollo.",
   html:`<ul><li><b>Educación de las mujeres:</b> las mujeres con más años de estudio suelen tener menos hijos y más tarde (Bangladesh).</li>
   <li><b>Salud:</b> cuando baja la mortalidad infantil, las familias tienen menos hijos porque confían en que sobrevivirán.</li>
   <li><b>Transferencias condicionadas:</b> el programa Bolsa Família en Brasil, y el Bono de Desarrollo Humano en Ecuador, entregan dinero a familias pobres a cambio de que los hijos asistan a la escuela y a controles de salud.</li>
   <li><b>Empleo rural:</b> programas que reducen la migración del campo a la ciudad (India).</li>
   <li>Se relaciona con los ODS 3 (salud), 4 (educación) y 5 (igualdad de género).</li></ul>`,
   tip:"Diferencia directa (la política busca cambiar la natalidad o la migración) de indirecta (la política busca otro objetivo, como la educación, pero cambia la natalidad)."},
  {c:"8.1.7",t:"Pirámides de población",
   s:"Las pirámides de población por edad y sexo permiten representar y comparar la composición de una población.",
   html:`<ul><li><b>Base ancha:</b> natalidad alta, población joven.</li>
   <li><b>Base estrecha:</b> natalidad baja.</li>
   <li><b>Lados casi verticales y cima ancha:</b> mortalidad baja, población envejecida.</li>
   <li><b>Lados cóncavos:</b> mortalidad alta.</li>
   <li><b>Abultamientos:</b> inmigración o un auge de nacimientos. <b>Entrantes:</b> emigración, guerras o epidemias.</li>
   <li>Ejemplos: Nigeria (forma de pirámide, población joven) frente a Japón (forma de urna, población envejecida).</li></ul>
   <p>Compara pirámides en la pestaña <b>Practica</b>.</p>`,
   tip:"Describe una pirámide de abajo hacia arriba: base (natalidad), lados (mortalidad), cima (esperanza de vida) y anomalías (migración, eventos)."},
  {c:"8.1.8",t:"El modelo de transición demográfica",
   s:"El modelo de transición demográfica describe cómo cambian la natalidad y la mortalidad a medida que un país se desarrolla.",
   html:`<div class="defgrid">
   <div class="def"><h4>Etapa 1</h4><p>Natalidad y mortalidad altas. Población pequeña y estable.</p></div>
   <div class="def"><h4>Etapa 2</h4><p>La mortalidad baja (medicina, saneamiento, alimentos), la natalidad sigue alta: crecimiento muy rápido.</p></div>
   <div class="def"><h4>Etapa 3</h4><p>La natalidad baja (urbanización, educación, anticonceptivos): el crecimiento se desacelera. Ecuador está en esta etapa, avanzando hacia la 4.</p></div>
   <div class="def"><h4>Etapa 4</h4><p>Natalidad y mortalidad bajas. Población grande y estable.</p></div>
   <div class="def"><h4>Etapa 5</h4><p>Natalidad por debajo de la mortalidad: la población envejece y disminuye (Japón, Italia).</p></div></div>
   <p style="margin-top:12px"><b>Limitaciones:</b> se basa en la historia de Europa; no considera la migración; no todos los países siguen el mismo camino ni al mismo ritmo.</p>
   <p>Explora el modelo en la pestaña <b>Practica</b>.</p>`,
   tip:"La idea central: la mortalidad baja antes que la natalidad, y en ese desfase la población crece rápidamente."}

function practice81(p){
  p.innerHTML=`
  <div class="card"><div class="rowhead"><h3>Practica los cálculos demográficos</h3><span class="eyebrow">8.1.3</span></div>

   <div class="fb" id="df" hidden style="margin-top:10px"></div></div>
  <div class="card"><div class="rowhead"><h3>Compara pirámides de población</h3><span class="eyebrow">8.1.7</span></div>

  let dm="tbn",ans=0;const fmt=x=>x.toLocaleString("es");

    if(dm==="tbn"){const pop=(2+Math.floor(Math.random()*18))*100000,r=10+Math.floor(Math.random()*30),b=pop*r/1000;ans=r;$("#dq").innerHTML=`Una provincia tiene <b>${fmt(pop)}</b> habitantes y hubo <b>${fmt(b)}</b> nacimientos en un año. Calcula la tasa bruta de natalidad (por mil).`;}

  (()=>{const W=620,H=260,L=40,R=16,T=16,B=40;const xs=x=>L+x/100*(W-L-R),ys=y=>T+(1-y/50)*(H-T-B);
    const br=x=>x<40?42:x<60?42-(x-40)*1.3:x<80?16-(x-60)*0.3:10-(x-80)*0.05;const dr=x=>x<20?38:x<40?38-(x-20)*1.3:x<80?12-(x-40)*0.05:10+(x-80)*0.15;const pop=x=>8+40/(1+Math.exp(-(x-50)/9));

    const pts=f=>Array.from({length:51},(_,i)=>[i*2,f(i*2)]);const path=f=>pts(f).map((p,i)=>(i?"L":"M")+xs(p[0]).toFixed(1)+","+ys(p[1]).toFixed(1)).join(" ");

    $("#dtm").innerHTML=g;document.querySelectorAll(".dz").forEach(el=>{const f=()=>{const s=ST[+el.dataset.i];$("#dtmd").innerHTML=`<b>${s[0]}.</b> ${s[1]}`};el.onclick=f;el.onkeydown=k=>{if(k.key==="Enter"||k.key===" "){k.preventDefault();f()}}});})();
  classifier($("#ppbox"),"¿Qué tipo de política de población?","8.1.5 · 8.1.6 · Antinatalista, pronatalista o indirecta.",PP_ITEMS,PP_CATS);
